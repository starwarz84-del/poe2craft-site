/* Layout: paste box (left) → item card with every line labelled (right), then a per-modifier analysis list. Same dark system as the recipes page. */
:root{

*{box-sizing:border-box}

.rsteps li.on{border-color:var(--rare)}.rsteps li.on::before{background:var(--rare);color:var(--ink);border-color:var(--rare)}

.rns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.rchip{position:relative;display:inline-block;padding:2px 9px;border:1px solid var(--line);border-radius:999px;color:var(--rune,#9fb4ff);cursor:help}.rchip .rtip{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:20;min-width:220px;max-width:320px;padding:8px 10px;background:var(--bg,#111);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.5);color:var(--text);font-size:12.5px;line-height:1.5;white-space:normal}.rchip:hover .rtip,.rchip:focus .rtip{display:flex;flex-direction:column;gap:2px}.rtip b{color:var(--rune,#9fb4ff);margin-bottom:2px}.rtip em{font-style:normal;color:var(--muted);margin-top:4px}

<script>
const S = { lang:'en', index:null, cache:{}, last:null, txt:'', itab:'item', need:new Set(), soft:new Set(), okQR:false, tsel:{}, buy:new Set() };
try{ const u=new URLSearchParams(location.search).get('lang'); S.lang = u || localStorage.getItem('poe2lang') || 'en'; }catch(e){}
if(S.lang!=='kr') S.lang='en';
const KR = () => S.lang==='kr', L = (kr,en) => KR()?kr:en;
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const pct = (p, d) => p==null ? '—' : p>=0.9995 ? '100%' : p<=0 ? '0%' : (p*100 < 0.01 ? '<0.01%' : (p*100).toFixed(d ?? (p<0.01?2:p<0.1?1:0))+'%');
const tries = p => p>0 && p<1 ? Math.round(1/p).toLocaleString() : null;

/* ---------- text → template matching (same rules as the emulator's item import) ---------- */
const reEsc = t => t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const NUM = '([+-]?\\d+(?:\\.\\d+)?)';
function tplRe(line){ const ranges=[]; let src='';
  line.split(/(\(\d+(?:\.\d+)?—\d+(?:\.\d+)?\))/).forEach(part=>{ const m = part.match(/^\((\d+(?:\.\d+)?)—(\d+(?:\.\d+)?)\)$/);
    if(m){ ranges.push([+m[1],+m[2]]); src+=NUM; } else src += reEsc(part).replace(/\d+(?:\.\d+)?/g, x=>{ ranges.push([+x,+x]); return NUM; }); });
  return {re:new RegExp('^'+src.replace(/\\\+(?=\()/g,'\\+?')+'$','i'), ranges}; }
/* 한글 화면에선 붙여 넣은 영문 옵션 줄을 DB의 한글 문구에 실제 수치를 넣어 보여 줌(사용자 2026-11-12) — 영문 문구 틀과 맞춰 수치를 순서대로 옮김, 못 맞추면 원문 */
/* 범위 수치는 범위끼리 차례로, 고정 수치는 영문 틀에도 같은 수가 있을 때만 옮김 — 한글에만 있는 수('1초마다 생명력 … 재생')는 그대로(W10) */
function xferLine(l, en, kr){ const mm=cleanLine(l).match(tplRe(en).re); if(!mm || !kr) return null; const v=mm.slice(1), R=[], F=[]; let k=0;
  en.split(/(\(\d+(?:\.\d+)?—\d+(?:\.\d+)?\))/).forEach(part=>{ if(/^\(\d/.test(part) && /—/.test(part)) R.push(v[k++]); else (part.match(/\d+(?:\.\d+)?/g)||[]).forEach(x=>F.push([+x, v[k++]])); });
  let ri=0, fi=0;
  const out=kr.split(/(\(\d+(?:\.\d+)?—\d+(?:\.\d+)?\))/).map(part=>/^\(\d/.test(part) && /—/.test(part) ? (R[ri++] ?? part) : part.replace(/\d+(?:\.\d+)?/g, x=>{ const f=F[fi]; if(f && Math.abs(+x)===Math.abs(f[0])){ fi++; return f[1]; } return x; })).join('');
  return ri===R.length && F.slice(fi).every(f=>Math.abs(+f[1])===f[0]) ? out.replace(/\+-(?=\d)/g,'-') : null; }
function locLine(l, t){ if(!KR() || !t?.[4] || !t?.[5] || /[ㄱ-힝]/.test(l)) return l; if(l.includes('\n')) return l.split('\n').map(x=>locLine(x,t)).join('\n');
  const E=t[5].split('\n'), K=t[4].split('\n'); for(let j=0;j<E.length;j++){ const o=xferLine(l, E[j], K[j]); if(o!=null) return o; } return l; }
/* 고정 옵션·룬 줄(it.other)도 한글로: 베이스 고정 옵션과 룬 효과·결속 문구에서 찾음(2026-11-12) */
function locOther(it, l){ if(!KR() || /[ㄱ-힝]/.test(l)) return l; const BD=/^Bonded\s*:\s*/i, bond=BD.test(l), x=l.replace(BD,'');
  const pairs=[]; try{ const ri=it.b?.imp||[[],[]], imp = Array.isArray(ri) ? ri : JSON.parse(String(ri).replace(/'/g,'"')); (imp[0]||[]).forEach((e,i)=>{ const K=String(imp[1]?.[i]||'').split('\n'); String(e||'').split('\n').forEach((x,j)=>pairs.push([x, K[j]])); }); }catch(_){}   /* 여러 줄 고정 옵션은 줄마다(부재 목걸이 '-1 Prefix…\n-1 Suffix…', W10) */
  for(const r of [...(it.D?.runes||[]), ...Object.values(it.D?.runesBy||{}).flat()]) for(const t of r.t||[]){ const a=(t[3]||'').split('\n'), b=(t[2]||'').split('\n'), c=(t[5]||'').split('\n'), d=(t[4]||'').split('\n'); a.forEach((e,i)=>pairs.push([e,b[i]])); c.forEach((e,i)=>pairs.push([e,d[i]])); }
  for(const [e,k] of pairs){ if(!e || !k) continue; const o=xferLine(x, e, k); if(o!=null) return (bond?'결속: ':'')+o.replace(/\+-(?=\d)/g,'-'); } return l; }
const QTKR = {attack:'공격',caster:'시전',life:'생명력',mana:'마나',defences:'방어',physical:'물리',fire:'화염',cold:'냉기',lightning:'번개',chaos:'카오스',speed:'속도',attribute:'능력치',minion:'소환수'};
const qtName = it => KR() && it.qTag && QTKR[it.qTag] ? `${QTKR[it.qTag]} 옵션` : it.qualType;
function matcher(data){ if(data._mx) return data._mx; const list=[];
  data.groups.forEach((g,gi)=>{ if(!['n','d','e','x','c'].includes(g.s)) return;
    g.t.forEach((t,ti)=>{ for(const k of [4,5]){ list.push({gi,ti,s:g.s,lines:t[k].split('\n').map(tplRe)}); } }); });
  return data._mx = list; }
function cleanLine(l){ return l.replace(/(\d)\(-?\d+(?:\.\d+)?-\d+(?:\.\d+)?\)/g,'$1').replace(/\s*\((implicit|fractured|desecrated|rune|enchant|crafted|augmented|unmet|[ㄱ-힝\s]+)\)\s*$/i,'').trim(); }
function tagOf(l){ const m=l.match(/\((implicit|fractured|desecrated|rune|enchant|crafted)\)\s*$/i)||l.match(/\((고정|분열|훼손|룬|인챈트|부여|제작)[^)]*\)\s*$/); if(!m) return ''; const k=m[1].toLowerCase(); return ({고정:'implicit',분열:'fractured',훼손:'desecrated',룬:'rune',인챈트:'enchant',부여:'enchant',제작:'crafted'})[k]||k; }
function fitScore(ranges, vals){ let sc=0; ranges.forEach((r,i)=>{ const v=Math.abs(+vals[i]); const a=Math.min(r[0],r[1]), b=Math.max(r[0],r[1]); if(v<a) sc+=(a-v)/(Math.abs(a)||1); else if(v>b) sc+=(v-b)/(Math.abs(b)||1); }); return sc; }
function findBase(lines){ let best=null;
  for(const g of S.index.groups) for(const c of g.classes) (c.names||[]).forEach((nm,bi)=>{ for(const n of nm){ if(!n) continue;
    for(const l of lines){ const exact=l===n, part=!exact && l.includes(n); if(exact||part){ const sc=(exact?1000:0)+n.length; if(!best||sc>best.sc) best={sc,cls:c.id,bi,c}; } } } });
  return best; }
async function loadCls(id){ if(!S.cache[id]) S.cache[id] = await fetch(`data/c/${encodeURIComponent(id)}.json`).then(r=>r.json()); return S.cache[id]; }

/* ---------- parse ---------- */
/* 합쳐진 옵션 줄 풀기(사용자 2026-11-12): 같은 스탯을 주는 옵션이 여럿이면 게임은 한 줄로 합쳐 보여 줌(예: 회피 % 단일 + 회피·회피 % 하이브리드).
   줄 하나씩 맞추다 범위를 넘거나 남는 줄이 생기면, 모든 옵션 줄을 다시 풀어 '어떤 옵션 묶음이 이 줄들을 정확히 만드는지' 찾음.
   하이브리드 옵션은 두 줄을 같은 티어로 동시에 채우고, 한 줄은 옵션 둘까지 합산. 훼손 표시 줄은 훼손 옵션 하나만. 옵션 수가 가장 적은 답 */
const FLUXF = f => (f||[]).length>0 && (f||[]).every(x=>/^(Maximum)?(Fire|Cold|Lightning|Chaos)(And(?:Fire|Cold|Lightning|Chaos))?(?:Damage)?Resist(?:ance)?$/.test(x));   /* 유동체로 바뀔 수 있는 저항 계열 */
function solveLines(D, items, ilvl, cap){
  const MX = matcher(D), G = D.groups;
  const okT = (g,t) => t[0]<=ilvl && (t[1]>0 || g.s!=='n');
  const byG = new Map();   /* gi -> {K, lines:[[{idx, vals}]] per k, tiers:Set} */
  items.forEach((it2, idx)=>{ for(const c of MX){ const g=G[c.gi]; if(!['n','d','e','x'].includes(g.s) || !okT(g, g.t[c.ti])) continue;
    if(it2.tag==='desecrated' ? !['n','d'].includes(g.s) : g.s==='d') continue;
    if(it2.tag==='crafted' && g.s!=='e') continue;
    c.lines.forEach((ln,k)=>{ const m=it2.l.match(ln.re); if(!m) return; let e=byG.get(c.gi); if(!e){ e={K:c.lines.length, lines:Array.from({length:c.lines.length},()=>[]), tiers:new Set()}; byG.set(c.gi,e); }
      if(e.K!==c.lines.length) return; e.tiers.add(c.ti); if(!e.lines[k].some(x=>x.idx===idx)) e.lines[k].push({idx, vals:m.slice(1).map(Number)}); }); } });
  /* placements: each group line k on a distinct item; desecrated groups take only desecrated items, others never; fractured items take one group alone */
  const opts = [];
  for(const [gi,e] of byG){ if(e.lines.some(l=>!l.length)) continue; const g=G[gi];
    const rec=(k,acc)=>{ if(k===e.K){ const tg=acc.map(i=>items[i].tag); const des=tg.includes('desecrated');
        if(des && !tg.every(t=>t==='desecrated')) return; const fr=tg.includes('fractured'); if(fr && !tg.every(t=>t==='fractured')) return;
        opts.push({gi, side:g.g, f:g.f, idx:acc.slice(), des, fr}); return; }
      for(const x of e.lines[k]) if(!acc.includes(x.idx)) rec(k+1, [...acc, x.idx]); };
    rec(0, []); }
  const best = {n:Infinity, sol:null}; const cover = items.map(()=>[]), side={p:0,s:0}, fams=new Map(); let nDes=0, steps=0;
  /* 같은 계열 두 줄(사용자 확정 2026-11-13 20:16, game-rules 유동체): 훼손 표시 줄이 끼었거나 유동체로 바뀔 수 있는 저항 계열이면 허용. 합산(한 줄에 둘)은 안 됨 */
  const fluxF = f => FLUXF([f]);
  const famClash = (o, chosen) => { const sh=o.f.filter(f=>fams.get(f)>0); if(!sh.length) return false;
    if(o.idx.some(i=>cover[i].length)) return true;
    const other=chosen.filter(c=>c.f.some(f=>sh.includes(f)));
    return !(o.des || other.some(c=>c.des) || sh.every(fluxF)); };
  const famAdd = (o,d) => o.f.forEach(f=>fams.set(f,(fams.get(f)||0)+d));
  const ranges = (gi, ti, k) => tplRe(G[gi].t[ti][5].split('\n')[k] || G[gi].t[ti][5]).ranges;
  function feasible(chosen){ /* tiers: shared items get joint enumeration */
    const tierList = chosen.map(o=>[...byG.get(o.gi).tiers].filter(ti=>okT(G[o.gi], G[o.gi].t[ti])));
    const sum = (asg) => { let bad=0; for(let idx=0; idx<items.length; idx++){ const cs=cover[idx]; if(!cs.length) continue; const v=items[idx].vals; if(!v) continue;
        for(let q=0;q<v.length;q++){ let lo=0, hi=0; for(const {o,k} of cs){ const r=ranges(o.gi, asg[chosen.indexOf(o)], k)[q]; if(!r){ lo=1e9; break; } lo+=Math.min(...r); hi+=Math.max(...r); }
          const x=Math.abs(v[q]); if(x<lo-0.51) bad+= (lo-x)/(lo||1); else if(x>hi+0.51) bad+=(x-hi)/(hi||1); } } return bad; };
    let bestA=null, bestBad=Infinity, n=0;
    const rec=(j,asg)=>{ if(++n>20000) return; if(j===chosen.length){ const b=sum(asg); if(b<bestBad){ bestBad=b; bestA=asg.slice(); } return; }
      for(const ti of tierList[j]){ asg[j]=ti; rec(j+1, asg); if(bestBad===0 && chosen.length>3) return; } };
    rec(0, []); return bestBad===0 ? bestA : null; }
  /* 줄을 차례로 봄: 아직 아무 옵션도 안 맡은 줄은 옵션 하나를 붙이고, 이미 맡은 줄은 '그대로' 또는 '옵션 하나 더(합산)' 두 갈래 */
  function dfs(chosen, pos=0){ if(++steps>300000 || chosen.length>=best.n) return;
    if(pos>=items.length){ const asg=feasible(chosen); if(asg){ best.n=chosen.length; best.sol=chosen.map((o,j)=>({...o, ti:asg[j]})); } return; }
    const idx = pos;
    if(cover[idx].length) dfs(chosen, pos+1);
    if(cover[idx].length>=2) return;
    for(const o of opts){ if(!o.idx.includes(idx) || chosen.includes(o) || famClash(o, chosen)) continue;
      if(side[o.side]+1 > cap[o.side]) continue; if(o.des && nDes) continue;
      if(o.idx.some(i=>cover[i].length>=2 || (cover[i].length && (items[i].tag==='fractured' || items[i].tag==='desecrated' || o.fr || o.des)))) continue;
      chosen.push(o); side[o.side]++; famAdd(o,1); if(o.des) nDes++; o.idx.forEach((i,k)=>cover[i].push({o,k}));
      dfs(chosen, pos+1);
      o.idx.forEach(i=>cover[i].pop()); if(o.des) nDes--; famAdd(o,-1); side[o.side]--; chosen.pop(); } }
  dfs([]);
  return best.sol;
}
async function parse(txt){
  const raw = txt.replace(/\r/g,'').split('\n').map(x=>x.trim());
  const secs=[[]]; raw.forEach(l=>{ if(/^-{4,}$/.test(l)) secs.push([]); else if(l) secs[secs.length-1].push(l); });
  const head = secs[0]||[];
  const rl = head.find(l=>/^(Rarity|.*희귀도)\s*:/i.test(l)); const rv=(rl||'').split(':').slice(1).join(':').trim().toLowerCase();
  const rarity = /rare|희귀/.test(rv)?'rare':/magic|마법/.test(rv)?'magic':/unique|고유/.test(rv)?'unique':'normal';
  if(rarity==='unique') return {err:L('고유 아이템은 제작으로 만드는 아이템이 아님 · 역산 불가','Unique items are not crafted, so there is nothing to reverse.')};
  const nameLines = head.filter(l=>!/:/.test(l));
  const hit = findBase(nameLines.length?nameLines:head);
  if(!hit) return {err:L('베이스 아이템 이름 없음 · 아이템 이름 줄까지 필요','Base item not found. Paste the whole item text, including the name lines.')};
  const D = await loadCls(hit.cls), b = D.bases[hit.bi];
  const all = secs.flat();
  const num = re => { for(const l of all){ const m=l.match(re); if(m) return +m[1]; } return null; };
  const ilvl = num(/^(?:Item Level|아이템 레벨)\s*:\s*(\d+)/i) ?? 82;
  const qual = num(/^(?:Quality|품질|퀄리티)[^:]*:\s*\+?(\d+)%/i);
  const qualType = (all.find(l=>/^(?:Quality|품질|퀄리티)\s*\(/i.test(l))||'').match(/\(([^)]+)\)/)?.[1] || null;
  const QTK = {attack:'공격',caster:'시전',life:'생명력',mana:'마나',defences:'방어',physical:'물리',fire:'화염',cold:'냉기',lightning:'번개',chaos:'카오스',speed:'속도',attribute:'능력치',minion:'소환수'};
  const qTag = qualType ? Object.keys(QTK).find(k=>{ const q=qualType.toLowerCase(); return q.includes(k) || q.includes(k.replace(/s$/,'')) || qualType.includes(QTK[k]); }) || null : null;
  const corrupted = all.some(l=>/^(Corrupted|타락)$/i.test(l));
  const sanctified = all.some(l=>/^(Sanctified|축성됨|축성)$/i.test(l));
  const exceptional = /exceptional|특출난/i.test(nameLines.join(' '));
  const sockL = all.find(l=>/^(Sockets|소켓)\s*:/i.test(l)); const sockets = sockL ? (sockL.split(':')[1].match(/S/gi)||[]).length : null;
  const ilIdx = secs.findIndex(s=>s.some(l=>/^(Item Level|아이템 레벨)\s*:/i.test(l)));
  /* 고정 옵션 구역(2026-11-13 W1): 여러 줄 고정 옵션은 일반 복사에서 마지막 줄에만 (implicit)이 붙음(예: 부재 목걸이 '-1 Prefix Modifier allowed') → 같은 구역의 못 읽은 줄은 고정 옵션으로 */
  const impSec = new Set((ilIdx>=0 ? secs.slice(ilIdx+1) : secs.slice(1)).filter(sc=>sc.some(l=>tagOf(l)==='implicit') && !sc.some(l=>/\((fractured|desecrated|crafted)\)\s*$/i.test(l))).flat());
  const lines = (ilIdx>=0 ? secs.slice(ilIdx+1) : secs.slice(1)).flat()
    .filter(l=>!/^(Sanctified|축성됨|축성|Corrupted|타락|Unidentified|미확인|Mirrored|복제됨)$/i.test(l) && !/^(Note|노트|Sockets|소켓)\s*:/i.test(l) && !/^".*"$/.test(l));
  const MX = matcher(D), mods=[], other=[], used=new Set(); let hint=null;
  for(let i=0;i<lines.length;i++){
    const l0 = lines[i];

async function run(){
  await S.ready; S.draft=null; S.sent=false; S.need=new Set(); S.soft=new Set(); S.okQR=false; S.unkOk=false; S.tsel={}; S.alt={}; S.altK={}; S.buy=new Set(); $('#fb').hidden=true;
  const txt = $('#txt').value; if(!txt.trim()){ S.last=null; render(); return; }
  if(!S.index) [S.index, S.craft] = await Promise.all([fetch('data/index.json').then(r=>r.json()), fetch('data/crafting.json').then(r=>r.json())]);
  if(!S.priority) S.priority = await fetch('data/priority.json').then(r=>r.json()).catch(()=>null);
  S.txt = txt;
  loadBoard().then(()=>{ if(S.last?.it) render(); });
  try{ const it = await parse(txt); S.last = it.err ? {err:it.err} : {it, an:await autoSide(it)}; }
  catch(e){ S.last = {err:L('분석 중 오류: ','Analysis failed: ')+e.message}; console.error(e); }
  render();
}
