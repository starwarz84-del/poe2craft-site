<title>POE2 Recipes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: filter bar → masonry of finished-item cards. Expanding a card bottom-aligns its line and opens a full-width recipe panel under it. Same dark system as the emulator. */
:root{
  --bg:#13151a; --panel:#1b1e25; --panel-2:#22262f; --line:#2e333e; --fg:#e8e3d8; --muted:#959ba6; --faint:#6b717c;
  --rare:#ead77f; --warn:#e3806f; --ok:#8fcf9a; --focus:#f2e6c4; --ink:#14161a; --pre:#e88a7a; --suf:#7fa6ff;
  --f-display:"Gowun Batang", "Apple SD Gothic Neo", serif;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 48px;max-width:1560px;margin:0 auto}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer;font-size:13px}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--rare);color:var(--ink);border-color:var(--rare);font-weight:600}
.btn.on{border-color:var(--rare);color:var(--rare)}
/* toolbar */
.tag.draftb{color:var(--ink);background:var(--ok);border-color:var(--ok)}
.tag.shb{color:var(--accent);border-color:var(--accent)}
.btn.arm{color:var(--ink);background:var(--bad,#c0504d);border-color:var(--bad,#c0504d)}
.tag.newb{color:var(--ink);background:var(--accent);border-color:var(--accent);font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:10px}
.bar input[type=search]{flex:1 1 220px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 10px}
.bar select{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.bar label{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer}
.bar .sp{flex:1 1 0}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.count{font-size:12px;color:var(--faint)}
.demo-note{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:6px 10px;margin-bottom:12px}
/* masonry */
.board{position:relative;min-height:200px}
.card{position:absolute;transition:top .18s ease,border-color .12s;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.card:hover{border-color:#4a505d}
.card.open{border-color:var(--rare)}
.card .grow{flex:1 1 auto}
.foot{padding:10px 12px 11px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line)}
.foot h3{margin:0;font-size:14px;font-weight:600;line-height:1.35;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12px;color:var(--muted)}
.meta .pt{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.meta .pt.old{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.ex{font-size:10.5px;letter-spacing:.06em;color:var(--ink);background:var(--muted);border-radius:3px;padding:0 5px}
.cost{display:flex;flex-wrap:wrap;gap:4px 8px}
.ci{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-mono);font-size:12px;color:var(--fg)}
.ci img{width:22px;height:22px}
.ci.dim{color:var(--faint)}
.calc{font-size:11.5px;color:var(--faint)}
/* tooltip (game style, compact) */
.tt{--tt-bg:#0d0d10;--tt-edge:#6b5a33;--tt-gold:#c8a85a;--tt-label:#8a8a8a;--tt-val:#ece8df;--tt-mod:#8888ff;--tt-name:#ffff77;--tt-head:#2a2416;background:var(--tt-bg);text-align:center;color:var(--tt-val)}
.tt-head{position:relative;padding:8px 12px 7px;background:linear-gradient(180deg,var(--tt-head) 0%,#121212 100%);border-bottom:1px solid var(--tt-edge)}
.tt-head::before,.tt-head::after{content:"";position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--tt-edge) 12%,var(--tt-gold) 50%,var(--tt-edge) 88%,transparent)}
.tt-head::before{top:3px}.tt-head::after{bottom:3px}
.tt-name{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.3;color:var(--tt-name)}
.tt-body{padding:10px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:13px;line-height:1.5}
.tt-art{display:flex;justify-content:center;min-height:70px;margin:0 0 6px}
.tt-art img{max-height:110px;max-width:96px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.7))}
.tt-prop{color:var(--tt-label)} .tt-prop b{color:var(--tt-val);font-weight:500}
.tt-sep{width:86%;height:1px;margin:7px 0;background:linear-gradient(90deg,transparent,var(--tt-gold),transparent);opacity:.75}
.tt-mod{position:relative;width:100%;padding:1px 40px;color:var(--tt-mod);white-space:pre-line}
.tt-mod .tier{position:absolute;left:5px;top:2px;font-weight:600;font-size:10.5px;white-space:nowrap}
.tier.p{color:var(--pre)} .tier.s{color:var(--suf)}
.tt-mod.fr{color:#c9b27a}
.tt-mod.any{color:#6f6f9a;font-style:italic}
.tt-mod.ess{color:#9fd8b0}
/* expanded panel */
.panel{position:absolute;left:0;right:0;background:var(--panel);border:1px solid var(--rare);border-radius:12px;padding:16px 18px 18px;cursor:default}
.panel::before{content:"";position:absolute;top:-7px;left:var(--arrow,40px);width:12px;height:12px;background:var(--panel);border-left:1px solid var(--rare);border-top:1px solid var(--rare);transform:rotate(45deg)}
.ph{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.ph h2{margin:0;font-family:var(--f-display);font-size:21px;line-height:1.3;text-wrap:balance}
.ph .meta{margin-top:4px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.warnbox{border:1px solid color-mix(in srgb,var(--warn) 55%,var(--line));background:color-mix(in srgb,var(--warn) 10%,var(--panel));color:#f1c2b8;border-radius:8px;padding:7px 11px;font-size:13px;margin-bottom:12px}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.sec{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.st{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px;align-items:start;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.st .n{font-family:var(--f-mono);font-size:12px;color:var(--faint);padding-top:3px}
.st .what{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-width:0}
.st .what img{width:26px;height:26px}
.st .what b{font-weight:600}
.st .tgt{grid-column:2/4;font-size:13px;color:var(--muted)}
.st .tgt .mod{color:#a9a9ff}
.st .fail{grid-column:2/4;font-size:12.5px;color:var(--faint);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.st .fail img{width:18px;height:18px}
.st .fail .back{color:var(--warn)}
.st .pr{text-align:right;font-family:var(--f-mono);font-size:12px;color:var(--fg);white-space:nowrap}
.st .pr small{display:block;color:var(--faint);font-family:var(--f-body);font-size:11px}
.st .use{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px 10px}
.legend{font-size:12px;color:var(--faint);margin-top:8px}
.tot{background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tot table{width:100%;border-collapse:collapse;font-size:13px}
.tot th,.tot td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tot th{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.tot th:first-child,.tot td:first-child{text-align:left}
.tot td:first-child{display:flex;align-items:center;gap:6px;white-space:normal}
.tot td img{width:22px;height:22px}
.tot tr:last-child td{border-bottom:0}
.tot .num{font-family:var(--f-mono)}
.simline{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--line)}
.simline b{color:var(--fg);font-family:var(--f-mono);font-weight:600}
.side{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;min-width:0;align-items:start}
.social{display:flex;flex-wrap:wrap;gap:6px}
.comments{display:flex;flex-direction:column;gap:6px}
.cm{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.cm small{color:var(--faint);font-size:11px;display:block}
.cform{display:flex;gap:6px}
.cform input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px}
.local{font-size:11.5px;color:var(--faint)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.flow{display:flex;flex-direction:column;gap:14px}
.flow .w{fill:none;stroke:var(--warn);stroke-width:1.5;opacity:.85}
.flow .w.rs{stroke:#d9a65e;stroke-dasharray:4 3}
.flow .wl{font-size:10px;fill:var(--warn)}
.phase h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--rare);letter-spacing:.04em}
.phase .steps{display:flex;flex-direction:column;gap:8px}
.grp{border-radius:10px;padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px;margin-left:22px}
.grp .gh{font-size:12px;font-weight:600}
.grp .gf{font-size:12px;color:var(--muted)}
.failg{border:1px dashed color-mix(in srgb,var(--warn) 55%,var(--line));background:color-mix(in srgb,var(--warn) 4%,transparent)}
.failg .gh{color:var(--warn)}
.okg{border:1px dashed color-mix(in srgb,var(--ok) 50%,var(--line))}
.okg .gh{color:var(--ok)}
.loopg{margin-left:0;border:1px solid color-mix(in srgb,var(--ok) 40%,var(--line))}
.loopg .gh{color:var(--ok)}
.routes{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px}
.rt{font-size:12px;border-radius:999px;padding:1px 9px;border:1px solid var(--line);color:var(--muted)}
.rt b{font-weight:600}
.rt.ok b{color:var(--ok)} .rt.no b{color:var(--warn)}
.rt small{color:var(--faint)}
.rt img{width:16px;height:16px;vertical-align:-3px}
.node{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;position:relative}
.nbody{flex:1 1 380px;min-width:0;display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:4px 10px;align-items:start;align-content:start}
.state{flex:0 1 300px;min-width:220px;background:#0d0d10;border:1px solid #2a2a2e;border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:6px;font-size:12px}
.state.empty-st{background:transparent;border:0}
.sside{display:flex;flex-direction:column;gap:2px}
.sl{font-size:10.5px;color:var(--faint);letter-spacing:.04em}
.sm{position:relative;padding:1px 0 1px 40px;color:#8888ff;line-height:1.35;white-space:pre-line}
.sm .tier{position:absolute;left:0;top:2px;font-size:10px;font-weight:600}
.sm.fr{color:#c9b27a}
.sm.desr{color:#9be86a}
.sm.des{color:#9be86a;font-style:italic}
.sm.junk{color:#6f6f9a;font-style:italic}
.sm.mark{color:#c58bff}
.sm.qline{padding-left:0;color:var(--fg)}
.sm.qline small{color:var(--faint)}
.sm.rune{color:#9fb4ff;padding-left:0}
.sm.essm{color:#9fd8b0}
.sm.desj{color:#9be86a;font-style:italic;opacity:.75}
.tt-mod.essm{color:#9fd8b0}
.sm.free{height:14px;border:1px dashed #2a2a33;border-radius:3px;margin-left:40px}
.costin{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12.5px;color:var(--muted)}
.costin input{width:90px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-family:var(--f-mono)}
.costin select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.costin small{color:var(--faint)}
.what .arr{color:var(--faint)}
.pr .ex2{color:var(--rare)!important}

.node.opt{border-style:dashed}
.node .n{font-family:var(--f-mono);font-size:12px;color:var(--faint);padding-top:3px}
.node .what{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-width:0}
.node .what img{width:26px;height:26px}
.node .what b{font-weight:600}
.node .tgt{grid-column:2/4;font-size:13px;color:var(--muted)}
.node .tgt .mod{color:#a9a9ff}
.node .fail{grid-column:2/4;font-size:12.5px;color:var(--faint);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.node .fail img{width:18px;height:18px}
.node .fail .back{color:var(--warn)} .node .fail .loop{color:var(--ok)}
.node .nt{grid-column:2/4;font-size:12.5px;color:#c9c2b2}
.node .nt.warnt{color:var(--warn)}
.node .pr{text-align:right;font-family:var(--f-mono);font-size:12px;color:var(--fg);white-space:nowrap}
.node .pr small{display:block;color:var(--faint);font-family:var(--f-body);font-size:11px}
.node .pr small.est{color:var(--warn,#d9a441)}
.node .use{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px 10px}
.node .ts{font-size:11.5px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.node .ts:hover{color:var(--fg)}
.optl{font-size:10.5px;color:var(--faint);border:1px dashed var(--line);border-radius:3px;padding:0 4px}
.rn{color:#c9a85a}
.rnote{font-size:13px;color:var(--muted);margin:0 0 12px}
.meta a{color:var(--muted)}
.tt-mod.desm{color:#9be86a}

/* detail page: progress on top, step nav left, flow centre, item fixed on the right */
.dwrap{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 48px;max-width:1560px;margin:0 auto}
.dtop{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;margin-bottom:10px}
.dtop .back{flex:none}
.dtitle{flex:1 1 360px;min-width:0}
.dtitle h1{margin:0;font-family:var(--f-display);font-size:22px;line-height:1.3;text-wrap:balance}
.dtitle .meta{margin-top:4px}
.prog{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;gap:12px;padding:8px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.segs{flex:1;display:flex;gap:4px;min-width:0}
.seg{flex-basis:0;height:8px;border:0;padding:0;border-radius:4px;background:var(--panel-2);position:relative;overflow:hidden;cursor:pointer}
.seg .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--rare);transition:width .2s ease}
.plabel{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.dgrid{display:grid;grid-template-columns:210px minmax(0,1fr) 330px;gap:18px;align-items:start}
.dnav,.ditem{position:sticky;top:calc(env(safe-area-inset-top,0px) + 46px);max-height:calc(100vh - 60px);overflow:auto}
.dnav{display:flex;flex-direction:column;gap:6px;font-size:13px;padding-right:2px}
.nvp{border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.nvh{display:flex;align-items:center;gap:6px;width:100%;background:var(--panel);border:0;padding:7px 9px;cursor:pointer;text-align:left;font-weight:600;font-size:12.5px;color:var(--fg)}
.nvh small{margin-left:auto;color:var(--faint);font-weight:400;font-family:var(--f-mono)}
.nvh .chev{color:var(--faint);transition:transform .15s}
.nvp.closed .chev{transform:rotate(-90deg)}
.nvp.closed .nvl{display:none}
.nvl{display:flex;flex-direction:column;padding:3px 0}
.nv{display:flex;gap:7px;align-items:baseline;padding:4px 9px;color:var(--muted);text-decoration:none;border-left:2px solid transparent}
.nv:hover{color:var(--fg)}
.nv .nn{font-family:var(--f-mono);font-size:11px;color:var(--faint);min-width:18px;text-align:right}
.nv .nt2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nv.sub{padding-left:22px}
.nv.sub.retry .nn,.nv.sub.fb .nn,.nv.sub.b-miss .nn{color:var(--warn)}
.nv.sub.b-ok .nn{color:var(--ok)}
.nv.on{color:var(--fg);background:var(--panel-2);border-left-color:var(--rare)}
.nv.done .nn{color:var(--ok)}
.navx{padding:4px 0}
.btn.sm{font-size:12px;padding:3px 9px}
.dmain{min-width:0;display:flex;flex-direction:column;gap:12px}
.dmain .tot table th:first-child{text-transform:none}
.flowsec small{text-transform:none;letter-spacing:0;font-weight:400;color:var(--faint)}
.node{scroll-margin-top:70px}
.dmain .node{cursor:pointer} .dmain .node:not(.cur):hover{border-color:color-mix(in srgb,var(--rare) 35%,var(--line))}
.node.cur{border-color:var(--rare);box-shadow:0 0 0 1px color-mix(in srgb,var(--rare) 40%,transparent)}
.node.done{opacity:.6}
.tick{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--faint);font-family:var(--f-mono);font-size:11px;cursor:pointer;padding:0}
.tick:hover{border-color:var(--muted);color:var(--fg)}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--ink)}
.dfoot{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;align-items:start}
.ditem{display:flex;flex-direction:column;gap:8px}
.dihead{display:flex;flex-direction:column;gap:1px;font-size:13px}
.dihead .k{font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.ditem .tt{border:1px solid #3a3426;border-radius:8px;overflow:hidden}
.tt-sec{width:100%;text-align:left;padding:4px 8px 1px;font-size:10.5px;color:#6d6a62;letter-spacing:.05em}
.tt-free{width:calc(100% - 50px);margin:2px 0 2px 40px;height:14px;border:1px dashed #2c2c33;border-radius:3px}
.tt-mod.added{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.tt-mod.added::before{content:"+";position:absolute;right:8px;top:1px;color:var(--ok);font-weight:700}
.tt-mod.removed{text-decoration:line-through;opacity:.45}
.tt-mod.removed::before{content:"−";position:absolute;right:8px;top:1px;color:var(--warn);font-weight:700}
.tt-mod.junk{color:#8d877b;font-style:italic}
.tt-mod.des-u{color:#9be86a;font-style:italic}
.tt-mod.markm{color:#c58bff}
.tt-mod.rune{color:#9fb4ff;padding-left:8px}
@media (max-width:1180px){ .dgrid{grid-template-columns:minmax(0,1fr) 300px} .dnav{display:none} }
@media (max-width:760px){ .dgrid{grid-template-columns:minmax(0,1fr)} .ditem{position:sticky;top:calc(env(safe-area-inset-top,0px) + 42px);z-index:5;max-height:42vh;background:var(--bg);order:-1;padding-bottom:6px} .ditem .tt-art{display:none} .dihead{cursor:pointer} .dihead::after{content:"▾ 접기 / 펼치기";font-size:11px;color:var(--faint)} .ditem.min [data-tip]{display:none} }

<script>
(() => {
'use strict';
// ---------- state / i18n ----------
const store0 = (k,d) => { try{ const v=localStorage.getItem('poe2r:'+k); return v?JSON.parse(v):d; }catch(e){ return d; } };
const S = { tips:[], view:store0('view','recipes'), navClosed:new Set(), stepIdx:-1, lang:'en', recipes:[], cls:{}, craft:null, byId:{}, index:null, open:null, sim:{}, tags:new Set(), q:'', cat:'', sort:'popular', curOnly:false };
try{ const u=new URLSearchParams(location.search).get('lang'); S.lang = u || localStorage.getItem('poe2lang') || 'en'; }catch(e){}
if(S.lang!=='kr') S.lang='en';
const KR = () => S.lang==='kr', L = (kr,en) => KR()?kr:en;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const store = { get(k,d){ try{ const v=localStorage.getItem('poe2r:'+k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem('poe2r:'+k, JSON.stringify(v)); }catch(e){} } };
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 1800); }

const TAGS = [['life',['생명력','Life']],['resistance',['저항','Resistance']],['defences',['방어','Defences']],['physical',['물리','Physical']],['elemental',['원소','Elemental']],['attack',['공격','Attack']],['caster',['주문','Caster']],['speed',['속도','Speed']],['critical',['치명타','Critical']],['drop',['희귀도','Rarity']]];
const SORTS = [['popular',['인기순','Popular']],['new',['최신순','Newest']],['cheap',['적은 소모순','Fewest currency']],['rate',['성공률순','Success rate']],['reports',['성공 보고순','Most success reports']]];
const DO = { transmute:['진화','Transmute'], augment:['확장','Augment'], regal:['제왕','Regal'], exalt:['엑잘','Exalt'], essence:['에센스','Essence'], fracture:['분열','Fracture'] };

// ---------- data ----------
const runeById = (r, id) => { const n=id.slice(5); for(const x of C(r).runes) for(const t of x.t) if(t[1]===n) return {id, kr:`${t[0]} (룬)`, en:`${t[1]} (rune)`, fx:t[2], fxen:t[3]}; return {id, kr:`${n} (룬)`, en:`${n} (rune)`}; };
let CUR_R=null;
const cur = id => id.startsWith('rune:') && CUR_R ? runeById(CUR_R, id) : (S.byId[id] || {id, en:id.replace(/_/g,' '), kr:id.replace(/_/g,' ')});
const nm = x => KR()?x.kr:x.en;
const C = r => S.cls[r.cls];
const grp = (r,gi) => C(r).groups[gi];
const tText = t => KR()?t[4]:t[5];
const baseOf = r => C(r).bases[r.base];
const tx = o => o ? (o[S.lang] || o.en || o.kr || '') : '';
const clsName = r => { for(const g of S.index.groups) for(const c of g.classes) if(c.id===(r.clsAs||r.cls)) return (KR()?c.kr:c.en).replace(/\s*\(.*\)\s*$/,''); return r.cls; };
const catOf = r => S.index.groups.find(g=>g.classes.some(c=>c.id===r.cls));
const sideOfOmens = os => { for(const o of os||[]){ if(/Sinistral/.test(o)) return 'p'; if(/Dextral/.test(o)) return 's'; } return null; };
// league each patch belongs to (badge shows the league, hovering shows the patch)
const LEAGUES = [{p:'0.5.5', en:'Forbidden Rites'}, {p:'0.5', en:'Runes of Aldur'}];
const leagueOf = r => LEAGUES.find(x=>String(r.patch)===x.p) || LEAGUES.find(x=>String(r.patch).startsWith(x.p)) || null;
const leagueBadge = (r, old) => { const lg=leagueOf(r); const tip=L(`패치 ${r.patch}`,`Patch ${r.patch}`)+(old?L(' · 현재 패치와 다름',' · not the current patch'):'');
  return `<span class="lg ${old?'old':''}" tabindex="0" data-tipx="${esc(tip)}">${esc(lg?lg.en:L(`패치 ${r.patch}`,`Patch ${r.patch}`))}${old?' ⚠':''}</span>`; };
const featureOf = r => { const t=tx(r.title); const i=t.indexOf('—'); return (i>=0 ? t.slice(i+1) : t).trim(); };
// title = base chosen at registration + the author's own title (its feature)
const baseName = r => KR()?baseOf(r).kr:baseOf(r).en;
const fullTitle = r => `${baseName(r)} | ${featureOf(r)}`;
const titleHTML = r => `<span class="tbase">${esc(baseName(r))}</span><span class="tsep" aria-hidden="true">|</span><span class="tfeat">${esc(featureOf(r))}</span>`;
// difficulty: the author's pick when registered, otherwise a rough score from how the recipe works
const DIFF = [['입문','Beginner'],['쉬움','Easy'],['보통','Medium'],['어려움','Hard'],['전문가','Expert'],['극한','Extreme']];
const BUDGET = {low:['저예산','Budget'], medium:['중간 예산','Mid budget'], high:['고예산','High budget']};
function difficulty(r){
  if(r.difficulty!=null) return Math.max(0,Math.min(5,r.difficulty));
  const a=analyse(r), ds=new Set(r.nodes.map(n=>n.do)); let sc=0;
  if(r.nodes.length>15) sc++;
  if(ds.has('fracture')) sc++;
  if(ds.has('desecrate')||ds.has('reveal')) sc++;
  if(a.nodes.some(o=>o.p>0 && o.p<0.01)) sc++;
  if(a.bases>1.5) sc++;
  return [0,1,2,3,3,4][sc];
}
const diffTag = r => { const d=difficulty(r); return `<span class="tag diff d${d}" title="${esc(L('난이도','Difficulty'))} ${d+1}/6">${esc(L(...DIFF[d]))}</span>`; };
const budgetTag = r => r.budget && BUDGET[r.budget] ? `<span class="tag bud">${esc(L(...BUDGET[r.budget]))}</span>` : '';
const buildTags = r => (r.buildTags||[]).map(t=>`<span class="tag bld">${esc(tx(t))}</span>`).join('');
// exceptional base: an extra rune socket or base quality above 20%
const excText = r => { const e=r.exceptional; if(!e) return ''; return [e.sockets?L(`룬 소켓 +${e.sockets}`,`+${e.sockets} rune socket`):'', e.quality?L(`기본 퀄리티 ${e.quality}%`,`${e.quality}% base quality`):''].filter(Boolean).join(' · '); };
const excTag = r => r.exceptional ? `<span class="tag exc" title="${esc(excText(r))}">${L('특출난','Exceptional')}</span>` : '';
// base and method tags shown on the overview
function infoTags(r){
  const a=analyse(r), last=a.nodes[a.nodes.length-1], t=[];
  const RAR={normal:['일반','Normal'], magic:['마법','Magic'], rare:['희귀','Rare']};
  t.push(`<span class="tag rar">${esc(L(...RAR[last.rar||'rare']))}</span>`);
  if(last.sockets) t.push(`<span class="tag">${L(`룬 소켓 ${last.sockets}`,`${last.sockets} sockets`)}</span>`);
  t.push(excTag(r));
  if(last.qual?.v) t.push(`<span class="tag">${L('퀄리티','Quality')} ${last.qual.v}%</span>`);
  if(last.anoint) t.push(`<span class="tag">${L('성유','Anoint')} · ${esc(tx(last.anoint))}</span>`);
  t.push(last.sanct ? `<span class="tag sanct">${L('축성','Sanctified')}</span>` : '');
  t.push(`<span class="tag">${L('아이템 레벨','ilvl')} ${r.ilvl}</span>`);
  return t.join('') + buildTags(r);
}
const minorPatch = p => String(p).split('.').slice(0,2).join('.');
const isOld = r => minorPatch(r.patch)!==minorPatch(S.index.patch);

// merge "(a—b)" ranges of best and worst accepted tier into one span
function rangeText(t0, tw){
  if(!tw || t0===tw) return t0;
  const re=/\((\d+(?:\.\d+)?)—(\d+(?:\.\d+)?)\)/g; const lo=[...tw.matchAll(re)].map(m=>m[1]);
  let k=0; return t0.replace(re, (m,a,b)=> `(${lo[k++]??a}—${b})`);
}
// one modifier with an accepted tier range → display text and tier tag
function modLine(r, gi, tmax, max){
  const g=grp(r,gi), ok=g.t.filter(x=>x[0]<=r.ilvl), off=Math.max(0,g.t.indexOf(ok[0]));
  const tm = tmax ? Math.min(tmax, g.t.length) : null;
  const top=g.t[off]||g.t[0], worst = tm ? g.t[Math.max(off, tm-1)] : null;
  const ps = g.g==='p'?'P':'S';
  if(max) return {g, gi, txt: tText(top).replace(/\((\d+(?:\.\d+)?)—(\d+(?:\.\d+)?)\)/g,'$2'), tag: `${ps}${off+1}`, max:true};
  return {g, gi, txt: tm ? rangeText(tText(top), tText(worst)) : tText(top), tag: tm ? (off+1>=tm ? `${ps}${off+1}` : `${ps}${off+1}–${tm}`) : ps};
}

// ---------- recipe flow analysis ----------
// Walks the success path node by node with an assumed item state, and works out for each node the chance one attempt
// hits its target from the real weights (same pool rules as the emulator: free sides, family exclusion, ilvl and min-level gates).
const specList = s => !s ? [] : s.anyOf ? s.anyOf : [s];
const specHit = (s, gi, ti) => specList(s).some(x=>x.gi===gi && (!x.tmax || ti < x.tmax));
const userCost = r => store.get('cost:'+r.id, {});
// a target whose weights we don't have: special (soul core / rune / tree) mods, or regular mods whose tiers all carry the placeholder weight 1
function specUnknown(r, t){
  const gis=[]; const add=x=>{ if(!x) return; if(x.gi!=null) gis.push(x.gi); (x.anyOf||[]).forEach(add); (x.all||[]).forEach(add); };

}

function saveViaShell(filename, blob){

    addEventListener('message',on); setTimeout(()=>{ removeEventListener('message',on); res('unavailable'); }, 120000);
    try{ parent.postMessage({type:'poe2-download', id, filename, blob}, '*'); }catch(e){ res('unavailable'); } });

function glideTo(y){

function layout(){
  const board=$('#board'), W=board.clientWidth, gap=14, cols=Math.min(4, Math.max(1, Math.floor((W+gap)/(290+gap)))), cw=(W-gap*(cols-1))/cols;
  cards.forEach(c=>{ c.style.width=cw+'px'; c.style.height=''; });
  const H=cards.map(c=>c.offsetHeight);
  const col=Array(cols).fill(0), pos=[];
  const place = (i, from) => { let k=0; for(let j=1;j<cols;j++) if(col[j]<col[k]-0.5) k=j; pos[i]={x:k*(cw+gap), y:col[k], k}; col[k]+=H[i]+gap; };
  cards.forEach((c,i)=>place(i));
  let height = Math.max(0,...col)-gap;
  const oi = panel ? cards.findIndex(c=>c.dataset.id===S.open) : -1;
  if(oi>=0){
    const ot = pos[oi].y, ob = ot + H[oi], keep = new Set();
    // the line = in each column, the card that overlaps the opened card most (or the last one that starts above its bottom)
    const chosen = [];
    for(let k=0;k<cols;k++){
      const inCol = cards.map((c,i)=>i).filter(i=>pos[i].k===k);
      let best=-1, bo=0;
      if(k===pos[oi].k) best=oi;
      else inCol.forEach(i=>{ const o=Math.min(ob,pos[i].y+H[i])-Math.max(ot,pos[i].y); if(o>bo){ bo=o; best=i; } });
      if(best<0){ const up=inCol.filter(i=>pos[i].y<ob); if(up.length) best=up[up.length-1]; }
      if(best<0) continue;
      inCol.filter(i=>pos[i].y<=pos[best].y).forEach(i=>keep.add(i)); chosen.push(best);
    }
    const line = Math.max(...chosen.map(i=>pos[i].y+H[i]));
    // card sizes stay fixed: each column's line card moves down so its bottom sits on the line
    chosen.forEach(i=>{ pos[i].y=line-H[i]; });
    panel.style.top=(line+gap)+'px'; panel.style.setProperty('--arrow', (pos[oi].x+cw/2-6)+'px');
    const pBottom = line+gap+panel.offsetHeight+gap;
    col.fill(pBottom);
    cards.forEach((c,i)=>{ if(!keep.has(i)) place(i); });
    height = Math.max(pBottom-gap, Math.max(...col)-gap);
  }
  cards.forEach((c,i)=>{ c.style.left=pos[i].x+'px'; c.style.top=pos[i].y+'px'; c.style.height=H[i]+'px'; });
  board.style.height=Math.max(height,200)+'px';
}

// ---------- analysis request: paste an item, match its modifiers, list similar recipes ----------
function tplRe(t){ return new RegExp('^'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\\\((\d+(?:\.\d+)?)—(\d+(?:\.\d+)?)\\\)/g,'[+-]?\\d+(?:\\.\\d+)?').replace(/\d+(?:\.\d+)?/g,'\\d+(?:\\.\\d+)?')+'$','i'); }
let parsed=null;
async function analyze(){
  const txt=$('#d-txt').value; const lines=txt.split(/\r?\n/).map(s=>s.replace(/\s*\((?:fractured|crafted|desecrated|rune|implicit|enchant|분열|룬|암시|인챈트)\)\s*$/i,'').trim()).filter(Boolean);
  let cls=null, bname=null;
  outer: for(const g of S.index.groups) for(const c of g.classes) for(const [en,kr] of c.names||[]) if(lines.some(l=>l===en||l===kr)){ cls=c.id; bname=KR()?kr:en; break outer; }
  if(!cls){ parsed=null; $('#d-res').innerHTML=`<div class="ml">${L('베이스 아이템을 찾지 못했어요. 게임에서 Ctrl+C로 복사한 텍스트 전체를 붙여 넣어 주세요.','Could not find the base item. Paste the full text copied with Ctrl+C in game.')}</div>`; $('#d-req').disabled=true; return; }
  await loadCls(cls); const D=S.cls[cls]; const found=[];
  // one match per pasted line; normal modifier groups first, essence-only groups as a fallback
  const order=[...D.groups.keys()].filter(gi=>['n','e'].includes(D.groups[gi].s)).sort((a,b)=>(D.groups[a].s==='n'?0:1)-(D.groups[b].s==='n'?0:1));
  const res=new Map(order.map(gi=>[gi, D.groups[gi].t.flatMap(t=>[tplRe(t[4]),tplRe(t[5])])]));
  for(const l of lines){ for(const gi of order){ if(res.get(gi).some(re=>re.test(l))){ if(!found.some(f=>f.gi===gi)) found.push({gi, txt:l, g:D.groups[gi]}); break; } } }
  parsed={cls, base:bname, mods:found, text:txt};
  const hits = S.recipes.filter(r=>r.cls===cls).map(r=>{ const tg=analyse(r).final.map(m=>m.g);   // match by modifier family so essence and normal life count as the same
    const ov=tg.filter(g=>found.some(f=>f.g.f.some(x=>g.f.includes(x)))).length; return {r, ov, n:tg.length}; }).sort((a,b)=>b.ov-a.ov);
  $('#d-res').innerHTML = `<div class="ml"><b>${esc(bname)}</b> · ${L('인식한 옵션','Recognised modifiers')} ${found.length}</div><div class="ml">${found.map(f=>`<span class="ok">✓ ${esc(f.txt)}</span>`).join('')||'—'}</div>`
    + (hits.length ? hits.map(h=>`<button type="button" class="hit" data-go="${h.r.id}"><span>${esc(h.r.title[S.lang]||h.r.title.en)}</span><span class="ml">${L(`겹치는 목표 ${h.ov}/${h.n}`,`${h.ov}/${h.n} targets match`)}</span></button>`).join('')
       : `<div class="ml">${L('이 종류의 레시피가 아직 없어요. 레시피를 요청할 수 있어요.','No recipes for this item type yet. You can request one.')}</div>`);
  $('#d-req').disabled = !found.length;
}

function scrub(v, d=0){
  if(d>24) return null;
  if(typeof v==='string') return v.replace(/[<>"`]/g,'').slice(0,4000);
  if(typeof v==='number') return Number.isFinite(v)?v:0;
  if(typeof v==='boolean' || v==null) return v;
  if(Array.isArray(v)) return v.slice(0,500).map(x=>scrub(x,d+1));
  if(typeof v==='object'){ const o={}; for(const k of Object.keys(v).slice(0,300)){ if(/^(__proto__|constructor|prototype)$/.test(k)) continue; o[k]=scrub(v[k],d+1); } return o; }
  return null;
}
const knownCls = id => S.index.groups.some(g=>g.classes.some(c=>c.id===id));
async function cleanShared(x){
  const r=scrub(x.recipe);
  if(!r || !/^s-[a-z0-9]+$/.test(r.id||'') || !knownCls(r.cls) || !Array.isArray(r.nodes) || !Array.isArray(r.phases)) return null;
  for(const k of ['base','ilvl','sockets','cap']) if(k in r && typeof r[k]!=='number') r[k]=parseInt(r[k])||0;
  r.patch = String(r.patch||'').replace(/[^0-9a-z.]/gi,'').slice(0,12);
  if(r.source && !/^https:\/\//.test(r.source.url||'')) delete r.source;
  delete r.draft;
  Object.assign(r, {likes:0, success:0, shared:true, mine:!!x.mine, isNew:!!x.isNew, sharedAt:x.at});
  try{ await loadCls(r.cls); analyse(r); cardHTML(r); }catch(e){ return null; }
  return r;
}
async function applyShared(d){
  S.shareCan = !!d.can;
  const list=[]; for(const x of d.items){ const r=await cleanShared(x); if(r && !list.some(y=>y.id===r.id)) list.push(r); }
  const keep = S.recipes.filter(r=>!r.shared);
  const drafts = keep.filter(r=>r.draft), rest = keep.filter(r=>!r.draft);
  S.recipes = drafts.concat(list, rest);
  if(S.open && S.recipes.some(r=>r.id===S.open)) render();
  else if(S.open && /^s-/.test(S.open) && d.loaded) setOpen(null);
  else render();
  if(S.pendingOpen && list.some(r=>r.id===S.pendingOpen)){ const id=S.pendingOpen; S.pendingOpen=null; setOpen(id); }
  const h=location.hash.match(/^#r-(s-[a-z0-9]+)$/); if(h && !S.open && list.some(r=>r.id===h[1])) setOpen(h[1]);
}
// press once to arm, press again within 4 s to do it (window.confirm is blocked in the artifact sandbox)
function armed(btn, label){ if(btn.dataset.armed==='1'){ delete btn.dataset.armed; clearTimeout(btn._armT); return true; }
  btn.dataset.armed='1'; btn.dataset.orig=btn.textContent; btn.textContent=label; btn.classList.add('arm');
  btn._armT=setTimeout(()=>{ delete btn.dataset.armed; btn.textContent=btn.dataset.orig; btn.classList.remove('arm'); }, 4000); return false; }
function shareDraft(id, btn){
  const r=S.recipes.find(x=>x.id===id && x.draft); if(!r) return;
  const out={...r, id:'s-'+id.replace(/^draft-/,'')}; for(const k of ['draft','_an','likes','success','shared','mine','isNew','sharedAt']) delete out[k];
  out.created = new Date().toISOString().slice(0,10);
  btn.disabled=true; S.sharing={from:id, to:out.id};
  try{ parent.postMessage({type:'poe2-share', recipe:JSON.parse(JSON.stringify(out))}, '*'); }catch(e){ btn.disabled=false; }
}
function unshare(id, btn){
  if(!armed(btn, L('한 번 더 누르면 공유 취소 (모두에게서 사라져요)','Press again to unshare (removed for everyone)'))) return;
  btn.disabled=true; try{ parent.postMessage({type:'poe2-unshare', id}, '*'); }catch(e){ btn.disabled=false; }
}
function shareResult(d){
  const why = c => c==='quota_exceeded' ? L('저장 공간이 가득 찼어요.','Storage is full.') : c==='too_big' ? L('레시피가 너무 커요.','The recipe is too large.')
    : c==='unavailable' ? L('지금은 공유 저장소에 연결할 수 없어요.','The shared store is not reachable right now.') : L('권한이 없거나 저장하지 못했어요.','You cannot save here, or saving failed.');
  if(d.op==='poe2-share'){
    if(d.ok && S.sharing){ const {from,to}=S.sharing; S.sharing=null; S.pendingOpen=to; removeDraft(from); toast(L('공유 레시피로 등록했어요','Recipe shared')); }
    else { S.sharing=null; render(); toast(why(d.code)); }
  } else { if(d.ok){ toast(L('공유를 취소했어요','Unshared')); } else { render(); toast(why(d.code)); } }
}
// drafts made on the Discover tab: kept in this browser, shown first with a draft badge
async function addDraft(r, open){
  if(!/^draft-[a-z0-9]+$/.test(r.id) || !Array.isArray(r.nodes)) return;
  r = {likes:0, success:0, ...r, draft:true}; delete r._an;
  S.recipes = S.recipes.filter(x=>x.id!==r.id); S.recipes.unshift(r);
  const all = store.get('drafts',[]).filter(x=>x.id!==r.id); all.unshift(r); store.set('drafts', all.slice(0,12));
  await loadCls(r.cls);
  if(open){ S.open=null; render(); setOpen(r.id); } else render();
}
// all drafts at once: they live only in this browser, so this cannot touch anyone else's list or the shared recipes
document.addEventListener('click', e=>{ if(!e.target.closest('#clrdrafts')) return; const n=S.recipes.filter(r=>r.draft).length; if(!n) return;
  if(!armed(e.target.closest('#clrdrafts'), L(`한 번 더 누르면 초안 ${n}개 삭제`,`Press again to delete ${n} drafts`))) return;
  store.set('drafts', []); const open=S.open && S.recipes.some(r=>r.draft && r.id===S.open); S.recipes=S.recipes.filter(r=>!r.draft); if(open) setOpen(null); render();
  toast(L('역산 초안을 모두 지웠어요','All drafts deleted')); });
function removeDraft(id){ store.set('drafts', store.get('drafts',[]).filter(x=>x.id!==id)); S.recipes=S.recipes.filter(x=>x.id!==id); if(S.open===id) setOpen(null); render(); }

// ---------- boot ----------
async function loadCls(id){ if(!S.cls[id]) S.cls[id] = await fetch(`data/c/${id}.json`).then(r=>r.json()); }
async function boot(){
  const [rec, idx, craft, tips] = await Promise.all([fetch('data/recipes.json').then(r=>r.json()), fetch('data/index.json').then(r=>r.json()), fetch('data/crafting.json').then(r=>r.json()), fetch('data/tips.json').then(r=>r.ok?r.json():{tips:[]}).catch(()=>({tips:[]}))]);
  S.tips = tips.tips||[];
  S.index=idx; S.craft=craft; for(const k in craft) for(const x of craft[k]) S.byId[x.id]=x;
  S.recipes = rec.recipes.map(r=>({likes:0, success:0, ...r}));
  const drafts = store.get('drafts',[]).filter(r=>r && /^draft-/.test(r.id) && Array.isArray(r.nodes)).map(r=>({likes:0, success:0, ...r, draft:true}));
  S.recipes = drafts.concat(S.recipes);
  await Promise.all([...new Set(S.recipes.map(r=>r.cls))].map(loadCls));
  const h=location.hash.match(/^#r-(.+)$/); if(h && S.recipes.some(r=>r.id===h[1])) S.open=h[1];
  S.booted=true; render();
  if(S.pendingDraft){ const d=S.pendingDraft; S.pendingDraft=null; addDraft(d, true); }
  if(S.pendingShared){ const d=S.pendingShared; S.pendingShared=null; applyShared(d); }
  try{ if(parent!==window) parent.postMessage({type:'poe2-share-ready'}, '*'); }catch(_){}
}
boot();
if(location.search.includes('debug')) window.__rec = Object.assign(S, {renderBoard:()=>renderBoard()});
})();
</script>
