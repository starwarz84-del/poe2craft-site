<title>POE2 Crafting</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: a thin bar (name · tool tabs · language) over a full-height tool. Emulator is the default view. */
:root{
  --bg:#13151a; --bar:#181a20; --line:#2e333e; --fg:#e8e3d8; --muted:#959ba6; --accent:#c8a85a;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex:none;background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px 20px;flex-wrap:wrap;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:48px}
.name{font-weight:600;font-size:15px;letter-spacing:.01em;color:var(--fg);text-decoration:none;white-space:nowrap}
.name span{color:var(--accent)}
nav{display:flex;align-self:stretch;gap:4px}
nav a{display:flex;align-items:center;padding:0 12px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav a:hover{color:var(--fg)}
nav a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.lang{margin-left:auto;display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{background:transparent;border:0;color:var(--muted);font:inherit;font-size:12.5px;padding:5px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#262a33;color:var(--fg)}
main{flex:1 1 auto;min-height:0;position:relative}
main iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
body.toolfull main{position:fixed;inset:0;z-index:200;border:0;max-width:none;margin:0}   /* flowchart full screen uses the whole window (사용자 2026-11-11) */
@media (max-width:480px){.bar{gap:0 12px}nav a{padding:0 8px}}
nav a .nb{margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#13151a;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:20;max-width:min(360px,calc(100vw - 32px));background:#22252d;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 14px;color:var(--fg);font:inherit;text-align:left;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.toast small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
</style>

<header class="bar">
  <a class="name" href="#emulator">POE2 <span>Crafting</span></a>
  <nav aria-label="Tools">
    <a href="#emulator" data-view="emulator" data-en="Emulator" data-kr="에뮬레이터">Emulator</a>
    <a href="#builder" data-view="builder" data-en="Item Builder" data-kr="옵션 빌더">Item Builder</a>
    <a href="#recipes" data-view="recipes" data-en="Recipes" data-kr="레시피">Recipes</a>
    <a href="#discover" data-view="discover" data-en="Discover" data-kr="발굴">Discover</a>
    <a href="#bases" data-view="bases" data-en="Special Bases" data-kr="특수 베이스">Special Bases</a>
  </nav>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" id="l-en" aria-pressed="true">EN</button>
    <button type="button" id="l-kr" aria-pressed="false">한국어</button>
  </div>
</header>
<main id="main"></main>

<script>
(() => {
  const SRC = {emulator:'emulator.html', builder:'builder.html', recipes:'recipes.html', discover:'discover.html', bases:'bases.html'};
  const frames = {};
  let lang = 'en';
  try{ lang = localStorage.getItem('poe2lang') || 'en'; }catch(e){}
  const links = [...document.querySelectorAll('nav a')];
  function setLang(l){
    lang = l; document.documentElement.lang = l==='en'?'en':'ko';
    try{ localStorage.setItem('poe2lang', l); }catch(e){}
    document.getElementById('l-en').setAttribute('aria-pressed', l==='en');
    document.getElementById('l-kr').setAttribute('aria-pressed', l==='kr');
    links.forEach(a=>a.textContent = a.dataset[l]); badge();
    Object.values(frames).forEach(f=>{ try{ f.contentWindow.postMessage({type:'poe2-lang', lang:l}, '*'); }catch(e){} });
  }
  function show(){
    let v = location.hash.slice(1), rid = null;
    if(v.startsWith('r-')){ rid = v.slice(2); v = 'recipes'; }   // #r-<id> = a shared recipe
    if(!SRC[v]) v = 'emulator';
    links.forEach(a=>{ if(a.dataset.view===v) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
    // each tool loads once and stays alive, so work in progress survives switching tabs
    if(!frames[v]){ const f=document.createElement('iframe'); f.src=`${SRC[v]}?lang=${lang}${rid?'#r-'+rid:''}`; f.title=links.find(a=>a.dataset.view===v).textContent;
      f.addEventListener('load', ()=>{ try{ f.contentWindow.postMessage({type:'poe2-lang', lang}, '*'); }catch(e){} }); frames[v]=f; document.getElementById('main').appendChild(f); }
    else if(rid){ try{ frames[v].contentWindow.postMessage({type:'poe2-open', id:rid}, '*'); }catch(e){} }
    Object.entries(frames).forEach(([k,f])=>f.hidden = k!==v);
    if(v==='recipes') markSeen(); else badge();
  }
  // tools inside frames ask the shell to save files (the page's downloads capability)
  let dl=null; const dlReady = (async()=>{ try{ if(window.claude && claude.use) dl = await claude.use('downloads'); }catch(e){ dl=null; } })();
  window.addEventListener('message', async e=>{ const d=e.data||{}; if(d.type!=='poe2-download' || !Object.values(frames).some(f=>f.contentWindow===e.source)) return;
    await dlReady; let out={type:'poe2-download-result', id:d.id};
    if(!dl) out.code='unavailable';
    else { try{ const r=await dl.save({filename:d.filename, data:d.blob}); out.status=r.status; }catch(err){ out.code=err&&err.code||'unavailable'; } }
    try{ e.source.postMessage(out, '*'); }catch(_){} });
  // a tool can update the address (e.g. an opened recipe) without reloading anything
  window.addEventListener('message', e=>{ const d=e.data||{}; if(d.type==='poe2-full' && Object.values(frames).some(f=>f.contentWindow===e.source)) document.body.classList.toggle('toolfull', !!d.on); });
  window.addEventListener('message', e=>{ const d=e.data||{}; if(d.type==='poe2-route' && /^[A-Za-z0-9-]+$/.test(d.hash||'') && frames.recipes && e.source===frames.recipes.contentWindow){
    if(location.hash.slice(1)!==d.hash){ try{ history.replaceState(null,'','#'+d.hash); }catch(_){ } } } });
  // Special Bases links a recipe → open it in Recipes
  window.addEventListener('message', e=>{ const d=e.data||{}; if(d.type!=='poe2-goto' || !Object.values(frames).some(f=>f.contentWindow===e.source) || !/^[A-Za-z0-9-]+$/.test(d.id||'')) return; location.hash='r-'+d.id; });
  // a draft made on Discover opens in Recipes
  window.addEventListener('message', e=>{ const d=e.data||{}; if(d.type!=='poe2-reverse' || !frames.builder || e.source!==frames.builder.contentWindow || typeof d.text!=='string') return;   // 속성부여 → 리버스 크래프팅
    const had = !!frames.discover; location.hash = 'discover'; show();
    const send = ()=>{ try{ frames.discover.contentWindow.postMessage({type:'poe2-reverse-in', text:d.text.slice(0,8000)}, '*'); }catch(_){} };
    if(had) send(); else frames.discover.addEventListener('load', send, {once:true}); });
  window.addEventListener('message', e=>{ const d=e.data||{}; if(d.type!=='poe2-draft' || !frames.discover || e.source!==frames.discover.contentWindow) return;
    if(d.stay){ if(frames.recipes) try{ frames.recipes.contentWindow.postMessage({type:'poe2-draft', recipe:d.recipe, stay:true}, '*'); }catch(_){} return; }   // reverse tab keeps its place (사용자 확정 2026-11-11)
    const had = !!frames.recipes; location.hash = 'recipes'; show();
    const send = ()=>{ try{ frames.recipes.contentWindow.postMessage({type:'poe2-draft', recipe:d.recipe}, '*'); }catch(_){} };
    if(had) send(); else frames.recipes.addEventListener('load', send, {once:true}); });
  // ---------- shared recipes (db) ----------
  // Each person keeps the recipes they registered in one document, shared/<their id> = {recipes:{<id>:{recipe, at}}}.
  // Everyone who can open the page reads them; each writes only their own document (the owner can tidy any).
  const SH = {db:null, uid:null, can:false, items:[], loaded:false, seen:0, newSince:null, first:true};
  try{ SH.seen = +localStorage.getItem('poe2seen') || 0; }catch(e){}
  function newCount(){ return SH.items.filter(x=>!x.mine && x.at > SH.seen).length; }
  function badge(){
    const a = links.find(x=>x.dataset.view==='recipes'); if(!a) return;
    let b = a.querySelector('.nb'); const n = newCount();
    if(!n || frames.recipes && !frames.recipes.hidden){ if(b) b.remove(); return; }
    if(!b){ b=document.createElement('span'); b.className='nb'; a.appendChild(b); }
    b.textContent = n; b.title = lang==='kr' ? `새 레시피 ${n}개` : `${n} new recipe${n>1?'s':''}`;
  }
  function pushShared(){
    if(!frames.recipes) return;
    const since = SH.newSince ?? SH.seen;
    const items = SH.items.map(x=>({recipe:x.recipe, at:x.at, mine:x.mine, isNew:!x.mine && x.at>since}));
    try{ frames.recipes.contentWindow.postMessage({type:'poe2-shared', items, can:SH.can, loaded:SH.loaded}, '*'); }catch(_){}
  }
  function markSeen(){   // opening Recipes: NEW tags stay for this visit, the badge clears
    if(SH.newSince==null) SH.newSince = SH.seen;
    const top = Math.max(SH.seen, ...SH.items.map(x=>x.at));
    if(top>SH.seen){ SH.seen=top; try{ localStorage.setItem('poe2seen', String(top)); }catch(_){} }
    badge();
  }
  let toastT;
  function toast(item){
    document.querySelector('.toast')?.remove(); clearTimeout(toastT);
    const t=document.createElement('button'); t.type='button'; t.className='toast';
    const s=document.createElement('small'); s.textContent = lang==='kr'?'새 레시피가 등록됐어요':'New recipe shared';
    const r=item.recipe, name=(r.title && (r.title[lang]||r.title.en||r.title.kr)) || r.id;
    t.append(s, document.createTextNode(name));
    t.addEventListener('click', ()=>{ t.remove(); location.hash='r-'+r.id; });
    document.body.appendChild(t); toastT=setTimeout(()=>t.remove(), 9000);
  }
  (async()=>{
    if(!(window.claude && claude.use)) return;
    let user=null;
    try{ [SH.db, user] = await Promise.all([claude.use('db'), claude.use('user')]); }catch(e){ SH.db=null; }
    if(!SH.db) return;
    try{ SH.uid = user ? await user.id() : null; }catch(e){}
    try{ const w = user ? await user.can('data.write') : null; SH.can = !!SH.uid && w!==false; }catch(e){ SH.can=!!SH.uid; }
    pushShared();
    SH.db.collection('shared').onSnapshot(snap=>{
      const items=[];
      for(const d of snap.docs){ const recs=(d.data()||{}).recipes; if(!recs || typeof recs!=='object') continue;
        for(const k in recs){ const x=recs[k]; if(x && x.recipe && typeof x.recipe==='object' && typeof x.at==='number') items.push({recipe:x.recipe, at:x.at, mine:d.id===SH.uid}); } }
      items.sort((a,b)=>b.at-a.at);
      const before = new Set(SH.items.map(x=>x.recipe.id));
      const fresh = SH.first ? [] : items.filter(x=>!x.mine && !before.has(x.recipe.id));
      SH.items=items; if(!snap.metadata.fromCache){ SH.loaded=true; SH.first=false; }
      if(frames.recipes && !frames.recipes.hidden) markSeen(); else badge();
      pushShared();
      if(fresh.length && !(frames.recipes && !frames.recipes.hidden)) toast(fresh[0]);
    }, ()=>{ SH.loaded=true; pushShared(); });
  })();
  async function writeShared(fn){
    const ref = SH.db.doc('shared/'+SH.uid), cur = await ref.get();
    const recs = Object.assign({}, cur.exists ? (cur.data().recipes||{}) : {});
    fn(recs); await ref.set({recipes:recs});
  }
  window.addEventListener('message', async e=>{ const d=e.data||{};
    if(!frames.recipes || e.source!==frames.recipes.contentWindow) return;
    if(d.type==='poe2-share-ready'){ pushShared(); return; }
    if(d.type!=='poe2-share' && d.type!=='poe2-unshare') return;
    const out={type:'poe2-share-result', op:d.type, id:d.recipe?.id||d.id};
    if(!SH.db || !SH.can){ out.code='unavailable'; }
    else try{
      if(d.type==='poe2-share'){
        const r=d.recipe; if(!r || !/^s-[a-z0-9]+$/.test(r.id||'')) throw {code:'invalid_argument'};
        const s=JSON.stringify(r); if(s.length>120000) throw {code:'too_big'};
        await writeShared(recs=>{ recs[r.id]={recipe:JSON.parse(s), at:Date.now()}; });
      } else {
        if(!/^s-[a-z0-9]+$/.test(d.id||'')) throw {code:'invalid_argument'};
        await writeShared(recs=>{ delete recs[d.id]; });
      }
      out.ok=true;
    }catch(err){ out.code = err&&err.code || 'unavailable'; }
    try{ e.source.postMessage(out, '*'); }catch(_){} });

  document.getElementById('l-en').addEventListener('click', ()=>setLang('en'));
  document.getElementById('l-kr').addEventListener('click', ()=>setLang('kr'));
  window.addEventListener('hashchange', show);
  setLang(lang); show();
})();
</script>
