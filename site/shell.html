<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PoE 2 Craft - Path of Exile 2 Crafting Simulator &amp; Recipes</title>
<meta name="description" content="Path of Exile 2 crafting emulator, option builder and step-by-step crafting recipes with probabilities calculated from game data. English and Korean.">
<meta property="og:title" content="PoE 2 Craft - Path of Exile 2 Crafting Simulator & Recipes">
<meta property="og:description" content="Try currency on any base, build target items, and follow crafting recipes with real probabilities.">
<meta property="og:url" content="https://poe2craft.xyz">
<meta property="og:type" content="website">
<meta property="og:site_name" content="PoE 2 Craft">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* Fontin SmallCaps by Jos Buivenga, exljbris Font Foundry - https://www.exljbris.com (free font, embedded under the exljbris EULA) */
@font-face{font-family:"Fontin SmallCaps";src:url("fonts/fontin-sc.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
/* SUIT by SUNN (sun.fo/suit) - SIL Open Font License 1.1, see fonts/SUIT-OFL.txt */
@font-face{font-family:"SUIT Variable";src:url("fonts/SUIT-Variable.woff2") format("woff2-variations"),url("fonts/SUIT-Variable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
/* Shell for poe2craft.xyz — trade-site layout: banner with wordmark, icon tab bar, one framed tool panel below.
   Each tool is its own page in an iframe and stays loaded while you switch tabs. */
:root{
  --bg:#0e1115; --text:#a38d6d; --hi:#e9cf9f; --white:#e2e2e2; --edge:#2c2317; --tab:rgba(10,10,10,.9); --tab-on:#5a3806;
  --f-title:"Fontin SmallCaps",Verdana,Arial,"SUIT Variable","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;
  --f-body:Verdana,Arial,Helvetica,"SUIT Variable","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;
  --lw:300px; --banner:244px; --tabs:32px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--text);font-family:var(--f-body);font-size:13px;overflow:hidden;
  background:
    linear-gradient(rgba(8,6,4,.45), rgba(8,6,4,.45)),
    linear-gradient(180deg, rgba(10,8,6,.35) 0, rgba(10,8,6,.6) 160px, rgba(10,8,6,.85) 55%, rgba(10,8,6,.94) 100%),
    url("img/bg.webp") center top / cover no-repeat,
    var(--bg);}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
a{color:var(--hi)}

.wrapper{max-width:1520px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:0 5px}

/* banner — spacing follows poe2filter.com: logo with room above/below, tab bar right under it */
.logo{position:relative;flex:none;height:var(--banner);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding-bottom:46px;
  transition:height .25s ease, padding .25s ease, opacity .2s ease}
.brand{position:relative;display:block;width:var(--lw);aspect-ratio:1146/618;flex:none}
.brand img{display:block;position:absolute;pointer-events:none;transition:opacity .35s ease}
.brand .main{inset:0;width:100%;height:100%}
/* sit the logo into the scene: dark halo behind it, a faint warm light, a soft shadow, colors toned to the darker background */
.brand::before{content:"";position:absolute;inset:-38% -42%;pointer-events:none;z-index:-1;
  background:radial-gradient(ellipse 50% 50% at 50% 54%, rgba(0,0,0,.72) 0, rgba(0,0,0,.45) 45%, transparent 72%),
             radial-gradient(ellipse 34% 30% at 50% 30%, rgba(214,140,70,.12), transparent 70%)}
.brand .main{filter:drop-shadow(0 10px 18px rgba(0,0,0,.85)) drop-shadow(0 0 2px rgba(0,0,0,.9)) brightness(.93) saturate(.92)}
.brand .ext{width:calc(var(--lw)*1.2208);height:auto;left:calc(var(--lw)*-.1056);top:calc(var(--lw)*-.0820);opacity:0}
body.extreme .brand .ext{opacity:1} body.extreme .brand .main{opacity:0}
body.compact{--banner:0px} body.compact .logo{padding-bottom:0;opacity:0;pointer-events:none}
/* test 2026-11-11: drifting fog under the logo + rising embers (canvas). Off for reduced motion. */
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fx canvas{position:absolute;inset:0;width:100%;height:100%}
.brand{z-index:1}
.fog{position:absolute;left:18%;right:18%;bottom:18px;height:70px;pointer-events:none;z-index:2;opacity:.45;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent);mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent);
  background:
    radial-gradient(ellipse 22% 60% at 30% 60%, rgba(170,155,140,.36), transparent 70%),
    radial-gradient(ellipse 26% 55% at 62% 70%, rgba(160,145,130,.32), transparent 70%),
    radial-gradient(ellipse 18% 50% at 82% 55%, rgba(170,155,140,.26), transparent 70%),
    radial-gradient(ellipse 20% 50% at 12% 65%, rgba(170,155,140,.26), transparent 70%);
  filter:blur(6px);animation:fog 26s ease-in-out infinite alternate}
.fog.b{animation-duration:34s;animation-direction:alternate-reverse;opacity:.3;bottom:30px;height:50px}
@keyframes fog{from{transform:translateX(-4%)}to{transform:translateX(4%)}}
body.compact .fx,body.compact .fog{display:none}
@media (prefers-reduced-motion:reduce){.fog{animation:none}.fx{display:none}}
.corner{position:absolute;top:12px;font-size:12.5px;display:flex;gap:6px;align-items:center}
.corner.l{left:4px}.corner.r{right:4px}
.lang button{background:none;border:0;padding:2px 3px;font:inherit;color:var(--text);cursor:pointer}
.lang button[aria-pressed="true"]{color:var(--hi)}
.lang button:hover{color:var(--white)}
.lang span{opacity:.5}
.ver{color:#6f604a}

/* tab bar */
.tabs{flex:none;display:flex;margin:0;padding:0;list-style:none;height:var(--tabs);border-bottom:1px solid var(--edge);gap:1px}
.tabs li{background:var(--tab)}
.tabs .sp{flex:1;background:var(--tab)}
.tabs a{height:100%;display:flex;align-items:center;gap:7px;padding:0 13px;color:var(--text);text-decoration:none;font-size:13px;white-space:nowrap;
  border:1px solid transparent;border-bottom:0}
.tabs a:hover{color:var(--white);background:rgba(90,56,6,.35)}
.tabs a[aria-current="page"]{background:var(--tab-on);color:#fff3dc;border-color:#7a5418}
.tabs svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabs .ic-only span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.nb{min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:#c8a85a;color:#120d06;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}

/* tool panel */
main{flex:1 1 auto;min-height:0;position:relative;border:1px solid var(--edge);border-top:0;background:linear-gradient(#0e0b06 50%,#000)}
main iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}

.toast{position:fixed;right:16px;bottom:16px;z-index:20;max-width:min(360px,calc(100vw - 32px));background:#15110b;border:1px solid #3a2d1b;border-left:3px solid #c8a85a;padding:10px 14px;color:var(--white);font:inherit;text-align:left;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.6)}
.toast small{display:block;color:var(--text);font-size:12px;margin-bottom:2px}

@media (max-height:820px){ :root{--lw:220px; --banner:184px} .logo{padding-bottom:32px} }
@media (max-height:620px){ :root{--lw:150px; --banner:118px} .logo{padding-bottom:20px} }
@media (max-width:860px){ :root{--lw:200px; --banner:176px} .tabs a{padding:0 9px} .tabs a.lbl span{display:none} .corner.l{display:none} .wrapper{padding:0} }
</style>
</head>
<body>
<div class="wrapper">
  <div class="logo">
    <div class="fx" aria-hidden="true"><canvas id="embers"></canvas></div>
    <div class="fog" aria-hidden="true"></div><div class="fog b" aria-hidden="true"></div>
    <div class="corner l"><span class="ver" data-kr="POE2 크래프팅 시뮬레이터 · 레시피" data-en="PoE 2 crafting simulator · recipes">PoE 2 crafting simulator · recipes</span></div>
    <a class="brand" href="#recipes" aria-label="PoE 2 Craft">
      <img class="main" src="img/logo.webp" alt="PoE 2 Craft" width="640" height="345">
      <img class="ext" src="img/logo-extreme.webp" alt="" width="781" height="429">
    </a>
    <div class="corner r lang" role="group" aria-label="Language">
      <button type="button" id="l-en" aria-pressed="true">English</button><span>·</span><button type="button" id="l-kr" aria-pressed="false">한국어</button>
    </div>
  </div>

  <ul class="tabs" role="list">
    <li><a class="lbl" href="#recipes" data-view="recipes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h12l-2 4H7z"/><path d="M15 9h3a3 3 0 0 1 3 3"/><path d="M9 13v4M7 21h6l-1-4H8z"/></svg><span data-en="Crafting" data-kr="크래프팅">Crafting</span></a></li>
    <li><a class="lbl" href="#discover" data-view="discover"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v4h4"/><path d="M12 8v4l3 2"/></svg><span data-en="Reverse Crafting" data-kr="리버스 크래프팅">Reverse Crafting</span></a></li>
    <li><a class="lbl" href="#emulator" data-view="emulator"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3"/><circle cx="12" cy="12" r="2"/></svg><span data-en="Emulator" data-kr="에뮬레이터">Emulator</span></a></li>
    <li><a class="lbl" href="#builder" data-view="builder"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span data-en="Modifiers" data-kr="속성부여">Modifiers</span></a></li>
    <li><a class="lbl" href="#bases" data-view="bases"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg><span data-en="Data" data-kr="데이터">Data</span></a></li>
    <li class="sp" aria-hidden="true"></li>
    <li><a class="lbl" href="#about" data-view="about"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h0"/></svg><span data-en="Info" data-kr="정보">Info</span></a></li>
  </ul>

  <main id="main"></main>
</div>

<script>
(() => {
  const SRC = {emulator:'emulator.html', builder:'builder.html', recipes:'recipes.html', discover:'discover.html', bases:'bases.html', about:'about.html'};
  const frames = {};
  let lang = 'en';
  try{ lang = localStorage.getItem('poe2lang') || ((navigator.language||'').startsWith('ko') ? 'kr' : 'en'); }catch(e){}
  const links = [...document.querySelectorAll('.tabs a')];
  function setLang(l){
    lang = l; document.documentElement.lang = l==='en'?'en':'ko';
    try{ localStorage.setItem('poe2lang', l); }catch(e){}
    document.getElementById('l-en').setAttribute('aria-pressed', l==='en');
    document.getElementById('l-kr').setAttribute('aria-pressed', l==='kr');
    document.querySelectorAll('[data-kr]').forEach(el=>el.textContent = el.dataset[l]);
    links.forEach(a=>{ const s=a.querySelector('span'); if(s) a.title = s.textContent; });
    badge();
    Object.values(frames).forEach(f=>{ try{ f.contentWindow.postMessage({type:'poe2-lang', lang:l}, '*'); }catch(e){} });
  }
  function show(){
    let v = location.hash.slice(1), rid = null;
    if(v.startsWith('r-')){ rid = v.slice(2); v = 'recipes'; }   // #r-<id> = one recipe
    if(!SRC[v]) v = 'recipes';
    links.forEach(a=>{ if(a.dataset.view===v) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
    if(!frames[v]){ const f=document.createElement('iframe'); f.src=`${SRC[v]}?lang=${lang}${rid?'#r-'+rid:''}`; f.title=v;
      f.addEventListener('load', ()=>{ try{ f.contentWindow.postMessage({type:'poe2-lang', lang}, '*'); }catch(e){} watchScroll(f); }); frames[v]=f; document.getElementById('main').appendChild(f); }
    else if(rid){ try{ frames[v].contentWindow.postMessage({type:'poe2-open', id:rid}, '*'); }catch(e){} }
    Object.entries(frames).forEach(([k,f])=>f.hidden = k!==v);
    if(v==='recipes') markSeen(); else badge();
    document.body.classList.toggle('extreme', v==='recipes' && extreme);
    setCompact(frames[v]._top > 40);
  }

  // ---------- banner: fire logo on extreme recipes, folds away while a tool page is scrolled ----------
  let extreme = false;
  function setCompact(on){ document.body.classList.toggle('compact', !!on); }
  function watchScroll(f){
    let doc; try{ doc = f.contentDocument; }catch(e){ return; } if(!doc) return;
    f._top = 0;
    doc.addEventListener('scroll', ev=>{
      const t = ev.target, el = (t===doc || t===doc.documentElement || t===doc.body) ? (doc.scrollingElement||doc.documentElement) : t;
      if(!el || el.scrollHeight - el.clientHeight < 260) return;   // short pages: leave the banner alone (no fold/unfold loop)
      const top = el.scrollTop, prev = f._top; f._top = top;
      if(f.hidden) return;
      if(top > 40 && top > prev) setCompact(true);
      else if(top < 6) setCompact(false);
    }, true);
  }
  window.addEventListener('message', e=>{ const d=e.data||{}; if(d.type==='poe2-route' && frames.recipes && e.source===frames.recipes.contentWindow){
    extreme = !!d.extreme; document.body.classList.toggle('extreme', extreme && !frames.recipes.hidden); } });

  // ---------- downloads: tools ask the shell to save a file ----------
  // On claude.ai the page's downloads capability saves it; on our own domain a normal browser download does.
  let dl=null; const dlReady = (async()=>{ try{ if(window.claude && claude.use) dl = await claude.use('downloads'); }catch(e){ dl=null; } })();
  function browserSave(name, blob){
    const url = URL.createObjectURL(blob instanceof Blob ? blob : new Blob([blob]));
    const a = document.createElement('a'); a.href=url; a.download=name||'download'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
  }
  window.addEventListener('message', async e=>{ const d=e.data||{}; if(d.type!=='poe2-download' || !Object.values(frames).some(f=>f.contentWindow===e.source)) return;
    await dlReady; let out={type:'poe2-download-result', id:d.id};
    if(dl){ try{ const r=await dl.save({filename:d.filename, data:d.blob}); out.status=r.status; }catch(err){ out.code=err&&err.code||'unavailable'; } }
    else { try{ browserSave(d.filename, d.blob); out.status='saved'; }catch(err){ out.code='unavailable'; } }
    try{ e.source.postMessage(out, '*'); }catch(_){} });

  window.addEventListener('message', e=>{ const d=e.data||{}; if(d.type==='poe2-route' && /^[A-Za-z0-9-]+$/.test(d.hash||'') && frames.recipes && e.source===frames.recipes.contentWindow){
    if(location.hash.slice(1)!==d.hash){ try{ history.replaceState(null,'','#'+d.hash); }catch(_){ } } } });
  window.addEventListener('message', e=>{ const d=e.data||{}; if(d.type!=='poe2-goto' || !Object.values(frames).some(f=>f.contentWindow===e.source) || !/^[A-Za-z0-9-]+$/.test(d.id||'')) return;
    location.hash = SRC[d.id] ? d.id : 'r-'+d.id; });
  window.addEventListener('message', e=>{ const d=e.data||{}; if(d.type!=='poe2-draft' || !frames.discover || e.source!==frames.discover.contentWindow) return;
    const had = !!frames.recipes; location.hash = 'recipes'; show();
    const send = ()=>{ try{ frames.recipes.contentWindow.postMessage({type:'poe2-draft', recipe:d.recipe}, '*'); }catch(_){} };
    if(had) send(); else frames.recipes.addEventListener('load', send, {once:true}); });

  // ---------- shared recipes ----------
  // Works where a shared store exists (claude.ai artifact db today). On our own domain this stays "unavailable"
  // until a server store is added — Recipes then keeps drafts in the browser only.
  const SH = {db:null, uid:null, can:false, items:[], loaded:false, seen:0, newSince:null, first:true};
  try{ SH.seen = +localStorage.getItem('poe2seen') || 0; }catch(e){}
  function newCount(){ return SH.items.filter(x=>!x.mine && x.at > SH.seen).length; }
  function badge(){
    const a = links.find(x=>x.dataset.view==='recipes'); if(!a) return;
    let b = a.querySelector('.nb'); const n = newCount();
    if(!n || frames.recipes && !frames.recipes.hidden){ if(b) b.remove(); return; }
    if(!b){ b=document.createElement('span'); b.className='nb'; a.appendChild(b); }
    b.textContent = n; b.title = lang==='kr' ? `새 레시피 ${n}개` : `${n} new recipe${n>1?'s':''}`;
  }
  function pushShared(){
    if(!frames.recipes) return;
    const since = SH.newSince ?? SH.seen;
    const items = SH.items.map(x=>({recipe:x.recipe, at:x.at, mine:x.mine, isNew:!x.mine && x.at>since}));
    try{ frames.recipes.contentWindow.postMessage({type:'poe2-shared', items, can:SH.can, loaded:SH.loaded}, '*'); }catch(_){}
  }
  function markSeen(){
    if(SH.newSince==null) SH.newSince = SH.seen;
    const top = Math.max(SH.seen, ...SH.items.map(x=>x.at));
    if(top>SH.seen){ SH.seen=top; try{ localStorage.setItem('poe2seen', String(top)); }catch(_){} }
    badge();
  }
  let toastT;
  function toast(item){
    document.querySelector('.toast')?.remove(); clearTimeout(toastT);
    const t=document.createElement('button'); t.type='button'; t.className='toast';
    const s=document.createElement('small'); s.textContent = lang==='kr'?'새 레시피가 등록됐어요':'New recipe shared';
    const r=item.recipe, name=(r.title && (r.title[lang]||r.title.en||r.title.kr)) || r.id;
    t.append(s, document.createTextNode(name));
    t.addEventListener('click', ()=>{ t.remove(); location.hash='r-'+r.id; });
    document.body.appendChild(t); toastT=setTimeout(()=>t.remove(), 9000);
  }
  (async()=>{
    if(!(window.claude && claude.use)){ SH.loaded=true; return; }
    let user=null;
    try{ [SH.db, user] = await Promise.all([claude.use('db'), claude.use('user')]); }catch(e){ SH.db=null; }
    if(!SH.db){ SH.loaded=true; pushShared(); return; }
    try{ SH.uid = user ? await user.id() : null; }catch(e){}
    try{ const w = user ? await user.can('data.write') : null; SH.can = !!SH.uid && w!==false; }catch(e){ SH.can=!!SH.uid; }
    pushShared();
    SH.db.collection('shared').onSnapshot(snap=>{
      const items=[];
      for(const d of snap.docs){ const recs=(d.data()||{}).recipes; if(!recs || typeof recs!=='object') continue;
        for(const k in recs){ const x=recs[k]; if(x && x.recipe && typeof x.recipe==='object' && typeof x.at==='number') items.push({recipe:x.recipe, at:x.at, mine:d.id===SH.uid}); } }
      items.sort((a,b)=>b.at-a.at);
      const before = new Set(SH.items.map(x=>x.recipe.id));
      const fresh = SH.first ? [] : items.filter(x=>!x.mine && !before.has(x.recipe.id));
      SH.items=items; if(!snap.metadata.fromCache){ SH.loaded=true; SH.first=false; }
      if(frames.recipes && !frames.recipes.hidden) markSeen(); else badge();
      pushShared();
      if(fresh.length && !(frames.recipes && !frames.recipes.hidden)) toast(fresh[0]);
    }, ()=>{ SH.loaded=true; pushShared(); });
  })();
  async function writeShared(fn){
    const ref = SH.db.doc('shared/'+SH.uid), cur = await ref.get();
    const recs = Object.assign({}, cur.exists ? (cur.data().recipes||{}) : {});
    fn(recs); await ref.set({recipes:recs});
  }
  window.addEventListener('message', async e=>{ const d=e.data||{};
    if(!frames.recipes || e.source!==frames.recipes.contentWindow) return;
    if(d.type==='poe2-share-ready'){ pushShared(); return; }
    if(d.type!=='poe2-share' && d.type!=='poe2-unshare') return;
    const out={type:'poe2-share-result', op:d.type, id:d.recipe?.id||d.id};
    if(!SH.db || !SH.can){ out.code='unavailable'; }
    else try{
      if(d.type==='poe2-share'){
        const r=d.recipe; if(!r || !/^s-[a-z0-9]+$/.test(r.id||'')) throw {code:'invalid_argument'};
        const s=JSON.stringify(r); if(s.length>120000) throw {code:'too_big'};
        await writeShared(recs=>{ recs[r.id]={recipe:JSON.parse(s), at:Date.now()}; });
      } else {
        if(!/^s-[a-z0-9]+$/.test(d.id||'')) throw {code:'invalid_argument'};
        await writeShared(recs=>{ delete recs[d.id]; });
      }
      out.ok=true;
    }catch(err){ out.code = err&&err.code || 'unavailable'; }
    try{ e.source.postMessage(out, '*'); }catch(_){} });

  document.getElementById('l-en').addEventListener('click', ()=>setLang('en'));
  document.getElementById('l-kr').addEventListener('click', ()=>setLang('kr'));
  window.addEventListener('hashchange', show);
  setLang(lang); show();

  // ---------- banner embers (test) ----------
  (()=>{
    const cv=document.getElementById('embers'); if(!cv || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cx=cv.getContext('2d'); let W=0,H=0,dpr=1; const P=[];
    function size(){ dpr=Math.min(2,devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*dpr; cv.height=H*dpr; cx.setTransform(dpr,0,0,dpr,0,0); }
    function spawn(p, fresh){ p.x=W/2+(Math.random()-.5)*Math.min(W,520); p.y=fresh?Math.random()*H:H+4; p.r=.5+Math.random()*1.1;
      p.vy=-(10+Math.random()*22); p.vx=(Math.random()-.5)*8; p.life=0; p.max=3+Math.random()*4; p.ph=Math.random()*6.3; return p; }
    size(); addEventListener('resize', size);
    for(let i=0;i<34;i++) P.push(spawn({}, true));
    let last=performance.now();
    function tick(t){ const dt=Math.min(.05,(t-last)/1000); last=t;
      if(!document.body.classList.contains('compact') && !document.hidden){
        cx.clearRect(0,0,W,H); cx.globalCompositeOperation='lighter';
        for(const p of P){ p.life+=dt; p.x+=(p.vx+Math.sin(p.ph+p.life*2)*6)*dt; p.y+=p.vy*dt;
          if(p.life>p.max || p.y<-6) spawn(p,false);
          const k=p.life/p.max, a=(k<.15?k/.15:1-(k-.15)/.85)*.85;
          const g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3);
          g.addColorStop(0,`rgba(255,235,190,${a})`); g.addColorStop(.25,`rgba(255,150,60,${a*.8})`); g.addColorStop(1,'rgba(255,80,20,0)');
          cx.fillStyle=g; cx.beginPath(); cx.arc(p.x,p.y,p.r*3,0,6.283); cx.fill();
          cx.fillStyle=`rgba(255,240,210,${a})`; cx.beginPath(); cx.arc(p.x,p.y,p.r*.6,0,6.283); cx.fill(); }
        cx.globalCompositeOperation='source-over'; }
      requestAnimationFrame(tick); }
    requestAnimationFrame(tick);
  })();
})();
</script>
