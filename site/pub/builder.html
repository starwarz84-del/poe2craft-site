<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:dark}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>POE2 옵션 빌더</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<script>try{if(window.self!==window.top)document.documentElement.classList.add('embed')}catch(e){document.documentElement.classList.add('embed')}</script>
<style>
.embed header.top{display:none}
.embed footer{display:none}
.embed header.top{justify-content:flex-end;margin-bottom:10px}
.embed .wrap{padding-block:12px 32px}
.embed .picker{max-height:calc(100vh - 80px)}

/* Layout: 3-column workbench — base picker | item card (implicit, 3+3 affix slots, rune sockets) | option pool. Stacks on narrow screens. */
:root{
  --bg:#13151a; --panel:#1b1e25; --panel-2:#22262f; --line:#2e333e; --fg:#e8e3d8; --muted:#959ba6; --faint:#6b717c;
  --prefix:#78b8cf; --suffix:#d9a65e; --des:#b994e6; --ess:#82c99c; --spec:#e59ab8; --rune:#9fb4ff; --corrupt:#e0605a; --sac:#ff9a6a;
  --rare:#ead77f; --warn:#e3806f; --focus:#f2e6c4; --ink:#14161a;
  --f-display:"Gowun Batang", "Apple SD Gothic Neo", serif;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 40px;max-width:1520px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:16px}
header.top h1{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0}
header.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 10px;cursor:pointer;color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg)}
.ilvl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.ilvl input{width:62px;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:5px 6px;font-family:var(--f-mono)}
.grid{display:grid;grid-template-columns:290px minmax(300px,370px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1150px){.grid{grid-template-columns:260px minmax(0,1fr)}.pool{grid-column:1 / -1}}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
/* the item card follows the page while the modifier list on the right scrolls the whole page (사용자 2026-11-11) */
@media (min-width:1151px){.card{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;scrollbar-width:thin}}
.col{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.col h2{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted);margin:0;padding:12px 14px 8px}
/* picker */
.picker{display:flex;flex-direction:column;max-height:calc(100vh - 130px);position:sticky;top:12px}
@media (max-width:760px){.picker{position:static;max-height:none}}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 12px 8px}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.chips.cls .chip[aria-pressed="true"]{background:var(--panel-2);color:var(--rare);border-color:var(--rare)}
.picker > *{flex:none}
.picker > .bases-wrap{flex:1 1 auto;min-height:120px}
.pickrow{display:flex;gap:6px;padding:10px 12px 0}
.pickrow select{flex:1 1 0;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:6px 8px;font-size:13px;font-weight:600;cursor:pointer}
.pickrow[hidden],.pickrow select[hidden]{display:none}
.ftabs{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between;padding:10px 12px 0}
.ftabs .fg{display:flex;align-items:center;gap:6px}
.ftabs .fl{font-size:12.5px;font-weight:600;color:var(--fg);white-space:nowrap}
.ftabs .fg.p .fl{color:var(--prefix)} .ftabs .fg.s .fl{color:var(--suffix)}
.ftabs .seg button{padding:4px 9px;font-size:12.5px}
.ftabs .seg button:disabled{opacity:.35;cursor:not-allowed}
.ftabs .xt{display:flex;gap:6px}
.ftabs .xt button{background:transparent;border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:12.5px;color:var(--muted);cursor:pointer}
.ftabs .xt button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg)}
.row.k,.row.i{grid-template-columns:4px minmax(0,1fr) auto}
.slot .l2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:3px}
.slot .l2 .meta{margin-top:0}
.slot .l2 .ctl{margin-top:0;flex:none}
.bkind{padding:10px 12px 8px}
.bkind .seg{display:flex;flex-wrap:nowrap}
.bkind .seg button{flex:1;white-space:nowrap;padding:6px 4px;min-width:0}
.bkind .seg .n{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);margin-left:4px}
.bases-wrap{overflow:auto;padding:0 8px 10px}
@media (max-width:760px){.bases-wrap{max-height:320px}}
.bsec{font-size:11px;letter-spacing:.06em;color:var(--faint);padding:10px 6px 6px;display:flex;justify-content:space-between}
.bases{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.base{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px 5px;border:1px solid transparent;border-radius:8px;background:transparent;cursor:pointer;text-align:center}
.base:hover{background:var(--panel-2)}
.base[aria-pressed="true"]{border-color:var(--rare);background:var(--panel-2)}
.base img{height:54px;width:auto;object-fit:contain}
.base span{font-size:11px;line-height:1.25;color:var(--muted)}
.base .lv{position:absolute;top:3px;right:4px;font-family:var(--f-mono);font-size:9.5px;color:var(--faint)}
.base[aria-pressed="true"] span{color:var(--fg)}
/* item card */
.card{padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px}
.item-head{display:flex;gap:14px;align-items:center}
.item-head img{max-height:120px;max-width:96px;object-fit:contain;flex:none}
.item-name{font-family:var(--f-display);font-size:20px;font-weight:700;color:var(--rare);line-height:1.25}
.item-sub{font-size:12px;color:var(--muted)}
.corr-badge{display:inline-block;color:var(--corrupt);font-size:12px;font-weight:600;margin-top:2px}
.props{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:1px;border-top:1px solid var(--line);padding-top:8px}
.props .imp{color:var(--prefix)}
.props .chg{color:#9a9aff;font-weight:600}
.props .el-Fire{color:#e8794a} .props .el-Cold{color:#6fb6e6} .props .el-Lightning{color:#e8d35a} .props .el-Chaos{color:#c06fd8}
.tt-prop b.chg{color:#8f8fff}
.tt-prop b.el-Fire{color:#e8794a} .tt-prop b.el-Cold{color:#6fb6e6} .tt-prop b.el-Lightning{color:#e8d35a} .tt-prop b.el-Chaos{color:#c06fd8}
.tt-dps{font-family:var(--f-mono);font-size:11.5px;color:#8a8a8a;margin-top:4px}
.rulenote{font-size:11.5px;color:var(--spec);margin-left:4px}
.sockbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.pips{display:inline-flex;gap:4px;vertical-align:-1px;margin-left:4px}
.pip{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--rune)}
.pip.extra{border-color:var(--corrupt)}
.toggle{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.toggle[aria-pressed="true"]{border-color:var(--corrupt);color:var(--corrupt)}
.slots{display:flex;flex-direction:column;gap:6px}
.slot-label{font-size:11px;letter-spacing:.08em;color:var(--faint);margin-top:4px}
.slot{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
.slot.p{--c:var(--prefix)} .slot.s{--c:var(--suffix)} .slot.f{--c:var(--spec)} .slot.k{--c:var(--rune)} .slot.c{--c:var(--corrupt)}
.slot .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--c);margin-top:6px;flex:none}
.slot.k .dot{border-radius:2px;transform:rotate(45deg)}
.slot.filled{border-style:solid;border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
.slot.filled .dot{background:var(--c)}
.slot.active{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
.slot .txt{flex:1;min-width:0;font-size:13px}
.slot .empty{color:var(--faint)}
.slot .meta{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.slot .x{flex:none;border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;border-radius:4px}
.slot .x:hover{color:var(--warn)}
.tag{display:inline-block;font-size:10.5px;padding:0 5px;border-radius:4px;border:1px solid currentColor;line-height:16px;margin-right:5px;vertical-align:1px;white-space:nowrap}
.tag.d{color:var(--des)} .tag.e{color:var(--ess)} .tag.x{color:var(--spec)} .tag.c{color:var(--corrupt)} .tag.u{color:var(--sac)} .tag.r{color:var(--rune)}
.corrbox{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px}
.corrbox.on{border-color:color-mix(in srgb,var(--corrupt) 50%,var(--line))}
.corrbox .head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.outs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.out{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 6px;font-size:12px;cursor:pointer;text-align:center;line-height:1.3;color:var(--muted)}
.out b{display:block;font-family:var(--f-mono);font-size:11px;color:var(--faint);font-weight:400}
.out[aria-pressed="true"]{border-color:var(--corrupt);color:var(--fg);background:color-mix(in srgb,var(--corrupt) 12%,var(--bg))}
.out:disabled{opacity:.35;cursor:not-allowed}
.mult{display:flex;align-items:center;gap:8px;margin-top:6px}
.mult input{flex:1;min-width:0;accent-color:var(--corrupt)}
.mult output{font-family:var(--f-mono);font-size:11.5px;color:var(--corrupt);min-width:40px;text-align:right}
.scaled{color:var(--corrupt)}
/* in-game style tooltip preview */
.viewbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tt-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.tt{--tt-bg:#0d0d10;--tt-edge:#6b5a33;--tt-gold:#c8a85a;--tt-label:#8a8a8a;--tt-val:#ece8df;--tt-mod:#8888ff;--tt-rune:#9fc3ff;--tt-corr:#d22c2c;--tt-name:#ffff77;--tt-head:#2a2416;
  width:100%;max-width:340px;background:var(--tt-bg);border:1px solid var(--tt-edge);box-shadow:0 0 0 1px #000,0 10px 30px rgba(0,0,0,.5);font-family:var(--f-body);text-align:center;color:var(--tt-val)}
.tt.normal{--tt-name:#d6d3cc;--tt-head:#26262a;--tt-edge:#55555b}
.tt.magic{--tt-name:#8f8fff;--tt-head:#1b1c33;--tt-edge:#3b3d77}
.tt-head{position:relative;padding:9px 14px 8px;background:linear-gradient(180deg,color-mix(in srgb,var(--tt-head) 100%,#000) 0%,#121212 100%);border-bottom:1px solid var(--tt-edge)}
.tt-head::before,.tt-head::after{content:"";position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--tt-edge) 12%,var(--tt-gold) 50%,var(--tt-edge) 88%,transparent)}
.tt-head::before{top:3px}.tt-head::after{bottom:3px}
.tt.normal .tt-head::before,.tt.normal .tt-head::after,.tt.magic .tt-head::before,.tt.magic .tt-head::after{background:linear-gradient(90deg,transparent,var(--tt-edge) 20%,var(--tt-edge) 80%,transparent)}
.tt-name{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.3;color:var(--tt-name)}
.tt-base{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--tt-name);opacity:.92}
/* item card header art (사용자 확정 2026-11-11) */
.tt-head{border-style:solid;border-width:0 46px;border-image:url(img/tt/rare.webp) 0 132 fill / 0 46px stretch;background:none;padding:10px 0 9px;min-height:44px;display:flex;flex-direction:column;justify-content:center;border-bottom:none}
.tt.magic .tt-head{border-image-source:url(img/tt/magic.webp)}
.tt.normal .tt-head{border-image-source:url(img/tt/normal.webp)}
.tt-head::before,.tt-head::after{display:none!important}
.tt-name,.tt-base{text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.7)}
.tt.magic{--tt-name:#a6a6ff}
.tt-excl{color:#d8b46a}

.tt-body{padding:12px 16px 14px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;line-height:1.55}
.tt-img{max-height:110px;max-width:120px;object-fit:contain;margin:2px 0 8px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.tt-cls{color:var(--tt-label);font-size:13px}
.tt-prop{color:var(--tt-label)} .tt-prop b{color:var(--tt-val);font-weight:500}
.tt-sep{width:86%;height:1px;margin:9px 0;background:linear-gradient(90deg,transparent,var(--tt-gold),transparent);opacity:.75}
.tt-sock{display:flex;gap:6px;justify-content:center;margin:6px 0 2px}
.tt-sock span{width:14px;height:14px;border-radius:50%;border:2px solid #6f6f78;background:#18181c}
.tt-sock span.on{border-color:var(--tt-rune);background:radial-gradient(circle,#c9dcff 0 25%,#3a4d80 70%)}
.tt-sock span.x{border-color:var(--tt-corr)}
.tt-mod{position:relative;width:100%;padding:1px 40px;color:var(--tt-mod);white-space:pre-line}
.tt-mod.rune{color:var(--tt-rune)}
.tt-mod.imp{color:var(--tt-mod)}
.tt-mod .tt-tier{position:absolute;left:4px;top:2px;font-family:var(--f-body);font-weight:600;font-size:10.5px;color:#6f6f78;white-space:nowrap}
.tt-tier.tp{color:#e88a7a} .tt-tier.ts{color:#7fa6ff} .tt-tier.tr{color:var(--tt-rune)} .tt-tier.tv{color:#e0605a}
.tt-mod.slot0{min-height:21px;opacity:.55}
.tt-mod.desm{color:#9be86a} .tt-mod.essm{color:#9fd8b0} .tt-mod.vaal{color:#e0605a}
.tt-cnt{display:flex;justify-content:center;gap:12px;font-family:var(--f-mono);font-size:11px;color:#6d6a62;margin-top:4px}
.tt-cnt .p{color:#e88a7a} .tt-cnt .s{color:#7fa6ff} .tt-cnt .r{color:var(--tt-rune)}
.tt-exc{font-size:11.5px;color:#d8b46a;margin-top:2px}
.rar.exc{color:#d8b46a}
.olegend{list-style:none;margin:0;padding:8px 10px;width:100%;max-width:340px;display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:8px}
.olegend li{display:flex;align-items:center;gap:6px}
.olegend i{width:9px;height:9px;border-radius:2px;flex:none}
.tt-mod.dim{color:#5c5c66;font-style:italic}
.tt-corr{color:var(--tt-corr);font-weight:600;margin-top:2px}
.tt-mod.fr{color:#c9b27a}
.slot .ctl{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.slot .ctl button,.slot .ctl select{font:inherit;font-size:11px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);cursor:pointer}
.slot .ctl select{border-radius:6px;padding:1px 4px}
.slot .ctl button[aria-pressed="true"]{color:var(--ink);background:var(--fg);border-color:var(--fg)}
.slot .ctl .fr[aria-pressed="true"]{background:#c9b27a;border-color:#c9b27a}
.slot .ctl .opt[aria-pressed="true"]{background:var(--panel-2);color:var(--muted);border-style:dashed}
.qrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.qrow input[type=number]{width:58px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:3px 6px;font-family:var(--f-mono)}
.qrow select{background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:3px 6px;font:inherit;font-size:12.5px;max-width:100%}
.improw{display:flex;align-items:center;gap:8px}
.improw input[type=range]{flex:1;min-width:0;max-width:140px;accent-color:var(--prefix)}
.rar{display:inline-block;font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
.rar.normal{color:#cfcac0} .rar.magic{color:#8f8fff} .rar.rare{color:var(--rare)}
details.sum{border-top:1px solid var(--line);padding-top:10px}
details.sum summary{cursor:pointer;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.sumlist{display:flex;flex-direction:column;gap:2px;margin-top:8px;font-size:12.5px}
.sumlist div{display:flex;justify-content:space-between;gap:10px}
.sumlist span:last-child{color:var(--faint);font-size:11px;white-space:nowrap}
.tt-sum{width:100%;max-width:340px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tt-sum h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600}
.reqopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.reqopts label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.reqopts input,.reqopts select{background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--fg);padding:7px 9px;font:inherit;font-size:13px}
.tt-tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.actions{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--rare);color:var(--ink);border-color:var(--rare);font-weight:600}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.summary{font-size:12px;color:var(--muted)}
/* pool */
.pool{display:flex;flex-direction:column}
.pool-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px 10px}
.pool-bar input[type=search]{flex:1;min-width:160px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:6px 9px;font:inherit}
.chk{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.pool-bar{padding-top:10px}
.hint{margin:0 14px 10px;font-size:12.5px;padding:8px 10px;border-radius:7px;background:var(--panel-2);color:var(--muted)}
.hint b{color:var(--fg);font-weight:600}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.sec-h{font-size:11px;letter-spacing:.08em;color:var(--faint);padding:10px 14px 4px;display:flex;justify-content:space-between;gap:8px}
.row{display:grid;grid-template-columns:4px auto minmax(0,1fr) auto;gap:10px;padding:8px 14px 8px 10px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);align-items:start}
.row .bar{align-self:stretch;border-radius:2px;background:var(--c)}
.row.p{--c:var(--prefix)} .row.s{--c:var(--suffix)} .row.k{--c:var(--rune)} .row.i{--c:var(--corrupt)}
.row.off{opacity:.38}
.row.ok:hover{background:color-mix(in srgb,var(--c) 7%,transparent)}
.row .main{min-width:0}
.row .pick{font:inherit;font-size:12px;min-width:46px;padding:4px 8px;border-radius:6px;border:1px solid var(--c);background:transparent;color:var(--fg);cursor:pointer;align-self:start}
.row .pick:hover:not(:disabled){background:color-mix(in srgb,var(--c) 18%,transparent)}
.row .pick.on{background:var(--c);color:var(--ink)}
.row .pick:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line)}
.row .tsel{font:inherit;font-size:11.5px;margin-top:5px;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;color:var(--fg);padding:1px 4px}
.row.on{background:color-mix(in srgb,var(--c) 9%,transparent)}
.slot.c{cursor:pointer}
.row .t{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-size:13.5px;color:var(--fg)}
.row.off .t{cursor:default}
.row .why{font-size:11px;color:var(--warn);margin-left:6px}
.bond-tg{align-self:flex-start;margin:3px 0 0;font:inherit;font-size:10.5px;line-height:1;padding:2px 6px;border-radius:3px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.bond-tg[aria-pressed="true"]{color:var(--fg);border-color:var(--accent)}
.row .sub{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.tiers{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tier{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);background:transparent;border-radius:4px;padding:1px 6px;cursor:pointer;color:var(--muted)}
.tier.word{font-family:var(--f-body)}
.tier:hover:not(:disabled){border-color:var(--c);color:var(--fg)}
.tier:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.tier.sel{background:var(--c);color:var(--ink);border-color:var(--c)}
.share{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.share small{display:block;font-size:10.5px;color:var(--faint);font-family:var(--f-body)}
.empty-state{padding:30px 16px;text-align:center;color:var(--muted)}
/* request */
.req{margin-top:16px;padding:16px;display:flex;gap:16px;flex-direction:column}
.req h3{margin:0;font-family:var(--f-display);font-size:18px}
.req textarea,.req input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--fg);padding:9px 10px;font-family:var(--f-mono);font-size:12px}
.req textarea{min-height:200px;resize:vertical}
.req .row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.req .row2 input{flex:1;min-width:200px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
footer{margin-top:24px;font-size:11.5px;color:var(--faint);line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.mts{display:inline-flex;flex-wrap:wrap;gap:3px;margin-left:6px;vertical-align:middle}
.mt{font-size:10.5px;line-height:1;padding:3px 5px;border-radius:4px;background:#34405a;color:#dfe5ee;font-weight:600;white-space:nowrap;font-style:normal}
.mt-damage{color:#ff7262}.mt-physical{color:#d2d2d2}.mt-elemental{color:#fff}.mt-fire{color:#ff9a6a}.mt-cold{color:#8fd0ff}.mt-lightning{color:#ffd84a}.mt-chaos{color:#d39bff}.mt-attack{color:#f2a86c}.mt-caster{color:#a9bcff}.mt-life{color:#ff8a8a}.mt-mana{color:#8ea8ff}.mt-minion{color:#b8e08a}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>POE2 옵션 빌더</h1>
      <p>베이스 선택 → 옵션 선택 → 리버스 크래프팅으로 보내기</p>
    </div>
    <div class="ctrls">
      <div class="seg" role="group" aria-label="게임 문구 언어">
        <button type="button" id="lang-kr" aria-pressed="true">한글</button>
        <button type="button" id="lang-en" aria-pressed="false">English</button>
      </div>
    </div>
  </header>

  <div class="grid">
    <section class="col picker" aria-label="베이스 아이템">
      <div class="pickrow"><select id="cats" aria-label="장비 부위"></select><select id="clss" aria-label="세부 종류"></select></div>
      <div class="bkind"><div class="seg" role="group" aria-label="베이스 구분" id="bkind"></div></div>
      <div class="bases-wrap" id="bases"></div>
    </section>

    <section class="col card" aria-label="아이템" id="card"></section>

    <section class="col pool" aria-label="옵션 목록">
      <div class="ftabs" id="ftabs" role="group" aria-label="옵션 분류"></div>
      <div class="pool-bar">
        <input type="search" id="q" placeholder="옵션 검색 (예: 생명력, 저항, 치명)">
        <label class="chk" for="onlyok"><input type="checkbox" id="onlyok"> 선택 가능한 것만</label>
      </div>
      <div class="list" id="list"><div class="empty-state">불러오는 중…</div></div>
    </section>
  </div>

  <section class="col req" id="req" aria-label="레시피 요청">
    <div id="req-body" hidden>
      <h3>레시피 요청</h3>
      <div class="summary" style="margin:8px 0 12px">복사해서 커뮤니티에 올리기</div>
      <div class="reqopts" style="margin-bottom:10px">
        <label for="budget">예산<input id="budget" type="number" min="0" step="0.5" placeholder="예: 30"></label>
        <label for="budget-unit">단위<select id="budget-unit"><option>디바인</option><option>엑잘티드</option><option>카오스</option></select></label>
        <label for="league">리그<select id="league"><option>현재 리그 (소프트코어)</option><option>현재 리그 (하드코어)</option><option>스탠다드</option><option>하드코어 스탠다드</option></select></label>
        <label for="league-name">리그 이름 (선택)<input id="league-name" placeholder="예: 1.0 출시 리그"></label>
      </div>
      <textarea id="req-text" readonly aria-label="요청 내용"></textarea>
      <div class="row2" style="margin-top:10px">
        <button type="button" class="btn primary" id="copy-req">요청 내용 복사</button>
        <button type="button" class="btn" id="copy-code">공유 코드만 복사</button>
      </div>
    </div>
    <div>
      <div class="summary" style="margin-bottom:6px">공유 코드로 불러오기</div>
      <div class="row2">
        <input id="code-in" placeholder="공유 코드 붙여넣기 (P2B로 시작)" aria-label="공유 코드 입력">
        <button type="button" class="btn" id="load-code">불러오기</button>
      </div>
    </div>
  </section>

  <footer>
    비공식 팬 제작 도구 · Grinding Gear Games와 무관
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
// corr: 0 none · -1 corrupted, outcome not picked yet · 1 implicit added · 2 extra rune socket · 3 affix values rerolled (78–122%)
const S = { ilvlBy:{}, infused:false, quality:20, catalyst:'', imp:[], meta:null, sac:false, sumOpen:false, roll:'avg', view:'edit', showTier:true, nameSeed:0, lang:((()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q)return q;return localStorage.getItem('poe2lang')}catch(e){return null}})()||'en'), index:null, cat:null, cls:null, data:null, base:0, bkind:'normal', ilvl:82, corr:0, exc:'',
  slots:null, mult:null, active:{g:'k',i:0}, top:'affix', sub:{affix:'all', rune:'all', corrupt:'c'}, q:'', onlyok:false, pick:{}, side:'p' };
const cache = {};
const LB = () => S.lang==='kr' ? 1 : 0;           // base data stores [english, korean]
const KR = () => S.lang==='kr';
// mod tags beside each modifier, like poe2db (사용자 2026-11-11)
const MTAG=[['damage','피해','Damage'],['physical','물리','Physical'],['elemental','원소','Elemental'],['fire','화염','Fire'],['cold','냉기','Cold'],['lightning','번개','Lightning'],['chaos','카오스','Chaos'],['attack','공격','Attack'],['caster','주문','Caster'],['minion','소환수','Minion'],['speed','속도','Speed'],['critical','치명타','Critical'],['life','생명력','Life'],['mana','마나','Mana'],['defences','방어','Defences'],['resistance','저항','Resistance'],['attribute','능력치','Attribute'],['ailment','상태 이상','Ailment'],['bleed','출혈','Bleed'],['poison','중독','Poison'],['curse','저주','Curse'],['aura','오라','Aura'],['gem','젬','Gem'],['block','막기','Block'],['drop','희귀도','Rarity'],['flask','플라스크','Flask'],['charm','부적','Charm']];
const mtags = g => { const s=new Set(g.tg||[]), h=MTAG.filter(x=>s.has(x[0])).map(([k,kr,en])=>`<span class="mt mt-${k}">${KR()?kr:en}</span>`).join(''); return h?`<span class="mts">${h}</span>`:''; };

const GEN_KR = {p:'접두', s:'접미', k:'룬 소켓', c:'타락 고정 옵션'};
const TOP = [['affix','접두·접미 옵션','var(--rare)'],['rune','룬(증강물)','var(--rune)'],['corrupt','타락','var(--corrupt)']];
const SUB = {
  affix:[['all','전체'],['n','일반'],['d','훼손'],['e','에센스'],['x','특수옵션']],
  rune:[['all','전체'],['rune','룬'],['core','영혼 핵'],['idol','우상'],['etc','기타']],
  corrupt:[['c','타락 고정 옵션'],['u','희생 (강화)']] };
// rare items: Vaal Orb outcomes (value 78–122% rescaling is unique-only, so it is not offered here)
const CORR = [[1,'고정 옵션 추가','①'],[2,'룬 소켓 +1','②'],[3,'옵션 1~3개 변경','③'],[4,'변화 없음','④']];
const ORDER = ['p','s','f','k','c'];  // auto-advance order: prefix → suffix → extra crafted → rune sockets → corruption implicit (layout stays runes+corruption on top)

function esc(t){return String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const nl = t => esc(t).replace(/\n/g,'<br>');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800)}
// mod tier: [ilvl, weight, nameKr, nameEn, textKr, textEn] · rune tier: [nameKr, nameEn, textKr, textEn, bondKr, bondEn]
const tName = t => KR() ? t[2] : t[3];
const tText = t => KR() ? t[4] : t[5];
const rName = t => KR() ? t[0] : t[1];
const rText = t => KR() ? t[2] : t[3];
const rBond = t => KR() ? t[4] : t[5];
const subLabel = g => KR() ? g.sub[0] : g.sub[1];
const runeKind = r => /SoulCore/i.test(r.f) ? 'core' : /Idol/i.test(r.f) ? 'idol' : /Rune/i.test(r.f) ? 'rune' : 'etc';
// scale every number in a mod line (used for the 78–122% corruption outcome)
function scaleText(t, m){
  if(m===100) return t;
  return t.replace(/\d+(\.\d+)?/g, x=>{ const d=(x.split('.')[1]||'').length; const v=parseFloat(x)*m/100; return d ? v.toFixed(d) : String(Math.round(v)); });
}

const curBase = () => S.data.bases[S.base];
const baseSockets = () => curBase()?.sock || 0;
const runesList = () => curBase()?.rk ? S.data.runesBy[curBase().rk] : S.data.runes;
// rules that socketed runes change: extra prefix/suffix, extra crafted modifier, unlocking special modifier families
function runeFx(){
  const o = {p:0, s:0, craft:0, names:new Set()};
  S.slots.k.slice(0,sockets()).forEach(v=>{ if(!v) return; const t=runesList()[v.ri]?.t[v.ti]; if(!t) return; o.names.add(t[1]);
    for(const m of t[3].matchAll(/([+-]\d+) (Prefix|Suffix) Modifiers? allowed/g)) o[m[2]==='Prefix'?'p':'s'] += +m[1];
    const c = t[3].match(/Can have (\d+) additional Crafted Modifiers?/); if(c) o.craft += +c[1]; });
  return o;
}
const gateNames = () => new Set(runesList().flatMap(r=>r.t.map(t=>t[1])));
const gated = g => g.s==='x' && gateNames().has(g.sub[1]) && !runeFx().names.has(g.sub[1]);
const maxOf = g => { if(g==='k') return sockets(); if(g==='c') return S.corr===1 ? 1 : 0; const fx=runeFx();
  return g==='p' ? Math.max(0,3+curBase().pd+fx.p) : g==='s' ? Math.max(0,3+curBase().sd+fx.s) : 0; };   // extra crafted modifiers raise a limit instead of adding slots
const KIND = {rune:['룬벼림·룬숙련','Runeforged / Runemastered'], mod:['접두·접미 개수 변경','Modifier count'], breach:['균열','Breach'], unique:['고유 전용·스킬 생성','Unique-only / skill']};
// exceptional base = one more rune socket (사용자 확정 2026-11-11: quality is not an exceptional option)
const excSock = () => S.exc==='sock' && baseSockets() ? 1 : 0;
const sockets = () => baseSockets() + excSock() + (S.corr===2 && baseSockets() ? 1 : 0);
function emptySlots(){ return {p:Array(7).fill(null), s:Array(7).fill(null), f:[null,null,null], k:[null,null,null,null], c:[null]}; }
function emptyMeta(){ const m=()=>({fr:false,need:true,tmin:null}); return {p:Array.from({length:7},m), s:Array.from({length:7},m), f:Array.from({length:3},m)}; }
function emptyMult(){ return {p:Array(7).fill(100), s:Array(7).fill(100), f:[100,100,100]}; }
function topFor(g){ return g==='k' ? 'rune' : g==='c' ? 'corrupt' : 'affix'; }
function setActive(g,i){ S.active={g,i}; S.top=topFor(g); if(g==='c') S.sub.corrupt = S.sub.corrupt||'c'; if(g==='f') S.sub.affix='etc'; }
const SLOT_KR = g => g==='f' ? '추가 제작 옵션' : GEN_KR[g];
function firstEmpty(){
  for(const g of ORDER){ const n = maxOf(g); const i = S.slots[g].slice(0,n).findIndex(v=>!v); if(i>=0) return {g,i}; }
  return null;
}

// ---------- loading ----------
async function loadIndex(){
  S.index = await fetch('data/index.json').then(r=>r.json());
  await loadClass('Rings');
}
function catOf(cid){ return S.index.groups.find(g=>g.classes.some(c=>c.id===cid)); }
async function loadClass(id, keep){
  $('#list').innerHTML = '<div class="empty-state">불러오는 중…</div>';
  if(!cache[id]) cache[id] = await fetch(`data/c/${encodeURIComponent(id)}.json`).then(r=>r.json());
  S.cls = id; S.data = cache[id]; S.cat = catOf(id).id;
  if(!keep){ S.bkind='normal'; resetItem(firstBase()); }
  renderCats(); renderBases(); render();
}
function resetItem(base){
  S.pick = {};
  if(base!=null) S.base = base;
  S.ilvl = S.ilvlBy[S.cls+'/'+S.base] ?? maxModLvl(); S.infused = false; S.quality = 20;
  S.slots = emptySlots(); S.mult = emptyMult(); S.meta = emptyMeta(); S.corr = 0; S.exc = ''; S.skill = 0; S.sac = false; S.imp = []; S.catalyst = ''; S.sub.affix = 'all';
  syncIlvl();
  const f = firstEmpty(); setActive(f.g, f.i);
}
function orderedBases(){
  const b = S.data.bases.map((x,i)=>({...x,i}));
  const by = (a,c)=> c.lv-a.lv || a.i-c.i;
  return { normal:b.filter(x=>!x.sp).sort(by), special:b.filter(x=>x.sp).sort(by) };
}
function firstBase(){ const o=orderedBases(); return (o.normal[0]||o.special[0]).i; }

// ---------- picker ----------
function renderCats(){
  $('#cats').innerHTML = S.index.groups.map(g=>`<option value="${g.id}" ${g.id===S.cat?'selected':''}>${esc(g.kr)}</option>`).join('');
  const g = S.index.groups.find(x=>x.id===S.cat);
  $('#clss').hidden = g.classes.length<2;
  $('#clss').innerHTML = g.classes.map(c=>`<option value="${c.id}" ${c.id===S.cls?'selected':''}>${esc(KR()?c.short:c.en.replace(/^.*\((.*)\)$/,'$1'))}</option>`).join('');
}
function renderBases(){
  const o = orderedBases();
  if(!o.special.length) S.bkind='normal';
  $('#bkind').innerHTML = `<button type="button" data-k="normal" aria-pressed="${S.bkind==='normal'}">일반 베이스<span class="n">${o.normal.length}</span></button>` +
    `<button type="button" data-k="special" aria-pressed="${S.bkind==='special'}" ${o.special.length?'':'disabled'}>특수 베이스<span class="n">${o.special.length}</span></button>`;
  const card = x => `<button type="button" class="base" data-i="${x.i}" aria-pressed="${x.i===S.base}">${x.lv?`<span class="lv">${x.lv}</span>`:''}
    ${x.img?`<img src="${x.img}" alt="" loading="lazy">`:''}<span>${esc(KR()?x.kr:x.en)}</span></button>`;
  if(S.bkind==='normal'){
    $('#bases').innerHTML = `<div class="bsec"><span>요구 레벨 높은 순</span></div><div class="bases">${o.normal.map(card).join('')}</div>`;
  } else {
    $('#bases').innerHTML = Object.keys(KIND).map(k=>{ const xs=o.special.filter(x=>x.sp===k); return xs.length?`<div class="bsec"><span>${KIND[k][KR()?0:1]} · ${xs.length}</span></div><div class="bases">${xs.map(card).join('')}</div>`:''; }).join('');
  }
}
function selectBase(i){
  const prevRk = curBase().rk; S.ilvlBy[baseKey()] = S.ilvl; S.base = i; S.ilvl = S.ilvlBy[baseKey()] ?? maxModLvl(); syncIlvl();
  if(curBase().rk!==prevRk) S.slots.k=[null,null,null,null];
  if(S.corr===2 && !baseSockets()) S.corr=-1;
  if(!baseSockets()) S.exc='';
  S.skill = 0; S.imp = [];
  trimSockets();
  if(S.active.i>=maxOf(S.active.g)) goNext();
  if(S.active.i>=maxOf(S.active.g)) setActive('p',0);
  renderBases(); render();
}

// ---------- rules ----------
function usedFamilies(except){
  const f = new Set();
  for(const g of ['p','s','f']) S.slots[g].slice(0,maxOf(g)).forEach((v,i)=>{ if(!v || (except && except.g===g && except.i===i)) return; S.data.groups[v.gi].f.forEach(x=>f.add(x)); });
  return f;
}
// slots fill top to bottom: a new option goes to the first empty slot of its side (사용자 확정 2026-11-11)
function targetFor(g){
  const i=S.slots[g.g]?.slice(0,maxOf(g.g)).findIndex(v=>!v); if(i>=0) return {g:g.g,i};
  if(g.s==='x' && maxOf('f')){ const j=S.slots.f.slice(0,maxOf('f')).findIndex(v=>!v); if(j>=0) return {g:'f',i:j}; }
  return null;
}
function findSel(gi){ for(const g of ['p','s','f']){ const i=S.slots[g].findIndex(v=>v&&v.gi===gi); if(i>=0) return {g,i}; } return null; }
function reason(gi, ti){
  const g = S.data.groups[gi];
  if(g.g==='i') return '';
  if(gated(g)) return `${subLabel(g)} 룬 필요`;
  if(g.cr && craftedCount() >= craftedLimit()) return `제작 옵션 한도 ${craftedLimit()}개`;
  const tgt = targetFor(g);
  if(!tgt) return `${GEN_KR[g.g]} 자리 없음`;
  const used = usedFamilies(tgt);
  if(g.f.some(x=>used.has(x))) return '같은 계열 옵션 있음';
  if(ti!=null){ if(g.t[ti][0] > S.ilvl) return `아이템 레벨 ${g.t[ti][0]} 필요`; }
  else if(!g.t.some(t=>t[0]<=S.ilvl)) return `아이템 레벨 ${Math.min(...g.t.map(t=>t[0]))} 필요`;
  return '';
}
function bestTier(gi){ const g=S.data.groups[gi]; const i=g.t.findIndex(t=>t[0]<=S.ilvl); return i<0?null:i; }
function shares(){
  const tot={p:0,s:0}, per=[];
  S.data.groups.forEach((g,i)=>{ let w=0; if(g.s==='n') g.t.forEach(t=>{ if(t[0]<=S.ilvl) w+=t[1]; }); per[i]=w; if(g.g in tot) tot[g.g]+=w; });

function calcStats(){

function normalize(){
  let dropped = 0;
  for(const g of ['p','s','f']){
    S.slots[g].forEach((v,i)=>{ if(!v) return; const grp=S.data.groups[v.gi];
      if(i>=maxOf(g) || gated(grp)){ S.slots[g][i]=null; S.mult[g][i]=100; dropped++; return; }
      if(grp.t[v.ti][0] > S.ilvl){ const j = grp.t.findIndex((t,k)=>k>v.ti && t[0]<=S.ilvl); if(j<0){ S.slots[g][i]=null; dropped++; } else { v.ti=j; if(S.meta[g][i].tmin!=null && S.meta[g][i].tmin<j) S.meta[g][i].tmin=j; } } });
  }
  for(const g of ['p','s','f','k']) compact(g);
  if(S.quality > maxQuality()) S.quality = maxQuality();
  if(S.catalyst && !curCatalyst()) S.catalyst = '';
  if(S.sac && !(S.corr===1 && S.slots.c[0] && S.data.groups[S.slots.c[0].gi].s==='u')) S.sac = false;
  if(S.active.i>=maxOf(S.active.g)){ const f=firstEmpty(); f ? setActive(f.g,f.i) : setActive('p',0); }
  if(dropped) toast(`조건 변경으로 옵션 ${dropped}개 제외`);
}
function render(){ normalize(); renderCard(); renderTabs(); renderPool(); }

function subCount(top, code){
  const G = S.data.groups;
  if(top==='affix') return code==='all' ? G.filter(g=>g.g!=='i').length : G.filter(g=>g.s===code).length;
  if(top==='rune') return code==='all' ? runesList().length : runesList().filter(r=>runeKind(r)===code).length;
  return G.filter(g=>g.s===code).length;
}

function renderPool(){
  if(S.top==='rune' && !baseSockets()) S.top='affix';

  if(S.top==='corrupt'){ const h=renderCorrupt('c')+renderCorrupt('u'); $('#list').innerHTML = h || '<div class="empty-state">이 아이템에는 타락 옵션 없음</div>'; return; }
  const sub = S.sub.affix, sh = shares();
  const rows = {p:[], s:[]};

    if(!subOk(g,sub)) return;
    if(!g.t.some(t=>matchQ(t[2],t[3],t[4],t[5]))) return;
    if(!g.t.some(t=>t[0]<=S.ilvl)) return;                 // no tier can roll at this item level
    const at = findSel(gi), on = !!at;
    const ti = on ? S.slots[at.g][at.i].ti : pickTier(gi);
    const why = on ? '' : reason(gi, ti); if(S.onlyok && why) return;
    const shown = g.t[ti ?? g.t.length-1];

    const share = g.s==='n' && ti!=null ? `${pctTxt(tierShare(gi,ti))}<small>${tierLbl(g,ti)}</small>` : `<small>아이템 레벨 ${Math.min(...g.t.map(t=>t[0]))}+</small>`;
    rows[g.g].push({w: g.s==='n'?sh[gi]:-1-(g.t[0][0]/1000), html:`<div class="row ${g.g} ${why?'off':'ok'} ${on?'on':''}"><span class="bar"></span>

      ${tsel?`<div>${tsel}</div>`:''}</div><div class="share">${share}</div></div>`});
  });

  $('#list').innerHTML = html || '<div class="empty-state">조건에 맞는 옵션 없음</div>';
}

function renderRunes(){

      <div class="tiers">${chips}</div></div><div class="share"></div></div>`;

// ---------- request / share code ----------
function code(){
  const st = {c:S.cls, b:S.base, l:S.ilvl, x:S.corr,
    p:S.slots.p.map(v=>v?[v.gi,v.ti]:0), s:S.slots.s.map(v=>v?[v.gi,v.ti]:0),
    k:S.slots.k.map(v=>v?[v.ri,v.ti]:0), i:S.slots.c[0]?[S.slots.c[0].gi,S.slots.c[0].ti]:0,
    f:S.slots.f.map(v=>v?[v.gi,v.ti]:0), m:0,
    q:S.quality, e:S.exc||0, sk:S.skill||0, inf:S.infused?1:0, ct:S.catalyst, im:S.imp, sc:S.sac?1:0,
    mt:['p','s'].map(g=>S.meta[g].map(x=>[x.fr?1:0,x.need?1:0,x.tmin??-1]))};
  return 'P2B' + btoa(unescape(encodeURIComponent(JSON.stringify(st))));
}
// built item → game-style item text (advanced copy headers) for the reverse-crafting tab (사용자 2026-11-11)
function gameText(){
  const b=S.data.bases[S.base], out=[`Item Class: ${S.data.en}`, `Rarity: ${({normal:'Normal',magic:'Magic',rare:'Rare'})[rarity()]}`];
  if(rarity()==='rare') out.push('Built Item');
  out.push((S.exc?'Exceptional ':'')+b.en, '--------', `Item Level: ${S.ilvl}`, '--------');
  implicits(0).forEach((x,ii)=>out.push(rollAt(x,S.imp[ii])+' (implicit)'));
  for(const g of ['p','s']) S.slots[g].slice(0,maxOf(g)).forEach((v,i)=>{ if(!v) return; const grp=S.data.groups[v.gi], t=grp.t[v.ti], mt=S.meta[g][i]||{};
    const kind=[mt.fr?'Fractured':'', grp.s==='d'?'Desecrated':''].filter(Boolean).join(' ');
    out.push(`{ ${kind?kind+' ':''}${g==='p'?'Prefix':'Suffix'} Modifier "${t[3]||''}" (Tier: ${v.ti+1}) }`);
    rolled(scaleText(t[5], modPct(g,i,grp))).split('\n').forEach(l=>out.push(l)); });
  return out.join('\n');
}
function requestText(){
  const b = S.data.bases[S.base], n = sockets();
  const corrName = {'-1':' · 타락(결과 미정)', 0:'', 1:' · 타락(① 고정 옵션 추가)', 2:' · 타락(② 룬 소켓 +1)', 3:' · 타락(③ 옵션 1~3개 변경)', 4:' · 타락(④ 변화 없음)'}[S.corr];
  const line = (g,v,i) => { if(!v) return `- ${SLOT_KR(g)} ${i+1}: (상관없음)`; const grp=S.data.groups[v.gi], t=grp.t[v.ti], m=g==='f'?100:S.mult[g][i];
    const mt = S.meta[g][i];
    const tl = grp.s==='n' ? (!v.ti ? 'T1' : v.ti===lowTier(grp) ? '모든 티어' : `T${v.ti+1} 이상`) : `${grp.sub[0]}: ${t[2]}`;
    const txt = t[4];
    return `- ${SLOT_KR(g)} ${i+1}: ${txt.replace(/\n/g,' / ')} [${tl}] ${mt.need?'(필수 옵션)':'(유효 옵션)'}${mt.fr?' (분열)':''}`; };
  const cat = curCatalyst(), qk = qualityKind();
  const bud = $('#budget').value ? `${$('#budget').value} ${$('#budget-unit').value}` : '미정';
  const out = [`[레시피 요청] ${b.kr} (${b.en})`, `종류: ${S.data.kr} · 아이템 레벨 ${S.ilvl} · 등급: ${{normal:'일반',magic:'마법',rare:'희귀'}[rarity()]}${corrName}`,
    ...(S.exc?['특출난 베이스: 룬 소켓 +1']:[]),
    `${qk?`퀄리티: ${S.quality}%${cat?` (${cat.kr})`:''}${S.infused&&infuser()?` · ${infuser()[0]} 사용`:''} · `:''}요구 레벨: ${reqLevel()}`,
    `예산: ${bud} · 리그: ${$('#league').value}${$('#league-name').value?` (${$('#league-name').value})`:''}`, ''];
  const impK = implicits(1); if(impK.length) out.push(...impK.map((x,ii)=>`- 고정 옵션: ${rollAt(x,S.imp[ii])}${qualityKind()==='caster'&&S.quality>0&&/^스킬 부여/.test(x)?` (스킬 퀄리티 +${S.quality}%)`:''}`));
  for(let i=0;i<n;i++){ const v=S.slots.k[i]; out.push(`- 룬 소켓 ${i+1}${i>=baseSockets()+excSock()?' (타락)':i>=baseSockets()?' (특출난)':''}: ${v ? runesList()[v.ri].t[v.ti][0] + ' (' + runesList()[v.ri].t[v.ti][2].replace(/\n/g,' / ') + ')' : '(상관없음)'}`); }
  out.push(...S.slots.p.slice(0,maxOf('p')).map((v,i)=>line('p',v,i)), ...S.slots.s.slice(0,maxOf('s')).map((v,i)=>line('s',v,i)), ...S.slots.f.slice(0,maxOf('f')).map((v,i)=>line('f',v,i)));
  if(S.corr===1){ const v=S.slots.c[0]; out.push(`- 타락 고정 옵션: ${v ? S.data.groups[v.gi].t[v.ti][4].replace(/\n/g,' / ')+` [${S.data.groups[v.gi].sub[0]}]` : '(상관없음)'}`); }
  if(S.sac) out.push(`- ${SAC_ORB()[0]} 사용: 타락 고정 옵션 강화 + 무작위 옵션 1개 제거 (위 목록은 제거 후 남길 옵션 기준)`);
  out.push('', '이 조합을 만드는 순서(커런시·징조·에센스)와 예상 비용 문의', '', `공유 코드: ${code()}`);
  return out.join('\n');
}
async function loadCode(str){
  try{
    const st = JSON.parse(decodeURIComponent(escape(atob(str.trim().replace(/^P2B/,'')))));
    S.ilvl = st.l;
    await loadClass(st.c);
    S.base = st.b; S.ilvl = st.l; S.ilvlBy[baseKey()] = st.l; S.corr = typeof st.x==='number' ? st.x : (st.x?1:0);
    const pad = (a,n=7) => [...a, ...Array(Math.max(0,n-a.length)).fill(0)];
    S.slots = { p:pad(st.p).map(v=>v?{gi:v[0],ti:v[1]}:null), s:pad(st.s).map(v=>v?{gi:v[0],ti:v[1]}:null),
      f:pad(st.f||[],3).map(v=>v?{gi:v[0],ti:v[1]}:null), k:pad(st.k||[],4).map(v=>v?{ri:v[0],ti:v[1]}:null), c:[st.i?{gi:st.i[0],ti:st.i[1]}:null] };
    const h = st.m ? st.m.length/2 : 0;
    S.mult = st.m ? {p:pad(st.m.slice(0,h)).map(x=>x||100), s:pad(st.m.slice(h)).map(x=>x||100), f:[100,100,100]} : emptyMult();
    S.bkind = curBase().sp ? 'special' : 'normal';
    S.meta = emptyMeta(); if(st.mt) ['p','s'].forEach((g,gi)=>st.mt[gi].forEach((x,i)=>{ if(S.meta[g][i]){ S.meta[g][i]={fr:!!x[0],need:!!x[1],tmin:null}; if(x[2]>=0 && S.slots[g][i]) S.slots[g][i].ti=x[2]; } }));
    S.exc = st.e==='sock' ? 'sock' : ''; S.skill = st.sk||0; S.infused = !!st.inf; S.quality = st.q ?? 20; S.catalyst = st.ct || ''; S.imp = st.im || []; S.sac = !!st.sc; syncIlvl();
    const f = firstEmpty(); if(f) setActive(f.g,f.i); else setActive('p',0);
    renderBases(); render(); toast('조합 불러옴');
  }catch(e){ console.error(e); toast('코드 읽기 실패 · 전체를 정확히 붙여 넣었는지 확인'); }
}
async function copy(text, el){
  try{ await navigator.clipboard.writeText(text); toast('복사됨'); }
  catch(e){ if(el){ el.focus(); el.select(); } toast('자동 복사 막힘 · 선택된 내용을 직접 복사'); }
}

function onCard(e){
  if(e.target.closest('select, input, summary, details')){ if(e.target.closest('summary')) setTimeout(()=>{ S.sumOpen=$('#sum')?.open; },0); return; }
  const nd = e.target.closest('[data-need]'); if(nd){ const g=nd.dataset.need[0], i=+nd.dataset.need.slice(1); S.meta[g][i].need=!S.meta[g][i].need; renderCard(); return; }
  const fr = e.target.closest('[data-fr]'); if(fr){ const g=fr.dataset.fr[0], i=+fr.dataset.fr.slice(1); const on=!S.meta[g][i].fr;
    for(const x of ['p','s','f']) S.meta[x].forEach(mm=>mm.fr=false); S.meta[g][i].fr=on; if(on) toast('분열 옵션은 아이템당 1개만 표시됨'); renderCard(); return; }
  const vb = e.target.closest('[data-view]'); if(vb){ S.view = vb.dataset.view; renderCard(); return; }
  const rb = e.target.closest('[data-roll]'); if(rb){ S.roll = rb.dataset.roll; renderCard(); return; }
  if(e.target.id==='reroll-name'){ S.nameSeed++; renderCard(); return; }
  if(e.target.id==='toggle-tier'){ S.showTier=!S.showTier; renderCard(); return; }
  if(e.target.closest('.mult')) return;                     // slider: handled by input event
  const x = e.target.closest('[data-clear]');

  if(e.target.closest('#corrupt')){ setCorr(S.corr ? 0 : -1); if(S.corr) toast('타락 결과 ①②③④ 중 하나 선택'); return; }
  const o = e.target.closest('[data-corr]'); if(o){ if(!o.disabled) setCorr(+o.dataset.corr); return; }
  const s = e.target.closest('.slot[data-g="c"]');

  if(e.target.id==='make-req'){ $('#req-text').value = requestText(); $('#req-body').hidden=false; $('#req').scrollIntoView({behavior:'smooth',block:'start'}); }
}

$('#card').addEventListener('change', e=>{

  if(e.target.id==='exc'){ S.exc=e.target.value; trimSockets(); render(); return; }
  if(e.target.id==='qual'){ S.quality=Math.max(0,Math.min(maxQuality(),+e.target.value||0)); render(); return; }

  const keys = Object.keys(D).sort((a,b)=>b.length-a.length);
  const re = new RegExp(keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
  const HAN = /[가-힣]/, ATTRS = ['placeholder','aria-label','title'];
  const origText = new Map(), origAttr = new Map();
  let lang = ((()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q)return q;return localStorage.getItem('poe2lang')}catch(e){return null}})()||'en');
  const tr = s => s.replace(re, m => D[m]);
  const skip = el => !el || el.closest('script,style,textarea,.keep-lang');
  function walk(root){
    if(lang!=='en' || !root) return;
    if(root.nodeType===3){ fix(root); return; }
    if(root.nodeType!==1) return;
    const tw=document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
    while((n=tw.nextNode())) fix(n);
    [root, ...root.querySelectorAll('[placeholder],[aria-label],[title]')].forEach(el=>{ if(!el.getAttribute || skip(el)) return;
      ATTRS.forEach(a=>{ const v=el.getAttribute(a); if(v && HAN.test(v)){ const t=tr(v); if(t===v) return; const o=origAttr.get(el)||{}; if(!(a in o)) o[a]=v; origAttr.set(el,o); el.setAttribute(a, t); } }); });
  }
  function fix(n){ const v=n.nodeValue; if(!HAN.test(v) || skip(n.parentElement)) return; const t=tr(v); if(t===v) return; if(!origText.has(n)) origText.set(n, v); n.nodeValue = t; }

  new MutationObserver(ms=>{ if(lang!=='en') return; for(const m of ms){ if(m.type==='characterData') fix(m.target); else m.addedNodes.forEach(walk); } })
    .observe(document.documentElement, {subtree:true, childList:true, characterData:true});
  function setLang(l){ lang=l; document.documentElement.lang = l==='en'?'en':'ko'; if(l==='en') walk(document.body); else restore(); }

  setLang(lang);
})();
