<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:dark}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>POE2 크래프팅 에뮬레이터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<script>try{if(window.self!==window.top)document.documentElement.classList.add('embed')}catch(e){document.documentElement.classList.add('embed')}</script>
<style>
.embed header.top{display:none}
.embed footer{display:none}
.embed header.top{justify-content:flex-end;margin-bottom:10px}
.embed .wrap{padding-block:12px 32px}
.embed .picker{max-height:calc(100vh - 80px)}

/* Layout: crafting bench — base picker | live item + controls | currency bench + history/odds. Same visual system as the option builder. */
:root{
  --bg:#13151a; --panel:#1b1e25; --panel-2:#22262f; --line:#2e333e; --fg:#e8e3d8; --muted:#959ba6; --faint:#6b717c;
  --prefix:#78b8cf; --suffix:#d9a65e; --des:#b994e6; --ess:#82c99c; --corrupt:#e0605a; --rare:#ead77f; --warn:#e3806f; --ok:#8fcf9a; --focus:#f2e6c4; --ink:#14161a;
  --f-display:"Gowun Batang", "Apple SD Gothic Neo", serif;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 40px;max-width:1560px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:16px}
header.top h1{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0}
header.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 10px;cursor:pointer;color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg)}
.grid{display:grid;grid-template-columns:minmax(340px,430px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
/* base picker = slide-in drawer; closes itself once a base is picked */
.picker.drawer{position:fixed;z-index:30;top:0;bottom:0;left:0;width:min(340px,92vw);max-height:none;border-radius:0 10px 10px 0;transform:translateX(-102%);transition:transform .18s ease;box-shadow:8px 0 30px rgba(0,0,0,.5);padding-left:env(safe-area-inset-left,0px)}
.picker.drawer.open{transform:none}
.drawer-bg{position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.45)}
.drawer-head{display:flex;gap:8px;padding:12px 12px 6px}
.drawer-head input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:6px 9px;font:inherit;font-size:13px}
.bsearch{padding:4px 8px 10px;overflow:auto;flex:1 1 auto;min-height:0}
.bsearch button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:0;border-radius:6px;padding:5px 6px;cursor:pointer;color:var(--fg);font-size:13px}
.bsearch button:hover{background:var(--panel-2)}
.bsearch img{width:30px;height:30px;object-fit:contain}
.bsearch small{color:var(--faint);margin-left:auto;font-size:11px;white-space:nowrap}
.basebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.basechip{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px 6px 6px;cursor:pointer;text-align:left;color:var(--fg)}
.basechip:hover{border-color:var(--muted)}
.bthumb{width:36px;height:36px;flex:none;display:grid;place-items:center}
.bthumb img{max-width:36px;max-height:36px;object-fit:contain}
.bmeta{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.bmeta b{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bmeta small{color:var(--faint);font-size:11.5px}
.bchg{margin-left:auto;font-size:12px;color:var(--rare);white-space:nowrap}
.bnums{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.bnums label{white-space:nowrap}
.bnums .bn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.bnums{column-gap:12px;flex-wrap:wrap;width:100%}
.bnums #exc{max-width:110px}
.bnums #skillbn{flex-basis:100%}
.bnums #skillbn[hidden]{display:none}
.bnums #skill{flex:1;min-width:0}
.bnums select{background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:4px 6px;font-size:12px}
.bnums input{width:48px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:4px 6px;font-family:var(--f-mono);font-size:12.5px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.tbtn{background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 11px;font-size:12.5px;color:var(--muted);cursor:pointer}
.tbtn:hover:not(:disabled){color:var(--fg);border-color:var(--muted)}
.tbtn:disabled{opacity:.35;cursor:not-allowed}
#omenbar:empty{display:none}
#omenbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.ochip{display:inline-flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--ok) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--ok) 45%,var(--line));border-radius:999px;padding:2px 8px 2px 3px;color:var(--fg);cursor:pointer;font-size:12px}
.ochip img{width:20px;height:20px}
.ochip::after{content:"×";color:var(--muted);margin-left:2px}
.info{border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden}
.info .panes{padding:0 8px}
.info .pane{max-height:640px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.col h2{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted);margin:0;padding:12px 14px 8px}
/* picker (same as builder) */
.picker{display:flex;flex-direction:column;max-height:calc(100vh - 130px);position:sticky;top:12px}
.picker > *{flex:none}
.picker > .bases-wrap{flex:1 1 auto;min-height:120px}
@media (max-width:760px){.picker{position:static;max-height:none}}
.pickrow{display:flex;gap:6px;padding:10px 12px 0}
.pickrow select{flex:1 1 0;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:6px 8px;font-size:13px;font-weight:600;cursor:pointer}
.pickrow[hidden],.pickrow select[hidden]{display:none}
.bkind{padding:10px 12px 8px}.bkind .seg{display:flex}.bkind .seg button{flex:1}
.bkind .n{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);margin-left:4px}
.bases-wrap{overflow:auto;padding:0 8px 10px}
@media (max-width:760px){.bases-wrap{max-height:300px}}
.bsec{font-size:11px;letter-spacing:.06em;color:var(--faint);padding:10px 6px 6px}
.bases{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.base{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px 5px;border:1px solid transparent;border-radius:8px;background:transparent;cursor:pointer;text-align:center}
.base:hover{background:var(--panel-2)}
.base[aria-pressed="true"]{border-color:var(--rare);background:var(--panel-2)}
.base img{height:50px;width:auto;object-fit:contain}
.base span{font-size:11px;line-height:1.25;color:var(--muted)}
.base .lv{position:absolute;top:3px;right:4px;font-family:var(--f-mono);font-size:9.5px;color:var(--faint)}
/* item column */
.itemcol{padding:14px;display:flex;flex-direction:column;gap:12px;align-items:stretch}
/* item column follows the page and always fits the window; the odds/history pane takes the leftover height and scrolls inside (사용자 2026-11-11) */
@media (min-width:821px){.itemcol{position:sticky;top:12px}.itemcol.tall{position:static}.itemcol>.info>.pane{height:640px;max-height:none;overflow:auto}}   /* 다음 결과 확률·기록·사용량: 10줄 정도 보이게(사용자 2026-11-11), 가운데 칸이 화면보다 길면 따라오지 않음 */
.ctrlrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.ctrlrow input[type=number]{width:60px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:3px 6px;font-family:var(--f-mono)}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer;font-size:13px}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--rare);color:var(--ink);border-color:var(--rare);font-weight:600}
.tt{--tt-bg:#0d0d10;--tt-edge:#6b5a33;--tt-gold:#c8a85a;--tt-label:#8a8a8a;--tt-val:#ece8df;--tt-mod:#8888ff;--tt-corr:#d22c2c;--tt-name:#ffff77;--tt-head:#2a2416;
  width:100%;background:var(--tt-bg);border:1px solid var(--tt-edge);box-shadow:0 0 0 1px #000,0 10px 30px rgba(0,0,0,.5);text-align:center;color:var(--tt-val)}
.tt.normal{--tt-name:#d6d3cc;--tt-head:#26262a;--tt-edge:#55555b}
.tt.magic{--tt-name:#8f8fff;--tt-head:#1b1c33;--tt-edge:#3b3d77}
.tt-head{position:relative;padding:9px 14px 8px;background:linear-gradient(180deg,var(--tt-head) 0%,#121212 100%);border-bottom:1px solid var(--tt-edge)}
.tt-head::before,.tt-head::after{content:"";position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--tt-edge) 12%,var(--tt-gold) 50%,var(--tt-edge) 88%,transparent)}
.tt-head::before{top:3px}.tt-head::after{bottom:3px}
.tt.normal .tt-head::before,.tt.normal .tt-head::after,.tt.magic .tt-head::before,.tt.magic .tt-head::after{background:linear-gradient(90deg,transparent,var(--tt-edge) 20%,var(--tt-edge) 80%,transparent)}
.tt-name{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.3;color:var(--tt-name)}
.tt-base{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--tt-name);opacity:.92}
/* item card header art (사용자 확정 2026-11-11) */
.tt-head{border-style:solid;border-width:0 46px;border-image:url(img/tt/rare.webp) 0 132 fill / 0 46px stretch;background:none;padding:10px 0 9px;min-height:44px;display:flex;flex-direction:column;justify-content:center;border-bottom:none}
.tt.magic .tt-head{border-image-source:url(img/tt/magic.webp)}
.tt.normal .tt-head{border-image-source:url(img/tt/normal.webp?v=2)}
.tt-head::before,.tt-head::after{display:none!important}
.tt-name,.tt-base{text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.7)}
.tt.magic{--tt-name:#a6a6ff}
.tt-excl{color:#d8b46a}

.tt-body{padding:12px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;line-height:1.55}
.tt-img{max-height:100px;max-width:110px;object-fit:contain;margin:2px 0 8px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.tt-prop{color:var(--tt-label)} .tt-prop b{color:var(--tt-val);font-weight:500} .tt-prop b.chg{color:#8f8fff}
.tt-sep{width:86%;height:1px;margin:9px 0;background:linear-gradient(90deg,transparent,var(--tt-gold),transparent);opacity:.75}
.tt-sock{display:flex;gap:6px;justify-content:center;margin:6px 0 2px}
.tt-sock span{width:14px;height:14px;border-radius:50%;border:2px solid #9fb4ff;background:#18181c}
.tt-sock span.on{background:radial-gradient(circle,#c9d6ff 0 35%,#5c74c9 70%)}
.tt-mod.rune{color:#9fb4ff}
.tt-mod.rune.bond{opacity:.8;font-size:.95em}
.bond-tg{margin-left:6px;vertical-align:1px;font:inherit;font-size:10.5px;line-height:1;padding:2px 5px;border-radius:3px;border:1px solid #4a5a8f;background:transparent;color:#8fa2e6;cursor:pointer}
.bond-tg[aria-pressed="true"]{background:#2b3560;color:#dfe6ff}
.tt-mod.ench{color:#e0605a}
.tt-mod.sac{color:#ff9a6a}
.tt-mod{position:relative;width:100%;padding:1px 34px;color:var(--tt-mod);white-space:pre-line}
.itemwrap{display:block}
.tt-art{position:relative;display:flex;justify-content:center;align-items:center;min-height:90px;margin:2px 0 10px}
.tt-art img{max-height:150px;max-width:120px;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.7))}
.tt-art .side-socks{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.side{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:40px}
.side img{max-width:56px;max-height:170px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.side-socks{position:absolute;display:flex;flex-direction:column;gap:10px;align-items:center}
.ss{width:22px;height:22px;border-radius:50%;border:2px solid #4d5a7a;background:radial-gradient(circle,#11131a 40%,#1d2230);box-shadow:0 0 0 1px #000}
.ss.on{border-color:#9fb4ff;background:radial-gradient(circle,#d9e3ff 0 18%,#5c74c9 45%,#1a2240 75%);box-shadow:0 0 8px rgba(120,150,255,.6)}
.ss.lk{border-color:#c9a85a}
.ttcol{min-width:0}
.dpsbar{display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:center;background:#0d0d10;border:1px solid #2a2a2e;border-top:0;padding:5px 10px;font-size:13px;color:#8a8a8a}
.dpsbar b{color:#ece8df;font-weight:600}
.tt-prop b.up{color:#ece8df;text-decoration:underline dotted #8a8a8a}
.tt-state{font-size:14px} .tt-state.cor{color:#d22c2c} .tt-state.san{color:#e8e3d8} .tt-state.mir{color:#8f8fff}
.tt-mod .tt-tier{position:absolute;left:6px;top:2px;font-family:var(--f-body);font-weight:600;font-size:11px;color:#6f6f78;white-space:nowrap}
.tt-tier.tp{color:#e88a7a} .tt-tier.ts{color:#7fa6ff}
.tt-mod.des{color:var(--tt-mod);background:linear-gradient(90deg,rgba(120,160,40,.55),rgba(120,160,40,.08) 22%,rgba(120,160,40,0) 40%,rgba(120,160,40,0) 60%,rgba(120,160,40,.08) 78%,rgba(120,160,40,.55));box-shadow:inset 0 1px 0 rgba(170,210,80,.45),inset 0 -1px 0 rgba(170,210,80,.45)}
.tt-mod.fr{color:#c9b27a}
.tt-mod.cr{color:#9fd8b0}
.tt-mod.slot0{min-height:21px;opacity:.55}
.tt-tier.tr{color:#9fb4ff} .tt-tier.tv{color:#e0605a}
.tt-cnt{display:flex;justify-content:center;gap:12px;font-family:var(--f-mono);font-size:11px;color:#6d6a62;margin-top:4px}
.tt-cnt .p{color:#e88a7a} .tt-cnt .s{color:#7fa6ff} .tt-cnt .r{color:#9fb4ff}
.tt-exc{font-size:11.5px;color:#d8b46a;margin-top:2px;font-family:var(--f-body);font-weight:400}
.olegend{list-style:none;margin:8px 0 0;padding:8px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:3px 10px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:8px}
.olegend li{display:flex;align-items:center;gap:6px}
.olegend i{width:9px;height:9px;border-radius:2px;flex:none}
.tt-mod.unrev{color:#9be86a}
.glyph{font-family:"Segoe UI Historic","Noto Sans Runic",serif;letter-spacing:.12em;color:#a9f06f;text-shadow:0 0 4px rgba(150,240,90,.85),0 0 10px rgba(110,210,60,.55)}
.tt-mod.aff{color:#ff9a3c}
.aff-note{display:flex;align-items:center;justify-content:center;gap:6px;color:#ff9a3c!important;font-style:italic}
.aff-note img{width:22px;height:22px}
.tt-note{width:100%;margin-top:6px;font-style:italic;font-size:13px;color:#d6d3cc;opacity:.9}
.well-open{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;padding:10px;border:1px solid #4d6b2e;border-radius:8px;background:radial-gradient(ellipse at center,#1d2a14 0%,#111410 80%);color:#d6e6c4;cursor:pointer;font-family:var(--f-display);font-size:15px;font-weight:700}
.well-open small{font-family:var(--f-body);font-weight:400;font-size:11.5px;color:#93a184}
.well-open:hover{border-color:#8fd35a;box-shadow:0 0 12px rgba(140,220,80,.25)}
.well{border:1px solid #3a3528;border-radius:6px;background:radial-gradient(ellipse at 50% 20%,#1d2318 0%,#0d0f0c 75%);padding:14px 12px 12px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 0 40px rgba(0,0,0,.8)}
.well-top{display:flex;flex-direction:column;align-items:center;gap:8px}
.well-plaque{font-family:var(--f-display);font-weight:700;font-size:15px;color:#f0e2b8;padding:3px 22px;border:1px solid #8a7444;background:linear-gradient(180deg,#3b2f1a,#1e170c);box-shadow:0 0 0 1px #000}
.well-frame{width:110px;height:150px;display:grid;place-items:center;background:#3d0d0d;border:3px solid #6fbf3a;box-shadow:0 0 14px rgba(120,220,60,.55),inset 0 0 18px rgba(0,0,0,.7)}
.well-frame img{max-width:96px;max-height:136px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.8))}
.well-opts{display:flex;flex-direction:column;border:1px solid #2c2a22}
.well-opt{background:linear-gradient(180deg,#141412,#0c0c0b);border:0;border-bottom:1px solid #2c2a22;color:#c9c6bd;padding:16px 10px;cursor:pointer;font-size:14px;line-height:1.45}
.well-opt:last-child{border-bottom:0}
.well-opt:hover{color:#ece8df;background:#191915}
.well-opt[aria-pressed="true"]{color:#f4ecd2;box-shadow:inset 0 0 0 1px #b99a55,inset 0 0 18px rgba(185,154,85,.18)}
.well-act{display:flex;justify-content:center;gap:8px;align-items:center}
.well-ok{min-width:110px;padding:5px 16px;font-family:var(--f-display);font-weight:700;color:#efe6cc;background:linear-gradient(180deg,#2c2c2c,#121212);border:1px solid #6b6b6b;cursor:pointer}
.well-ok:disabled{opacity:.4;cursor:not-allowed}
.well-ok:not(:disabled):hover{border-color:#c8a85a}
.tt-mod.new{animation:flash 1.1s ease-out}
@keyframes flash{0%{background:rgba(234,215,127,.28)}100%{background:transparent}}
.tt-mod.dim{color:#5c5c66;font-style:italic}
.tt-corr{color:var(--tt-corr);font-weight:600}
.reveal{border:1px solid var(--des);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--des) 8%,var(--panel))}
.reveal h3{margin:0;font-size:13px;color:var(--des)}
.reveal button.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 10px;cursor:pointer;font-size:13px}
.reveal button.opt:hover{border-color:var(--des)}
.lastlog{font-size:12.5px;color:var(--muted);min-height:1.5em}
.lastlog b{color:var(--fg);font-weight:600}
.lastlog .lh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lastlog .lh img{width:22px;height:22px;object-fit:contain}
.lastlog .lh .note{color:var(--muted);font-size:12px}
.chg-box{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel-2)}
.chg-box + .chg-box{margin-top:6px}
.chg-box .k{font-size:11px;font-weight:600;letter-spacing:.04em;padding-top:2px}
.chg-box ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.chg-box.rem{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.chg-box.rem .k,.chg-box.rem li{color:var(--warn)}

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = t => String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function warn(m, title){ const w=$('#warn'); $('#warn-t').textContent = title || L('사용 불가','Can\'t use this'); $('#warn-m').textContent=m; w.hidden=false; $('#warn-ok').focus(); }
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2000)}
const S = { lang:((()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q)return q;return localStorage.getItem('poe2lang')}catch(e){return null}})()||'en'), index:null, craft:null, cat:null, cls:null, data:null, base:0, bkind:'normal', item:null, hist:[], spend:{}, omens:new Set(), pane:'odds', ctab:'orb', fore:null, mode:'cur', held:null, opt:{sec:'n', side:'all', q:'', roll:'rand', tier:{}}, oddsAct:'exalt', oddsMin:0, oddsTier:{}, essTier:'all', last:null, reveal:null };
const cache = {};
const KR = () => S.lang==='kr';
// mod tags beside each modifier, like poe2db (사용자 2026-11-11)
const MTAG=[['damage','피해','Damage'],['physical','물리','Physical'],['elemental','원소','Elemental'],['fire','화염','Fire'],['cold','냉기','Cold'],['lightning','번개','Lightning'],['chaos','카오스','Chaos'],['attack','공격','Attack'],['caster','주문','Caster'],['minion','소환수','Minion'],['speed','속도','Speed'],['critical','치명타','Critical'],['life','생명력','Life'],['mana','마나','Mana'],['defences','방어','Defences'],['resistance','저항','Resistance'],['attribute','능력치','Attribute'],['ailment','상태 이상','Ailment'],['bleed','출혈','Bleed'],['poison','중독','Poison'],['curse','저주','Curse'],['aura','오라','Aura'],['gem','젬','Gem'],['block','막기','Block'],['drop','희귀도','Rarity'],['flask','플라스크','Flask'],['charm','부적','Charm']];
const mtags = g => { const s=new Set(g.tg||[]), h=MTAG.filter(x=>s.has(x[0])).map(([k,kr,en])=>`<span class="mt mt-${k}">${KR()?kr:en}</span>`).join(''); return h?`<span class="mts">${h}</span>`:''; };

const L = (kr,en) => KR()?kr:en;
// tier row: [ilvl, weight, nameKr, nameEn, textKr, textEn]
const tName = t => KR()?t[2]:t[3], tText = t => KR()?t[4]:t[5];
const rnd = () => Math.random();
const pickW = arr => { const tot = arr.reduce((s,x)=>s+x.w,0); if(!tot) return null; let r = rnd()*tot; for(const x of arr){ r -= x.w; if(r<=0) return x; } return arr[arr.length-1]; };
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

// ---------- data ----------
async function boot(){
  [S.index, S.craft] = await Promise.all([fetch('data/index.json').then(r=>r.json()), fetch('data/crafting.json').then(r=>r.json())]);
  /* 덫(Traps)은 새로 나온 스킬이라 아직 숨김 (사용자 확정 2026-11-11 23:03) */ const HIDE_CLS=new Set(['Traps']); S.index.groups.forEach(g=>g.classes=g.classes.filter(c=>!HIDE_CLS.has(c.id))); S.index.groups=S.index.groups.filter(g=>g.classes.length);
  S.byId = {}; for(const k of ['special','cats','liquids','qual','sac','orbs','bones','essences','omens']) for(const x of S.craft[k]){ S.byId[x.id] = x; if(x.min!=null) x.min=+x.min; if(x.maxilvl!=null) x.maxilvl=+x.maxilvl; }
  /* 유동체 4종(2026-11-13, 사용자: 에뮬레이터에 유동체 추가): 원소 저항 옵션 종류를 바꿈. 규칙은 sim.js fluxTarget(레시피 엔진·시뮬과 같음, game-rules.md). 완벽한 유동체(스킬 20레벨)·마석학 유동체(젬)는 장비 제작과 무관해 뺌 */
  S.flux = (S.craft.extra||[]).filter(x=>x.act==='flux' && window.POE2SIM?.FLUX?.[x.id]); S.flux.forEach(x=>{ S.byId[x.id]=x; });
  await loadClass('Body_Armours_str');
  openDrawer(true);
}
const catOf = cid => S.index.groups.find(g=>g.classes.some(c=>c.id===cid));
async function loadClass(id){
  if(!cache[id]) cache[id] = await fetch(`data/c/${encodeURIComponent(id)}.json`).then(r=>r.json());
  S.cls = id; S.data = cache[id]; S.cat = catOf(id).id; S.bkind='normal';
  const o = orderedBases(); newItem((o.normal[0]||o.special[0]).i);
}
function orderedBases(){
  const b = S.data.bases.map((x,i)=>({...x,i})).filter(x=>x.sp!=='unique'), by=(a,c)=>c.lv-a.lv||a.i-c.i;   /* 고유 전용·스킬 생성 베이스(황금 고리·에너지 칼날 등)는 제작 불가라 목록에서 뺌 (사용자 확정 2026-11-11) */
  return {normal:b.filter(x=>!x.sp).sort(by), special:b.filter(x=>x.sp).sort(by)};
}
const base = () => S.data.bases[S.item.base];

// ---------- item model ----------
// mod: {gi, ti, roll:0..1, m:1 (vaal value multiplier), fr, unrev:'p'|'s' (unrevealed desecrated)}
// the item level at which every regular modifier tier of this item class can roll (default when a base is picked)
const maxModLvl = () => Math.min(86, Math.max(1, ...S.data.groups.filter(g=>g.s==='n').flatMap(g=>g.t.filter(t=>t[1]>0).map(t=>t[0]))));
function newItem(bi, keepIlvl){
  const b = S.data.bases[bi];
  const ilvl = Math.max(b.dl||1, Math.min(86, keepIlvl ?? maxModLvl()));
  const keepSkill = S.item && S.item.base===bi ? S.item.skill||0 : 0;
  S.item = { base:bi, ilvl, quality:0, rarity:'normal', mods:[], corrupted:false, corrImp:null, sockets:0, runes:[], impRoll:rolls(), rev:0, skill:keepSkill };
  S.hist = []; S.spend = {}; S.omens = new Set(); S.reveal = null; S.last = null; S.start = null;
  render(); renderPicker();
}
const clone = it => JSON.parse(JSON.stringify(it));
const grp = m => S.data.groups[m.gi];
const genOf = m => m.unrev || grp(m).g;
// ----- runes: socketed runes change slot counts, crafted limit and unlock special (x) families
const runesList = () => base().rk ? (S.data.runesBy[base().rk]||S.data.runes) : S.data.runes;
const runeTxt = (t, sep='\n') => (KR()?t[2]:t[3]).split('\n').filter(x=>x && !/\[\d+\]|^local |hidden/i.test(x)).join(sep);
// special runes change item rules (slot count, crafted limit, unlock families) and cannot be replaced once socketed
// Socket-bound augments (poe2db "Socket-bound Augments"): permanent, cannot be removed or replaced
const SOCKET_BOUND = new Set(["Serle's Triumph","Cadigan's Epiphany","Uhtred's Sidereus","Kolr's Hunt","Vorana's Carnage","Thrud's Might","Medved's Tending","Katla's Gloom",
  "Passion of Aldur","Breath of Aldur","Ire of Aldur","Betrayal of Aldur","Raven-Touched Shard",
  "Atziri's Soul Core of Devotion","Atziri's Soul Core of Vitality","Atziri's Soul Core of Alacrity","Atziri's Soul Core of Inoculation"]);
const runeLocked = t => SOCKET_BOUND.has(t[1]);
// Ancient augments (poe2db "Ancient Augment"): only one socketed at a time (shared limit per character)
const runeAncient = t => /'s Gaze$|'s Thesis$|^Emergent |^Carved /.test(t[1]);
// "Limited to: 1" augments (poe2db item pages): the same one can't be socketed twice. Plain tiered runes, most soul cores and animal idols have no limit and can be doubled.
const LIMITED_ONE = new Set(["Soul Core of Puhuarte","Soul Core of Jiquani","Soul Core of Opiloti","Soul Core of Ticaba","Soul Core of Topotante","Soul Core of Vizoma","Soul Core of Tzamoto","Soul Core of Xopec","Soul Core of Zalatl",
  "Fox Idol","Hawk Idol","Panther Idol","Rabbit Idol","Stag Idol","Stoat Idol",
  "Warding Rune of Annihilation","Warding Rune of Armature","Warding Rune of Bodyguards","Warding Rune of Nourishment","Warding Rune of Symbiosis","Warding Rune of Equinox","Warding Rune of Heart","Warding Rune of Hollowing","Warding Rune of Obsession","Warding Rune of Protection","Warding Rune of Salvaging"]);
const runeOnePer = t => LIMITED_ONE.has(t[1]) || /^(Ancient )?Rune of |^Idol of |'s |' /.test(t[1]) && !/^(Lesser |Greater |Perfect )/.test(t[1]);
const runeLegacy = t => /^Legacy of /.test(t[1]);   // "Limited to: 1 Aldur's Legacy" — one Legacy rune in total
const runeTierOrder = n => /^Lesser /.test(n)?0:/^Greater /.test(n)?2:/^Perfect /.test(n)?3:1;
// Aldur's Legacy only works on non-corrupted Kalguuran/Ezomyte uniques — no effect on crafted items
// Aldur runes transform the item's modifiers when socketed → only on non-corrupted, non-sanctified Rare weapons
const runeAldur = t => /^(Passion|Breath|Ire|Betrayal) of Aldur$/.test(t[1]);
const runeUniqueOnly = t => t[1]==="Aldur's Legacy";
// bound runes (Legacy of …, Aldur's Legacy): one per character, cannot be socketed into corrupted or sanctified items
const runeAlwaysChange = () => (S.item.runes||[]).slice(0,S.item.sockets).some(r=>{ const t=r&&runeAt(r); return t && /Corrupting will always result in change/i.test(t[3]); });
const runeAt = r => { const f=runesList()[r.ri]; return f && f.t[r.ti]; };
function runeFx(){
  const o={p:0,s:0,craft:0,names:new Set()};
  (S.item.runes||[]).slice(0,S.item.sockets).forEach(r=>{ if(!r) return; const t=runeAt(r); if(!t) return; o.names.add(t[1]);
    for(const m of t[3].matchAll(/([+-]\d+) (Prefix|Suffix) Modifiers? allowed/g)) o[m[2]==='Prefix'?'p':'s'] += +m[1];
    const c=t[3].match(/Can have (\d+) additional Crafted Modifiers?/); if(c) o.craft += +c[1]; });
  return o;
}
const gateNames = () => new Set(runesList().flatMap(r=>r.t.map(t=>t[1])));
const gated = g => g.s==='x' && gateNames().has(g.sub[1]) && !runeFx().names.has(g.sub[1]);
// a base with fewer prefix/suffix slots also has fewer magic slots (사용자 확정 2026-11-11):
// Absent Amulet (-1/-1) can't be magic — normal goes straight to rare with a Regal Orb; Lament (-1 prefix) is suffix-only while magic
const magicCap = g => Math.max(0, Math.min(1, 1 + (g==='p'?base().pd:base().sd)));
const canMagic = () => magicCap('p')+magicCap('s') > 0;
// skill-granting bases roll one skill from a list: keep only the chosen one
const SKILL_RE = /^(Grants Skill|스킬 부여)/;
const skillIdx = b => (b.imp[0]||[]).map((x,i)=>SKILL_RE.test(x)?i:-1).filter(i=>i>=0);
const impOf = (b, lang) => { const sk=skillIdx(b), keep=sk.length>1 ? sk[Math.min(S.item?.skill||0, sk.length-1)] : -1;
  return (b.imp[lang]||[]).filter((x,i)=>keep<0 || !sk.includes(i) || i===keep); };
/* jewels have 2 prefixes · 2 suffixes; Potent Liquid Contempt adds one slot that stays after its line is removed (it.extra, game-rules.md) */
const rareCap = g => { const fx=runeFx(); return Math.max(0, (S.cat==='jewel'?2:3) + (g==='p'?base().pd+fx.p:base().sd+fx.s) + ((S.item.extra||{})[g]||0)); };
const isLiq = g => g.sub && g.sub[1]==='Liquid Emotions';
const slotFx = g => { const o={p:0,s:0}; for(const m of String((g.t[0]||[])[5]||'').matchAll(/([+-]\d+) (Prefix|Suffix) Modifiers? allowed/g)) o[m[2]==='Prefix'?'p':'s'] += +m[1]; return o; };
function addSlotFx(it, m){ if(m.unrev) return; const g=grp(m); if(!isLiq(g)) return; const o=slotFx(g); if(!o.p && !o.s) return; it.extra=it.extra||{p:0,s:0}; it.extra.p+=o.p; it.extra.s+=o.s; }
const craftedLimit = () => 1 + runeFx().craft;
const craftedCount = () => S.item.mods.filter(m=>!m.unrev && grp(m).cr && !isLiq(grp(m))).length;   /* liquid emotions are not counted (policies.md 5) */
function maxAff(g){ const it=S.item; if(it.rarity==='normal') return 0; if(it.rarity==='magic') return magicCap(g); return rareCap(g); }
const countGen = g => S.item.mods.filter(m=>genOf(m)===g).length;
const freeGen = g => countGen(g) < maxAff(g);
const famSet = (excl) => { const f=new Set(); S.item.mods.forEach(m=>{ if(m!==excl && !m.unrev) grp(m).f.forEach(x=>f.add(x)); }); return f; };
const maxSockets = () => (base().sock || 0) + (S.item.exc==='sock' && base().sock ? 1 : 0);   // exceptional base: one more rune socket
const isCraftable = () => !S.item.corrupted;
function qualityKind(){ const c=S.cls, g=S.cat;
  if(['Wands','Staves','Sceptres'].includes(c)) return 'caster';
  if(g==='weapon'||g==='weapon2') return 'weapon';
  if(c==='Quivers') return null;
  if(['helmet','body','gloves','boots','offhand'].includes(g)) return 'armour';
  if(c==='Amulets'||c==='Rings') return 'jewellery';
  if(c==='Life_Flasks'||c==='Mana_Flasks') return 'flask';
  if(g==='jewel') return 'jewel';
  return null; }
const QMAX = 20;
// 최대 퀄리티(사용자 확정 2026-11-11): 기본 20% + 고정 옵션(균열 반지 +20%, 제련된 균열 반지 +25%) + 균열의 에센스 옵션(+20%, 붙어 있는 동안).
// 옵션이 지워져도 이미 올린 퀄리티는 그대로 — 상한은 퀄리티를 올릴 때만 봄
const maxQOf = t => { let v=0; for(const m of String(t||'').matchAll(/\+(\d+)% to Maximum Quality/gi)) v+=+m[1]; return v; };
const qmax = () => QMAX + impOf(base(),0).reduce((v,x)=>v+maxQOf(x),0) + S.item.mods.reduce((v,m)=>m.unrev?v:v+maxQOf(grp(m).t[m.ti][5]),0);
const sacPart = () => S.cat==='jewellery' ? 'jewellery' : S.cat==='jewel' ? 'jewel' : (S.cat==='weapon'||S.cat==='weapon2'||S.cls==='Quivers') ? 'weapon' : ['helmet','body','gloves','boots','offhand'].includes(S.cat) ? 'armour' : null;
const qualStep = () => ({normal:5, magic:2, rare:1})[S.item.rarity] || 1;
const bonusStep = () => rnd()<0.2 ? 2 : 1;   // ilvl 82+: 20% chance of +2 (community data)
const infuseCorruptChance = q => Math.max(0, (q-qmax())*0.05);   // 0% at 20%, +5% per point above (community data, 1,734 infusers)
// the upgraded (Orb of Sacrifice) version of a corruption enchantment: same family
function sacTarget(){ const ci=S.item.corrImp; if(!ci) return null; const cg=S.data.groups[ci.gi]; if(cg.s!=='c') return null;
  const gi = S.data.groups.findIndex(g=>g.s==='u' && g.f.some(f=>cg.f.includes(f))); return gi>=0 ? gi : null; }

// candidate mods to add: normal pool unless sections given
function pool({gens, minLvl=0, sections=['n'], tagsAny=null, lord=null, rarity}={}){
  const it=S.item, fams=famSet(), out=[];
  const R = rarity || it.rarity;
  const free = g => it.mods.filter(m=>genOf(m)===g).length < (R==='magic'?magicCap(g):R==='rare'?rareCap(g):0);
  const G = (gens||['p','s']).filter(free);
  S.data.groups.forEach((g,gi)=>{
    if(!sections.includes(g.s) || !G.includes(g.g)) return;
    if(g.f.some(x=>fams.has(x))) return;
    if(gated(g)) return;
    if(tagsAny && !g.tg.some(t=>tagsAny.has(t))) return;
    if(lord && !g.tg.includes(lord+'_mod')) return;
    // minimum modifier level never removes a family: its highest tier the item level allows always stays in (Greater/Perfect currency, bones)
    const top = g.t.findIndex(t=>t[0]<=it.ilvl && (t[1]>0 || g.s==='d'));
    g.t.forEach((t,ti)=>{ if(t[0]<=it.ilvl && (t[0]>=minLvl || ti===top) && (t[1]>0 || g.s==='d')) out.push({gi,ti,w:g.s==='d'?1:t[1],gen:g.g}); });
  });
  return out;
}
function addRandom(opts){ const p = pickW(pool(opts)); if(!p) return null; const m={gi:p.gi, ti:p.ti, roll:rolls(), m:1}; S.item.mods.push(m); return m; }
function removeRandom(filter){ const c = S.item.mods.filter(m=>!m.fr && (!filter || filter(m))); if(!c.length) return null; const m = c[Math.floor(rnd()*c.length)]; S.item.mods.splice(S.item.mods.indexOf(m),1); return m; }
const omen = id => S.omens.has(id);
const useOmen = id => { if(S.omens.has(id)){ S.omens.delete(id); S.spend['omen:'+id]=(S.spend['omen:'+id]||0)+1; return true; } return false; };
const existingTags = () => { const s=new Set(); S.item.mods.forEach(m=>{ if(!m.unrev) grp(m).tg.forEach(t=>{ if(!['unveiled_mod'].includes(t)) s.add(t); }); }); return s; };
const sideOmen = (sin, dex) => omen(sin) ? ['p'] : omen(dex) ? ['s'] : null;

// ---------- actions: each returns '' if allowed or a reason ----------
function check(c){
  const it=S.item, r=it.rarity, n=it.mods.length;
  if(S.item.mirrored) return '복제된 아이템은 변경 불가';
  if(c.act==='mirror') return '';
  if(S.item.sanctified && (c.act==='vaal'||c.act==='infuse')) return '축성된 아이템은 타락 불가';
  if(S.item.sanctified) return '축성된 아이템은 제작 불가';
  if(S.item.corrupted && c.act==='divine' && omen('sanctify')) return '타락한 아이템은 축성 불가';
  if(!isCraftable() && !['sacrifice'].includes(c.act)) return '타락한 아이템은 제작 불가';
  switch(c.act){
    case 'transmute': return r!=='normal' ? '일반 아이템 전용' : !canMagic() ? '마법 불가 · 제왕의 오브 사용' : addCheck('transmute', c);
    case 'augment': return r!=='magic' ? '마법 아이템 전용' : n>=magicCap('p')+magicCap('s') ? '옵션 자리 없음' : addCheck('augment', c);
    case 'regal': return !(r==='magic' || (r==='normal' && !canMagic())) ? '마법 아이템 전용' : addCheck('regal', c);
    case 'alchemy': return r==='rare' ? '일반·마법 아이템 전용' : '';
    case 'exalt': return r!=='rare' ? '희귀 아이템 전용' : (!freeGen('p') && !freeGen('s')) ? '옵션 자리 없음' : addCheck('exalt', c);
    case 'chaos': return r!=='rare' ? '희귀 아이템 전용' : !it.mods.some(m=>!m.fr) ? '바꿀 옵션 없음' : removeCheck('chaos');
    case 'annul': return r==='normal' ? '마법·희귀 아이템 전용' : !it.mods.some(m=>!m.fr) ? '제거할 옵션 없음' : removeCheck('annul');
    case 'divine': return omen('sanctify') && r!=='rare' ? '축성의 징조: 희귀 아이템 전용' : r==='normal' && !impOf(base(),0).length ? '바꿀 수치 없음' : '';
    case 'fracture': return r!=='rare' ? '희귀 아이템 전용' : n<4 ? '옵션 4개 이상 필요' : it.mods.some(m=>m.fr) ? '분열된 옵션 있음' : '';
    case 'vaal': return '';
    case 'artificer': return !maxSockets() ? '소켓 추가 불가' : it.sockets>=maxSockets() ? `소켓 최대 ${maxSockets()}개` : it.corrupted ? '타락한 아이템' : '';
    case 'essence': case 'liquid': return essCheck(c);
    case 'flux': return r==='normal' ? '마법·희귀 아이템 전용' : !it.mods.some(m=>POE2SIM.fluxTarget(S.data.groups, c.id, m)) ? '바꿀 원소 저항 옵션 없음' : '';
    case 'hinekora': return it.hinekora ? '결과 미리 보기 중' : '';
    case 'catalyst': { const qk=qualityKind(); if(c.on==='jewellery' ? qk!=='jewellery' : qk!=='jewel') return c.on==='jewellery' ? '반지·목걸이 전용' : '주얼 전용';

      const lord = omen('liege') ? 'amanamu' : omen('sovereign') ? 'ulaman' : omen('blackblooded') ? 'kurgal' : null;

function revealOptions(m){
  // normal pool + desecration-only mods; a lord omen restricts to that lord's desecrated mods
  const opts = pool({gens:[m.unrev], minLvl:m.minLvl||0, sections: m.lord?['d']:['n','d'], lord:m.lord, rarity:'rare'});
  function dWeightE(){ const ns=S.data.groups.filter(g=>g.s==='n'), ws=new Set(ns.flatMap(g=>g.t.map(t=>t[1]))); if(ws.size!==1 && !ns.some(g=>g.wsrc==='sl')) return 1000; const il=S.item?.ilvl||82; const tot=ns.map(g=>g.t.filter(t=>t[0]<=il).reduce((a,t)=>a+t[1],0)).filter(x=>x>0); return tot.reduce((a,x)=>a+x,0)/Math.max(1,tot.length); }   // jewels: every modifier weighs the same (recipes.html dWeight)
  const byG = new Map(); opts.forEach(o=>{ const r=byG.get(o.gi)||{gi:o.gi,w:0,list:[]}; r.w += S.data.groups[o.gi].s==='d'?dWeightE():o.w; r.list.push(o); byG.set(o.gi,r); });
  let groups=[...byG.values()], out=[];
  for(let k=0;k<3 && groups.length;k++){ const g=pickW(groups); groups=groups.filter(x=>x!==g); const t=pickW(g.list.map(o=>({...o,w:S.data.groups[o.gi].s==='d'?1:o.w}))); out.push(t); }
  return out;
}

const rolls = () => Array.from({length:8}, rnd);
function rollText(t, roll, mult=1){
  const fmt = (v,dec) => dec ? (+v.toFixed(2)).toString() : String(Math.round(v));
  // ranges get rolled then scaled; fixed numbers outside ranges only get scaled (single pass, no double scaling)
  // roll: one 0..1 value per range (array), or a single number applied to every range
  let k=0;
  return t.split(/(\(\d+(?:\.\d+)?—\d+(?:\.\d+)?\))/).map(part=>{
    const r = part.match(/^\((\d+(?:\.\d+)?)—(\d+(?:\.\d+)?)\)$/);
    if(r){ const q = Array.isArray(roll) ? (roll[k++] ?? .5) : roll, a=+r[1], b=+r[2], dec=r[1].includes('.')||r[2].includes('.');
      const v = dec ? a+(b-a)*q : a + Math.min(b-a, Math.floor(q*(b-a+1)));   // integers: every value in the range equally likely
      return fmt(v*mult, dec); }
    return mult===1 ? part : part.replace(/\d+(?:\.\d+)?/g, n=>fmt(+n*mult, n.includes('.')));
  }).join('');
}
function modText(m){

}

  const rtag = `<span class="tt-tier tr">${'R'}</span>`;

  const runeLines = runeOn.map(t=>{ const bd=KR()?t[4]:t[5]; return `<div class="tt-mod rune">${rtag}${esc(runeTxt(t))}${bd?`<button type="button" class="bond-tg" data-bond aria-pressed="${!!S.showBond}" title="${L('결속 효과 보기','Show bonded effect')}">${L('결속','Bond')}</button>`:''}</div>${bd&&S.showBond?`<div class="tt-mod rune bond">${L('결속됨','Bonded')}: ${esc(bd)}</div>`:''}`; });

  const rank = m => (genOf(m)==='p'?0:2) + ((m.unrev || isDes(m)) ? 1 : 0);
  const order = [...it.mods].sort((a,c)=>rank(a)-rank(c));
  const capOf = g => r==='magic' ? magicCap(g) : r==='rare' ? rareCap(g) : 0;
  const tag = (m,txt) => `<span class="tt-tier ${genOf(m)==='p'?'tp':'ts'}">${esc(txt)}</span>`;
  const mods = order.map(m=>m.unrev

  if(aff.set.size) mods.push(`<div class="tt-note aff-note">${aff.icon?`<img src="${aff.icon}" alt="">`:''}${L('주황색 속성이 변경됩니다','Orange modifiers will be changed')}</div>`);
  if(it.mods.some(m=>m.unrev)) mods.push(`<div class="tt-note">${L('이 아이템을 영혼의 우물로 가져가 훼손된 속성을 드러내십시오.','Take this item to the Well of Souls to reveal its Desecrated Modifiers.')}</div>`);
  const sockets = it.sockets ? `<div class="side-socks">${Array.from({length:it.sockets},(_,i)=>{ const t=it.runes&&it.runes[i]&&runeAt(it.runes[i]); return `<span class="ss ${t?'on':''} ${t&&runeLocked(t)?'lk':''}" title="${t?esc(KR()?t[0]:t[1]):L('빈 소켓','Empty socket')}"></span>`; }).join('')}</div>` : '';

  const secs = [art+props, `<div class="tt-prop">${L('아이템 레벨','Item Level')}: <b>${it.ilvl}</b></div>${reqLine()}${cnt}`,
    runeLines.join(''), ench, imps.join(''), mods.length?mods.join(''):`<div class="tt-mod dim">${L('옵션 없음','No modifiers')}</div>`].filter(Boolean);
  const status = [it.hinekora?`<div class="tt-prop" style="color:#9fd7ff">${L('히네코라의 머리카락 — 다음 결과를 내다봄','Foreseeing next result')}</div>`:'',
    it.mirrored?`<div class="tt-state mir">${L('복제된','Mirrored')}</div>`:'', it.sanctified?`<div class="tt-state san">${L('축성된','Sanctified')}</div>`:'', it.corrupted?`<div class="tt-state cor">${L('타락','Corrupted')}</div>`:''].filter(Boolean);
  const dps = lp.isW && (lp.dps||lp.edps) ? `<div class="dpsbar"><span>DPS: <b>${(lp.dps+lp.edps).toFixed(1)}</b></span><span>${L('물리 DPS','Physical DPS')}: <b>${lp.dps.toFixed(1)}</b></span>${lp.edps?`<span>${L('원소·카오스 DPS','Ele/Chaos DPS')}: <b>${lp.edps.toFixed(1)}</b></span>`:''}</div>` : '';
  $('#item').innerHTML = `<div class="itemwrap">
    <div class="ttcol"><div class="tt ${r}"><div class="tt-head">${title}</div><div class="tt-body">${secs.join('<div class="tt-sep"></div>')}${status.map(x=>'<div class="tt-sep"></div>'+x).join('')}</div></div>${dps}${legendHTML()}</div></div>`;
}

const reEsc = t => t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const NUM = '([+-]?\\d+(?:\\.\\d+)?)';
function tplRe(line){ // "+(10—20) to maximum Life" -> regex + ranges
  const ranges=[]; let src='';
  line.split(/(\(\d+(?:\.\d+)?—\d+(?:\.\d+)?\))/).forEach(part=>{
    const m = part.match(/^\((\d+(?:\.\d+)?)—(\d+(?:\.\d+)?)\)$/);
    if(m){ ranges.push([+m[1],+m[2]]); src+=NUM; }
    else src += reEsc(part).replace(/\d+(?:\.\d+)?/g, x=>{ ranges.push([+x,+x]); return NUM; });
  });
  return {re:new RegExp('^'+src.replace(/\\\+(?=\()/g,'\\+?')+'$','i'), ranges};
}
function matcher(data){
  if(data._mx) return data._mx;
  const list=[];
  data.groups.forEach((g,gi)=>{ if(!['n','d','e','x','c'].includes(g.s)) return;
    g.t.forEach((t,ti)=>{ for(const k of [4,5]){ const lines=t[k].split('\n'); list.push({gi,ti,s:g.s,lines:lines.map(tplRe)}); } }); });
  return data._mx = list;
}
// Rune lines in game text are totals: two of the same rune show as one line with double the value, and different runes
// on the same stat add up. Find the smallest set of up to 3 runes whose summed lines reproduce every rune line.
function solveRunes(lines, maxN){
  const shape = l => l.replace(/[+-]?\d+(?:\.\d+)?/g,'#').trim().toLowerCase();

function socketRune(i, r){
  const it=S.item, before=clone(it); if(i>=it.sockets) return;
  it.hinekora=false; S.fore=null;
  const old = it.runes[i] && runeAt(it.runes[i]);
  it.runes[i] = r; const t = r && runeAt(r);
  const nm = x => KR()?x[0]:x[1];
  // dropping a rune that granted slots can leave too many mods — warn but keep (player would not be able to remove it in game)
  S.hist.unshift({c:{id:'rune', kr:old?'룬 교체':'룬 장착', en:old?'Replace rune':'Socket rune', icon:''}, before, added:t?[`${nm(t)}: ${runeTxt(t,' / ')}`]:[], removed:old?[nm(old)]:[], note:'', omens:[]});
  if(r){ const nx = Array.from({length:it.sockets},(_,k)=>k).find(k=>!it.runes[k]); if(nx!=null) S.sockSel=nx; }
  S.last=null; render();
  const over = ['p','s'].filter(g=>it.rarity==='rare' && it.mods.filter(m=>genOf(m)===g).length>rareCap(g));
  if(over.length) toast(L('룬 제거로 옵션이 자리보다 많음','More modifiers than slots now'));
}

$('#shelves').addEventListener('click', e=>{

  const keys = Object.keys(D).sort((a,b)=>b.length-a.length);
  const re = new RegExp(keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
  const HAN = /[가-힣]/, ATTRS = ['placeholder','aria-label','title'];
  const origText = new Map(), origAttr = new Map();
  let lang = ((()=>{try{const q=new URLSearchParams(location.search).get('lang');if(q)return q;return localStorage.getItem('poe2lang')}catch(e){return null}})()||'en');
  const tr = s => s.replace(re, m => D[m]);
  const skip = el => !el || el.closest('script,style,textarea,.keep-lang');
  function walk(root){
    if(lang!=='en' || !root) return;
    if(root.nodeType===3){ fix(root); return; }
    if(root.nodeType!==1) return;
    const tw=document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
    while((n=tw.nextNode())) fix(n);
    [root, ...root.querySelectorAll('[placeholder],[aria-label],[title]')].forEach(el=>{ if(!el.getAttribute || skip(el)) return;
      ATTRS.forEach(a=>{ const v=el.getAttribute(a); if(v && HAN.test(v)){ const t=tr(v); if(t===v) return; const o=origAttr.get(el)||{}; if(!(a in o)) o[a]=v; origAttr.set(el,o); el.setAttribute(a, t); } }); });
  }
  function fix(n){ const v=n.nodeValue; if(!HAN.test(v) || skip(n.parentElement)) return; const t=tr(v); if(t===v) return; if(!origText.has(n)) origText.set(n, v); n.nodeValue = t; }
  function restore(){ origText.forEach((v,n)=>{ if(n.isConnected) n.nodeValue=v; }); origText.clear(); origAttr.forEach((o,el)=>{ if(el.isConnected) for(const a in o) el.setAttribute(a,o[a]); }); origAttr.clear(); }
  new MutationObserver(ms=>{ if(lang!=='en') return; for(const m of ms){ if(m.type==='characterData') fix(m.target); else m.addedNodes.forEach(walk); } })
    .observe(document.documentElement, {subtree:true, childList:true, characterData:true});
  function setLang(l){ lang=l; document.documentElement.lang = l==='en'?'en':'ko'; if(l==='en') walk(document.body); else restore(); }
  ['kr','en'].forEach(id=>{ const b=document.getElementById('lang-'+id); if(!b) return; b.setAttribute('aria-pressed', String(lang===id)); b.addEventListener('click', ()=>setLang(id)); });
  window.addEventListener('message', e=>{ const d=e.data; if(d && d.type==='poe2-lang' && (d.lang==='en'||d.lang==='kr') && d.lang!==lang){ const b=document.getElementById('lang-'+d.lang); if(b) b.click(); else setLang(d.lang); } });
  setLang(lang);
})();
