<title>POE2 Recipe Discovery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: paste box (left) → item card with every line labelled (right), then a per-modifier analysis list. Same dark system as the recipes page. */
:root{
  --bg:#13151a; --panel:#1b1e25; --panel-2:#22262f; --line:#2e333e; --fg:#e8e3d8; --muted:#959ba6; --faint:#6b717c;
  --rare:#ead77f; --warn:#e3806f; --ok:#8fcf9a; --focus:#f2e6c4; --ink:#14161a; --pre:#e88a7a; --suf:#7fa6ff;
  --fr:#c9b27a; --des:#c08cf0; --ess:#9fd8b0; --oth:#e0a46a;
  --f-display:"Gowun Batang", "Apple SD Gothic Neo", serif;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 48px;max-width:1320px;margin:0 auto}
h1{margin:0;font-family:var(--f-display);font-size:22px;text-wrap:balance}
.rhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 4px}
.beta{font-size:12px;color:var(--rare);border:1px solid color-mix(in srgb,var(--rare) 45%,var(--line));border-radius:999px;padding:3px 10px;white-space:nowrap}
.rsteps{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;counter-reset:rs}
.rsteps li{counter-increment:rs;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.rsteps li::before{content:counter(rs);flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.rsteps li b{display:block;color:var(--fg);font-weight:600}
.rsteps li.on{border-color:var(--rare)}.rsteps li.on::before{background:var(--rare);color:var(--ink);border-color:var(--rare)}
.rsteps li.done::before{content:'✓';background:var(--ok);color:var(--ink);border-color:var(--ok)}
@media (max-width:760px){.rsteps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.itabs{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 10px;border-bottom:1px solid var(--line)}
.itabs button{border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font:inherit;font-size:13.5px;padding:8px 14px;cursor:pointer;margin-bottom:-1px}
.itabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--rare);font-weight:600}
.itabs button small{margin-left:6px;font-size:11px;color:var(--faint)}
.ipane{display:flex;flex-direction:column;gap:8px}
.ihelp{margin:0;color:var(--muted);font-size:12.5px;line-height:1.55}
.ufield{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.ufield input{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--fg);font:inherit;font-size:13px}
.uq{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.uq .empty{color:var(--faint)}
.bsteps{margin:0;padding-left:20px;font-size:13px;line-height:1.7;color:var(--fg)}
.bfrom{font-size:12.5px;color:var(--ok)}
.fb{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fb h3{margin:0;font-size:15px}
.fb textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 10px;color:var(--fg);font:inherit;font-size:13px;resize:vertical}
.fb .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lead{margin:0 0 14px;color:var(--muted);font-size:13px;max-width:70ch}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--rare);color:var(--ink);border-color:var(--rare);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:stretch}   /* left and right boxes always the same height (사용자 2026-11-11) */
@media (max-width:860px){.top{grid-template-columns:minmax(0,1fr)}}
.paste{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.paste textarea{width:100%;min-height:300px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:10px;font-family:var(--f-mono);font-size:12px;line-height:1.5}
.paste .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.paste .hint{font-size:12px;color:var(--faint)}
.samples{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.samples select{max-width:100%;min-width:0;flex:1 1 260px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:12px}
.chip:hover{color:var(--fg);border-color:var(--muted)}
.err{color:var(--warn);font-size:13px}
/* summary */
.sumx{display:flex;flex-wrap:wrap;gap:6px 10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13.5px}.sx{border:1px solid var(--line);border-radius:6px;padding:3px 10px;color:var(--text)}.sx b{color:var(--rare,#e2c27a);font-weight:600}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sum-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.sum-h h2{margin:0;font-family:var(--f-display);font-size:19px;color:var(--rare)}
.sum-h .sub{color:var(--muted);font-size:13px}
.slots{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.slot{display:flex;align-items:center;gap:6px}
.pips{display:inline-flex;gap:3px}
.pip{width:12px;height:12px;border-radius:3px;border:1px solid var(--line)}
.pip.p{background:var(--pre);border-color:var(--pre)} .pip.s{background:var(--suf);border-color:var(--suf)}
.pip.fr{box-shadow:inset 0 0 0 2px var(--fr)}
.traces{padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px}
.traces h3,.mods h3{margin:0;font-size:12px;letter-spacing:.06em;color:var(--faint);font-weight:600}
.trace{display:flex;gap:8px;font-size:13px;line-height:1.45}
.trace .dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--muted)}
.trace b{font-weight:600}
.empty{padding:28px 16px;color:var(--faint);text-align:center;font-size:13px}
/* per-mod analysis */
.mods{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.mods-h{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.btn.primary.soft{opacity:.55}
.mkwarn{margin-top:8px;padding:8px 12px;border:1px solid var(--warn,#e0a050);border-radius:8px;color:var(--text);font-size:13.5px}
@keyframes flashy{0%,100%{box-shadow:none}30%,70%{box-shadow:0 0 0 3px var(--warn,#e0a050)}}
.flash{animation:flashy 1.2s ease 2;border-radius:8px}
.needguide{font-size:13px;color:var(--text);background:color-mix(in srgb,var(--gold,#c8a95a) 10%,transparent);border:1px solid color-mix(in srgb,var(--gold,#c8a95a) 40%,transparent);border-radius:8px;padding:6px 10px;flex-basis:100%}
.legend{font-size:12px;color:var(--faint)}
.mod{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,2fr);gap:6px 16px}
.mod.p{border-left-color:var(--pre)} .mod.s{border-left-color:var(--suf)}
@media (max-width:760px){.mod{grid-template-columns:minmax(0,1fr)}}
.mt{display:flex;flex-direction:column;gap:4px;min-width:0}
.ml{font-size:14px;color:#a9a9ff;white-space:pre-line;overflow-wrap:anywhere}
.mod.fr .ml{color:var(--fr)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted);white-space:nowrap}
.tag.p{color:var(--pre);border-color:color-mix(in srgb,var(--pre) 45%,var(--line))}
.tag.s{color:var(--suf);border-color:color-mix(in srgb,var(--suf) 45%,var(--line))}
.tag.fr{color:var(--fr);border-color:color-mix(in srgb,var(--fr) 45%,var(--line))}
.tag.d{color:var(--des);border-color:color-mix(in srgb,var(--des) 45%,var(--line))}
.tag.e{color:var(--ess);border-color:color-mix(in srgb,var(--ess) 45%,var(--line))}
.tag.x{color:var(--oth);border-color:color-mix(in srgb,var(--oth) 45%,var(--line))}
.tag.q{color:var(--rare);border-color:color-mix(in srgb,var(--rare) 45%,var(--line))}
.nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px 12px}
@media (max-width:1000px){.nums{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.nums{grid-template-columns:repeat(2,minmax(0,1fr))}}
.num{display:flex;flex-direction:column;min-width:0}
.num small{font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num b{font-family:var(--f-mono);font-size:13px;font-weight:600}
.num i{font-style:normal;font-size:11px;color:var(--faint)}
.num b.r0{color:var(--ok)} .num b.r1{color:var(--fg)} .num b.r2{color:var(--rare)} .num b.r3{color:var(--warn)}
.bar{height:4px;border-radius:2px;background:var(--panel-2);overflow:hidden;margin-top:3px}
.bar span{display:block;height:100%;background:var(--muted)}
.note{grid-column:1/-1;font-size:12px;color:var(--muted)}
.other{background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.other .k{font-size:11px;color:var(--faint);margin-right:6px}
.bad{color:var(--warn)}
.draft{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--rare) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--rare) 40%,var(--line));border-radius:10px;padding:12px 14px}
.draft > div{flex:1 1 320px;min-width:0}
.need{grid-column:2;grid-row:1/span 3;justify-self:end;align-self:center;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
@media (max-width:640px){.need{grid-column:1/-1;grid-row:auto;justify-self:start;align-items:flex-start}}
.tsel.big{font-size:14px;padding:7px 10px;min-width:180px;border-color:var(--ok);border-radius:8px}
.need .buyl{flex-basis:100%;justify-content:flex-end}
.tsel.tfix{display:inline-block;text-align:center;color:var(--muted);border-color:var(--line)}
.needb{border:1px solid var(--gold,#c8a95a);background:transparent;color:var(--gold,#e2c27a);border-radius:8px;padding:7px 16px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;min-width:132px}
.needb:hover{background:color-mix(in srgb,var(--gold,#c8a95a) 14%,transparent)}
.needb.lock{cursor:default;text-align:center}
.lvg{display:inline-flex;gap:0}.lvg .needb{min-width:64px;padding:7px 10px;border-radius:0;margin-left:-1px}.lvg .needb:first-child{border-radius:8px 0 0 8px}.lvg .needb:last-child{border-radius:0 8px 8px 0}
.lvg .needb[data-lv$=":soft"][aria-pressed="true"]{background:color-mix(in srgb,var(--gold,#c8a95a) 22%,transparent);border-color:var(--gold,#c8a95a)}
.lvg .needb[data-lv$=":junk"][aria-pressed="true"]{background:color-mix(in srgb,var(--mute,#888) 18%,transparent);border-color:var(--mute,#888);color:var(--mute,#aaa)}
.tsel{padding:2px 6px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;font:inherit;font-size:12px}
.buyl{display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.needb[aria-pressed="true"]{background:color-mix(in srgb,var(--ok) 26%,transparent);border-color:var(--ok);color:var(--text)}
.mod.junkr{opacity:.62}
.confirm{margin-bottom:10px;background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.confirm .cr{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.confirm input[type=number]{width:70px;padding:3px 6px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;font:inherit}
.confirm .hint{font-size:12px;color:var(--muted)}
.draft p{margin:2px 0 0;font-size:12.5px;color:var(--muted);max-width:90ch}
#mkmsg{font-size:13px}
.mp{display:inline-flex;align-items:center;gap:6px;margin-left:auto;font-size:12px;color:var(--muted)}.mp input{width:84px;padding:3px 6px;font:inherit;background:transparent;color:inherit;border:1px solid currentColor;border-radius:4px;opacity:.85}
.costl{margin:4px 0 0;font-size:12px;color:var(--muted)}.costl.over{color:#e0a060}
#mkmsg .ok{color:var(--ok)}
.pv{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.pv-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.pv-h span{font-size:12px;color:var(--muted)}
#pvf{width:100%;height:max(520px, calc(100vh - 32px));border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#pvact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.check{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.ch-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}.ch-h span{color:var(--muted);font-size:12.5px}
.check ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.check li{display:flex;gap:8px;font-size:13px;line-height:1.45}.check li .ic{flex:none;width:16px;text-align:center;font-weight:700}
.flow{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.flow.bad{border-color:var(--warn)}
.flow table{border-collapse:collapse;font-size:12.5px;width:100%;max-width:640px}.flow th,.flow td{padding:4px 8px;text-align:right;border-bottom:1px solid var(--line)}.flow th:first-child,.flow td:first-child{text-align:left}
.flow th{color:var(--muted);font-weight:500}.flow .iss{color:var(--warn);font-size:13px;margin:0;padding-left:18px}.flow .wait{color:var(--muted);font-size:13px}
.check li.err .ic{color:var(--warn)}.check li.warn .ic,.wn{color:var(--rare)}.check li.ok .ic{color:var(--ok)}
</style>

<div class="wrap">
  <div class="rhead"><h1 id="h1"></h1><span class="beta" id="beta"></span></div>
  <p class="lead" id="lead"></p>
  <ol class="rsteps" id="rsteps"></ol>
  <div class="itabs" role="tablist" id="itabs"></div>
  <div class="top">
    <div class="paste">
      <section class="ipane" data-ipane="url" hidden>
        <p class="ihelp" id="u-help"></p>
        <label class="ufield"><span id="u-l"></span><input type="url" id="u-url" placeholder="https://www.youtube.com/watch?v=…  /  https://…" autocomplete="off"></label>
        <label class="ufield"><span id="u-nl"></span><input type="text" id="u-note" autocomplete="off"></label>
        <div class="row"><button type="button" class="btn primary" id="u-go" disabled></button><span class="hint" id="u-hint"></span></div>
        <div class="uq"><b id="u-qh"></b><div class="empty" id="u-qe"></div></div>
      </section>
      <section class="ipane" data-ipane="build" hidden>
        <p class="ihelp" id="b-help"></p>
        <ol class="bsteps" id="b-steps"></ol>
        <div class="row"><button type="button" class="btn primary" id="b-go"></button></div>
        <div class="bfrom" id="b-from" hidden></div>
      </section>
      <section class="ipane" data-ipane="item">
      <p class="ihelp" id="i-help"></p>
      <textarea id="txt" spellcheck="false" aria-label="item text"></textarea>
      <div class="row">
        <button type="button" class="btn primary" id="go"></button>
        <button type="button" class="btn" id="clr"></button>
        <span class="hint" id="hint"></span>
        <label class="mp"><span id="mpl"></span> <input id="mp" type="number" min="0" step="any" inputmode="decimal" placeholder="div"></label>
      </div>
      <div class="samples" id="samples"></div>
      <div id="msg"></div>
      </section>
    </div>
    <div class="sum" id="sum"></div>
  </div>
  <div class="mods" id="mods"></div>
  <section class="fb" id="fb" hidden>
    <h3 id="fb-h"></h3>
    <p class="ihelp" id="fb-help"></p>
    <textarea id="fb-txt" rows="4"></textarea>
    <div class="row"><button type="button" class="btn primary" id="fb-go"></button><span class="hint" id="fb-msg"></span></div>
  </section>
</div>

<script src="sim.js"></script>
<script src="graphify.js"></script>
<script>
const S = { lang:'en', index:null, cache:{}, last:null, txt:'', itab:'item', need:new Set(), soft:new Set(), okQR:false, tsel:{}, buy:new Set() };
try{ const u=new URLSearchParams(location.search).get('lang'); S.lang = u || localStorage.getItem('poe2lang') || 'en'; }catch(e){}
if(S.lang!=='kr') S.lang='en';
const KR = () => S.lang==='kr', L = (kr,en) => KR()?kr:en;
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const pct = (p, d) => p==null ? '—' : p>=0.9995 ? '100%' : p<=0 ? '0%' : (p*100 < 0.01 ? '<0.01%' : (p*100).toFixed(d ?? (p<0.01?2:p<0.1?1:0))+'%');
const tries = p => p>0 && p<1 ? Math.round(1/p).toLocaleString() : null;

/* ---------- text → template matching (same rules as the emulator's item import) ---------- */
const reEsc = t => t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const NUM = '([+-]?\\d+(?:\\.\\d+)?)';
function tplRe(line){ const ranges=[]; let src='';
  line.split(/(\(\d+(?:\.\d+)?—\d+(?:\.\d+)?\))/).forEach(part=>{ const m = part.match(/^\((\d+(?:\.\d+)?)—(\d+(?:\.\d+)?)\)$/);
    if(m){ ranges.push([+m[1],+m[2]]); src+=NUM; } else src += reEsc(part).replace(/\d+(?:\.\d+)?/g, x=>{ ranges.push([+x,+x]); return NUM; }); });
  return {re:new RegExp('^'+src.replace(/\\\+(?=\()/g,'\\+?')+'$','i'), ranges}; }
function matcher(data){ if(data._mx) return data._mx; const list=[];
  data.groups.forEach((g,gi)=>{ if(!['n','d','e','x','c'].includes(g.s)) return;
    g.t.forEach((t,ti)=>{ for(const k of [4,5]){ list.push({gi,ti,s:g.s,lines:t[k].split('\n').map(tplRe)}); } }); });
  return data._mx = list; }
function cleanLine(l){ return l.replace(/(\d)\(-?\d+(?:\.\d+)?-\d+(?:\.\d+)?\)/g,'$1').replace(/\s*\((implicit|fractured|desecrated|rune|enchant|crafted|augmented|unmet|[ㄱ-힝\s]+)\)\s*$/i,'').trim(); }
function tagOf(l){ const m=l.match(/\((implicit|fractured|desecrated|rune|enchant|crafted)\)\s*$/i)||l.match(/\((고정|분열|훼손|룬|인챈트|부여|제작)[^)]*\)\s*$/); if(!m) return ''; const k=m[1].toLowerCase(); return ({고정:'implicit',분열:'fractured',훼손:'desecrated',룬:'rune',인챈트:'enchant',부여:'enchant',제작:'crafted'})[k]||k; }
function fitScore(ranges, vals){ let sc=0; ranges.forEach((r,i)=>{ const v=Math.abs(+vals[i]); const a=Math.min(r[0],r[1]), b=Math.max(r[0],r[1]); if(v<a) sc+=(a-v)/(Math.abs(a)||1); else if(v>b) sc+=(v-b)/(Math.abs(b)||1); }); return sc; }
function findBase(lines){ let best=null;
  for(const g of S.index.groups) for(const c of g.classes) (c.names||[]).forEach((nm,bi)=>{ for(const n of nm){ if(!n) continue;
    for(const l of lines){ const exact=l===n, part=!exact && l.includes(n); if(exact||part){ const sc=(exact?1000:0)+n.length; if(!best||sc>best.sc) best={sc,cls:c.id,bi,c}; } } } });
  return best; }
async function loadCls(id){ if(!S.cache[id]) S.cache[id] = await fetch(`data/c/${encodeURIComponent(id)}.json`).then(r=>r.json()); return S.cache[id]; }

/* ---------- parse ---------- */
async function parse(txt){
  const raw = txt.replace(/\r/g,'').split('\n').map(x=>x.trim());
  const secs=[[]]; raw.forEach(l=>{ if(/^-{4,}$/.test(l)) secs.push([]); else if(l) secs[secs.length-1].push(l); });
  const head = secs[0]||[];
  const rl = head.find(l=>/^(Rarity|.*희귀도)\s*:/i.test(l)); const rv=(rl||'').split(':').slice(1).join(':').trim().toLowerCase();
  const rarity = /rare|희귀/.test(rv)?'rare':/magic|마법/.test(rv)?'magic':/unique|고유/.test(rv)?'unique':'normal';
  if(rarity==='unique') return {err:L('고유 아이템은 제작 아이템이 아니라서 역산 불가','Unique items are not crafted, so there is nothing to reverse.')};
  const nameLines = head.filter(l=>!/:/.test(l));
  const hit = findBase(nameLines.length?nameLines:head);
  if(!hit) return {err:L('베이스 아이템 이름 없음 · 아이템 이름 줄까지 필요','Base item not found. Paste the whole item text, including the name lines.')};
  const D = await loadCls(hit.cls), b = D.bases[hit.bi];
  const all = secs.flat();
  const num = re => { for(const l of all){ const m=l.match(re); if(m) return +m[1]; } return null; };
  const ilvl = num(/^(?:Item Level|아이템 레벨)\s*:\s*(\d+)/i) ?? 82;
  const qual = num(/^(?:Quality|품질|퀄리티)[^:]*:\s*\+?(\d+)%/i);
  const qualType = (all.find(l=>/^(?:Quality|품질|퀄리티)\s*\(/i.test(l))||'').match(/\(([^)]+)\)/)?.[1] || null;
  const QTK = {attack:'공격',caster:'시전',life:'생명력',mana:'마나',defences:'방어',physical:'물리',fire:'화염',cold:'냉기',lightning:'번개',chaos:'카오스',speed:'속도',attribute:'능력치',minion:'소환수'};
  const qTag = qualType ? Object.keys(QTK).find(k=>{ const q=qualType.toLowerCase(); return q.includes(k) || q.includes(k.replace(/s$/,'')) || qualType.includes(QTK[k]); }) || null : null;
  const corrupted = all.some(l=>/^(Corrupted|타락)$/i.test(l));
  const sanctified = all.some(l=>/^(Sanctified|축성됨|축성)$/i.test(l));
  const exceptional = /exceptional|특출난/i.test(nameLines.join(' '));
  const sockL = all.find(l=>/^(Sockets|소켓)\s*:/i.test(l)); const sockets = sockL ? (sockL.split(':')[1].match(/S/gi)||[]).length : null;
  const ilIdx = secs.findIndex(s=>s.some(l=>/^(Item Level|아이템 레벨)\s*:/i.test(l)));
  const lines = (ilIdx>=0 ? secs.slice(ilIdx+1) : secs.slice(1)).flat()
    .filter(l=>!/^(Sanctified|축성됨|축성|Corrupted|타락|Unidentified|미확인|Mirrored|복제됨)$/i.test(l) && !/^(Note|노트|Sockets|소켓)\s*:/i.test(l) && !/^".*"$/.test(l));
  const MX = matcher(D), mods=[], other=[], used=new Set(); let hint=null;
  for(let i=0;i<lines.length;i++){
    const l0 = lines[i];
    if(l0.startsWith('{')){   // advanced copy (Ctrl+Alt+C) header: side, tier number, affix name
      hint = { side:/Prefix|접두/.test(l0)?'p':/Suffix|접미/.test(l0)?'s':null, fr:/Fractured|분열/.test(l0), des:/Desecrated|훼손/.test(l0),
        tier:+((l0.match(/(?:Tier|등급|티어)\s*:\s*(\d+)/i)||[])[1]||0) || null, name:(l0.match(/["“]([^"”]+)["”]/)||[])[1]||null,
        imp:/Implicit|고정/.test(l0) };
      continue; }
    const tag = tagOf(l0);
    if(tag==='implicit' || hint?.imp){ other.push({k:'imp', l:cleanLine(l0)}); hint=null; continue; }
    if(tag==='rune'){ other.push({k:'rune', l:cleanLine(l0)}); hint=null; continue; }
    if(/unrevealed|공개되지 않은|미공개/i.test(l0)){ mods.push({unrev:true, side:hint?.side || null, l:l0}); hint=null; continue; }
    const l = cleanLine(l0); let best=null;
    for(const c of MX){
      if(tag==='enchant' ? c.s!=='c' : c.s==='c') continue;
      const vals=[]; let ok=true;
      for(let k=0;k<c.lines.length;k++){ const ln = k===0 ? l : cleanLine(lines[i+k]||''); const m = ln.match(c.lines[k].re); if(!m){ ok=false; break; } vals.push(...m.slice(1)); }
      if(!ok) continue;
      const g=D.groups[c.gi], t=g.t[c.ti];
      if(hint?.side && g.g!==hint.side) continue;
      if(used.has(c.gi)) continue;
      const ranges = c.lines.flatMap(x=>x.ranges);
      const boost = qTag && qual && g.tg.includes(qTag) ? 1+qual/100 : 1;   // catalyst quality scales these values up
      const bv = vals.map((v,vi)=>ranges[vi] && ranges[vi][0]!==ranges[vi][1] ? +v/boost : +v);
      let sc = fitScore(ranges, bv) * 10 + ({n:0,d:tag==='desecrated'||hint?.des?-1:2,e:1,x:1.5,c:0})[c.s] - c.lines.length*0.5;
      if((tag==='desecrated'||hint?.des) && c.s!=='d') sc+=0.5;
      if(hint?.name && (t[2]===hint.name || t[3]===hint.name || t[2].replace(/^-\s*/,'')===hint.name)) sc-=5;
      if(hint?.tier && c.ti+1===hint.tier) sc-=0.3;
      if(!best || sc<best.sc) best={sc,c,vals:bv,raw:vals,ranges,boost};
    }
    if(!best){ other.push({k:'?', l:l0}); hint=null; continue; }
    const {c,vals,ranges,boost}=best;
    if(c.s==='c'){ other.push({k:'ench', l}); i+=c.lines.length-1; hint=null; continue; }
    const text = [l, ...Array.from({length:c.lines.length-1},(_,k)=>cleanLine(lines[i+1+k]||''))].join('\n');
    // roll inside the tier range; values outside it were pushed by quality, sanctification or corruption
    let roll=null, out=false; const first = ranges.findIndex(r=>r[0]!==r[1]);
    if(first>=0){ const r=ranges[first], v=Math.abs(+vals[first]), a=Math.min(...r), bb=Math.max(...r), tol=boost>1?1/boost+0.5:1e-9; out = v<a-tol || v>bb+tol; roll = out ? null : Math.max(0,Math.min(1,bb===a?1:(v-a)/(bb-a))); }
    // a value above every tier of its modifier, with the same modifier on the other side too (e.g. item rarity is both a prefix
    // and a suffix): the game shows the two as one summed line → split it into the prefix + suffix pair whose ranges fit (사용자 2026-11-11)
    if(out && c.lines.length===1 && !hint && !tag && c.s==='n' && first>=0){
      const v=Math.abs(+best.raw[first]), src=c.lines[0].re.source, gA=D.groups[c.gi], rng=x=>{ const r=x.lines[0].ranges[0]; return [Math.min(...r), Math.max(...r)]; };
      const cands = MX.filter(x=>x.lines.length===1 && x.lines[0].re.source===src && x.s==='n' && !used.has(x.gi) && D.groups[x.gi].t[x.ti][0]<=ilvl && D.groups[x.gi].t[x.ti][1]>0);
      let pair=null;
      for(const a of cands.filter(x=>D.groups[x.gi].g==='p')) for(const b2 of cands.filter(x=>D.groups[x.gi].g==='s')){
        const [a1,a2]=rng(a), [b1,b2b]=rng(b2); if(v<a1+b1-1e-9 || v>a2+b2b+1e-9) continue;
        const sc=Math.abs(v-(a1+a2+b1+b2b)/2); if(!pair || sc<pair.sc) pair={sc,a,b:b2}; }
      if(pair && (pair.a.gi===c.gi || pair.b.gi===c.gi || D.groups[pair.a.gi].f.some(f=>gA.f.includes(f)) || D.groups[pair.b.gi].f.some(f=>gA.f.includes(f)) || true)){
        const [a1,a2]=rng(pair.a), [b1,b2b]=rng(pair.b), tot=v-a1-b1, span=(a2-a1)+(b2b-b1), fr0=span>0?Math.max(0,Math.min(1,tot/span)):1;
        for(const x of [pair.a, pair.b]){ const [x1,x2]=rng(x), part=Math.round(x1+(x2-x1)*fr0);
          used.add(x.gi); mods.push({gi:x.gi, ti:x.ti, side:D.groups[x.gi].g, q:false, fr:false, desTag:false, crafted:false, roll:fr0, out:false, split:v, l:text.replace(/\d+(\.\d+)?/, String(part)), hintTier:null}); }
        hint=null; continue; }
    }
    used.add(c.gi);
    mods.push({gi:c.gi, ti:c.ti, side:D.groups[c.gi].g, q:boost>1, fr: tag==='fractured' || !!hint?.fr, desTag: tag==='desecrated' || !!hint?.des, crafted: tag==='crafted', roll, out, l:text, hintTier:hint?.tier||null});
    i += c.lines.length-1; hint=null;
  }
  return {sockets, qTag, cls:hit.cls, bi:hit.bi, cat:S.index.groups.find(g=>g.classes.some(c=>c.id===hit.cls))?.id, clsName:hit.c, D, b, rarity, ilvl, qual, qualType, corrupted, sanctified, exceptional, name: rarity==='rare' && nameLines.length>=2 ? nameLines[0] : null, mods, other};
}

/* ---------- analyse ---------- */
const SRC = { n:['일반 속성','Regular'], d:['훼손 전용','Desecrated only'], e:['에센스 전용','Essence only'], x:['별세계','Otherworldly'] };
const LORDS = { amanamu:['아마나무','Amanamu'], kurgal:['쿠르갈','Kurgal'], ulaman:['울라만','Ulaman'] };
function analyse(it){
  const D=it.D, b=it.b, cap = it.cat==='jewel' ? {p:2, s:2} : {p:3+(b.pd||0), s:3+(b.sd||0)};   // jewels: 2 prefixes / 2 suffixes
  if(it.rarity==='magic'){ cap.p=1; cap.s=1; }
  const flat = D.groups.filter(g=>g.s==='n').every(g=>g.t.every(x=>!(x[1]>1)));
  const real = it.mods.filter(m=>m.gi!=null);
  const cnt = {p:it.mods.filter(m=>m.side==='p').length, s:it.mods.filter(m=>m.side==='s').length};
  if(it.rarity==='rare' && it.cat==='jewel'){ for(const sd of ['p','s']) if(it.mods.filter(m=>m.side===sd).length===cap[sd]+1){ cap[sd]++; cap.contempt=sd; } }   // a 3rd line on a jewel side came through Potent Liquid Contempt
  else if(it.rarity==='rare' && it.mods.filter(m=>m.side==='s').length===cap.s+1){ cap.s++; cap.serle=true; }   // Serle's Triumph adds a fourth suffix
  const rows = it.mods.map((m,j)=>{
    if(m.unrev) return {m, unrev:true};
    const g=D.groups[m.gi], t=g.t[m.ti];
    const tiersHere = g.t.map((x,ti)=>({ti, l:x[0], w:x[1]})).filter(x=>x.l<=it.ilvl && x.w>0);
    const row = {m, g, t, tierNo:m.ti+1, tierCnt:g.t.length, avail:tiersHere.length, src:g.s};
    // the source the item text and the modifier's pool point to
    if(m.fr) row.how = 'fr'; else if(m.desTag || g.s==='d') row.how='d'; else if(g.s==='e') row.how='e'; else if(g.s==='x') row.how = /Otherworldly/.test(g.sub[1]) ? 'x' : /Liquid Emotions/.test(g.sub[1]) ? 'lq' : 'sc'; else row.how='n';
    row.core = g.s==='x' && !/Otherworldly|Liquid Emotions/.test(g.sub[1]) ? g.sub : null;   // runes and soul cores only: liquids are used on the item, never socketed
    row.lord = Object.keys(LORDS).find(k=>g.tg.includes(k+'_mod')) || null;
    // a liquid is used on the item and always gives its modifier: no weight needed
    if(g.s!=='n'){ row.unknown = g.s==='x' && row.how!=='lq' ? 'x' : null; return row; }
    if(flat){ row.unknown='flat'; return row; }
    if(g.t.every(x=>!(x[1]>1))){ row.unknown='w1'; }
    // weights: tier vs group, group vs its side (other modifiers' families taken out, as if this one were added last)
    const others = real.filter((_,k)=>k!==real.indexOf(m));
    const F = new Set(); others.forEach(o=>D.groups[o.gi].f.forEach(f=>F.add(f)));
    const gW = tiersHere.reduce((s,x)=>s+x.w,0), hitW = tiersHere.filter(x=>x.ti<=m.ti).reduce((s,x)=>s+x.w,0);
    row.tierShare = gW ? hitW/gW : 0;     // this tier or better, among this modifier's tiers
    row.wTier = t[1]; row.wGroup = gW;
    const sideW = side => { let W=0; D.groups.forEach((x,xi)=>{ if(x.s!=='n' || x.g!==side || x.f.some(f=>F.has(f))) return; x.t.forEach(y=>{ if(y[0]<=it.ilvl && y[1]>0) W+=y[1]; }); }); return W; };
    const oCnt = {p:others.filter(o=>o.side==='p').length + it.mods.filter(o=>o.unrev && o.side==='p').length, s:others.filter(o=>o.side==='s').length + it.mods.filter(o=>o.unrev && o.side==='s').length};
    const wS = sideW(m.side), wO = oCnt[m.side==='p'?'s':'p'] < cap[m.side==='p'?'s':'p'] ? sideW(m.side==='p'?'s':'p') : 0;
    row.pOmen = wS ? hitW/wS : 0;         // exalt with a side omen
    row.pAny = (wS+wO) ? hitW/(wS+wO) : 0; // plain exalt, both sides open
    row.groupShare = wS ? gW/wS : 0;      // any tier of this modifier, on its side
    // Perfect Exalted Orb (min level 50) drops low tiers, which lifts high tiers
    const sideW50 = side => { let W=0; D.groups.forEach(x=>{ if(x.s!=='n' || x.g!==side || x.f.some(f=>F.has(f))) return; const top=x.t.findIndex(y=>y[0]<=it.ilvl && y[1]>0); x.t.forEach((y,yi)=>{ if(y[0]<=it.ilvl && y[1]>0 && (y[0]>=50 || yi===top)) W+=y[1]; }); }); return W; };
    const top=g.t.findIndex(y=>y[0]<=it.ilvl && y[1]>0); const hit50 = tiersHere.filter(x=>x.ti<=m.ti && (x.l>=50 || x.ti===top)).reduce((s,x)=>s+x.w,0);
    const w50 = sideW50(m.side); row.pPerfect = w50 ? hit50/w50 : 0;
    return row;
  });
  // what the item text says about how it was made
  const tr=[];
  const fr = rows.filter(r=>r.m.fr);
  if(fr.length) tr.push({c:'var(--fr)', t:L(`<b>분열</b> — ${fr.map(r=>esc(short(r))).join(', ')} 고정. 분열의 오브는 속성 4개 이상 희귀 아이템에 쓰이므로, 이 옵션이 먼저 만들어진 뒤 분열된 것.`,`<b>Fractured</b> — ${fr.map(r=>esc(short(r))).join(', ')} locked. Fracturing needs a rare with 4+ modifiers, so this line was made first, then fractured.`)});
  const des = rows.filter(r=>r.how==='d' || r.unrev);
  if(des.length){ const lords=[...new Set(des.map(r=>r.lord).filter(Boolean))].map(k=>LORDS[k][KR()?0:1]);
    tr.push({c:'var(--des)', t:L(`<b>훼손</b> — 옵션 ${des.length}개. 뼈로 훼손한 뒤 심연의 우물에서 공개된 옵션이에요.${lords.length?` 군주 전용 옵션(${lords.join(', ')})이 보이면 그 군주의 징조를 썼을 가능성이 높음.`:''}${rows.some(r=>r.unrev)?' 아직 공개 안 된 훼손 옵션이 있음':''}`,`<b>Desecrated</b> — ${des.length} line(s), revealed at the Well of Souls after a bone.${lords.length?` Lord-only modifiers (${lords.join(', ')}) suggest that lord's omen was used.`:''}${rows.some(r=>r.unrev)?' One desecrated modifier is still unrevealed.':''}`)}); }
  const ess = rows.filter(r=>r.how==='e');
  if(ess.filter(r=>!/^(Lesser |Greater )?Essence/.test(r.t[3]) || /^Perfect/.test(r.t[3])).length>1) tr.push({c:'var(--ess)', t:L(`<b>제작 옵션 ${ess.length}개</b> — 에센스 옵션은 보통 옵션 1개까지라, 두 번째는 아스트리드의 창의성 룬을 끼운 상태에서 붙였을 것`,`<b>${ess.length} crafted lines</b> — essence lines are normally capped at one, so Astrid's Creativity was socketed for the second.`)});
  if(ess.length) tr.push({c:'var(--ess)', t:L(`<b>에센스</b> — ${ess.map(r=>esc(short(r))).join(', ')}. 일반 옵션 풀에는 없는 에센스 전용 옵션이라, 에센스로 붙인 게 확실해요 (${ess.map(r=>r.g.sub[0]).filter((x,i,a)=>a.indexOf(x)===i).join(', ')}).`,`<b>Essence</b> — ${ess.map(r=>esc(short(r))).join(', ')}. Essence-only modifiers, so an essence put them there (${ess.map(r=>r.g.sub[1]).filter((x,i,a)=>a.indexOf(x)===i).join(', ')}).`)});
  const oth = rows.filter(r=>r.how==='x');
  if(oth.length) tr.push({c:'var(--oth)', t:L(`<b>별세계 속성</b> — 옵션 ${oth.length}개. 훼손 뼈에서 낮은 확률로 붙는 옵션.`,`<b>Otherworldly</b> — ${oth.length} line(s), a rare outcome of a desecration bone.`)});
  const cores = [...new Set(rows.filter(r=>r.how==='sc' || (r.m.fr && r.core)).map(r=>r.core[KR()?0:1]))];
  if(cores.length) tr.push({c:'var(--oth)', t:L(`<b>증강물 전용 옵션</b> — ${cores.map(x=>'「'+esc(x)+'」').join(', ')} 옵션 ${rows.filter(r=>r.core).length}개. 룬·영혼 핵을 룬 소켓에 끼워야 굴릴 수 있는 옵션이라, 장착한 뒤 카오스·엑잘로 붙인 것.`,`<b>Augment-only lines</b> — ${rows.filter(r=>r.core).length} from ${cores.join(', ')}: they only roll once that rune or soul core is socketed.`)});
  if(it.qTag && it.qual) tr.push({c:'var(--rare)', t:L(`<b>기폭제 퀄리티 ${it.qual}%</b> — ${esc(it.qualType)}. 해당 속성 옵션 값은 퀄리티를 걷어낸 원래 값으로 티어를 판정.`,`<b>Catalyst quality ${it.qual}%</b> (${esc(it.qualType)}): matching modifiers were tiered from their values before quality.`)});
  const outv = rows.filter(r=>r.m.out);
  if(outv.length) tr.push({c:'var(--rare)', t: it.qualType && !it.qTag ? L(`<b>${esc(it.qualType)} 퀄리티</b> — 옵션 ${outv.length}개의 값이 티어 범위를 넘음. 기폭제 퀄리티가 적용된 값.`,`<b>${esc(it.qualType)} quality</b> — ${outv.length} value(s) above the tier range: catalyst quality applied.`)
    : it.sanctified ? L(`<b>축성</b> — 옵션 ${outv.length}개의 값이 티어 범위를 벗어남. 축성으로 값이 바뀐 것.`,`<b>Sanctified</b> — ${outv.length} value(s) outside the tier range, changed by sanctification.`)
    : L(`<b>범위 밖 값</b> — 옵션 ${outv.length}개. 퀄리티(기폭제), 축성 또는 타락 영향.`,`<b>Out-of-range values</b> — ${outv.length} line(s): catalyst quality, sanctification or corruption.`)});

async function run(){
  await S.ready; S.draft=null; S.sent=false; S.need=new Set(); S.soft=new Set(); S.okQR=false; S.tsel={}; S.buy=new Set(); $('#fb').hidden=true;
  const txt = $('#txt').value; if(!txt.trim()){ S.last=null; render(); return; }
  if(!S.index) [S.index, S.craft] = await Promise.all([fetch('data/index.json').then(r=>r.json()), fetch('data/crafting.json').then(r=>r.json())]);
  if(!S.priority) S.priority = await fetch('data/priority.json').then(r=>r.json()).catch(()=>null);
  S.txt = txt;
  try{ const it = await parse(txt); S.last = it.err ? {err:it.err} : {it, an:analyse(it)}; }
  catch(e){ S.last = {err:L('분석 중 오류가 났어요: ','Analysis failed: ')+e.message}; console.error(e); }
  render();
}

// ---------- flowchart first (사용자 확정 2026-11-11) ----------
// the draft → a graph (graphify.js) → every grade simulated (sim.js) → issues (a step with no way on, too many repeats, finished items missing a must-have)
// → only then the grade recipes: the draft is the top grade, lower grades widen the looped lines' tiers (정책 32) with the same step ids
const slimRes = r => ({mean:r.mean, median:r.median, p90:r.p90, p10:r.p10, bases:r.bases, baseDiv:r.baseDiv, use:r.use, useDiv:r.useDiv, reqOk:r.reqOk, missing:r.missing,
  nodes:Object.fromEntries(Object.entries(r.nodes).map(([k,v])=>[k,{reach:v.reach, visits:v.visits, use:v.use, skips:v.skips, byCur:v.byCur, div:v.div}])), edges:r.edges});
function runFlow(it, d){ try{
  if(!window.POE2GRAPH || !window.POE2SIM || !S.prices) return {err:L('시뮬레이터 불러오기 실패','The simulator did not load.')};
  const g = POE2GRAPH.fromDraft(d, it.D, {craft:S.craft, grades:['high','bal','ess']});   // all three grades: the picked tiers, one step wider, two steps wider + keep a miss (사용자 2026-11-11: 티어를 넓히면 얼마나 싸지는지)
  let t=performance.now(), c = POE2GRAPH.check(g, it.D, S.craft, S.prices, POE2SIM, 150);
  const dt=performance.now()-t; if(!c.issues.length && dt<600) c = POE2GRAPH.check(g, it.D, S.craft, S.prices, POE2SIM, Math.min(3000, Math.max(300, Math.round(150*1500/Math.max(dt,1)))));
  const strategies = c.strategies.filter(x=>x.res).map(x=>({id:x.id, params:x.params, hidden:false, res:slimRes(x.res)}));
  const sim = {id:d.id, recipe:d.id, runs:c.strategies[0]?.res?.N||0, generated:new Date().toISOString().slice(0,10), graph:POE2GRAPH.view(g, it.D), strategies};
  const out = {g, res:c.strategies, issues:c.issues};
  if(strategies.length) { const lead = {...d, tierGroup:d.id, tier:g.strategies[0].id, sim:1}; out.lead = {...lead, simInline: strategies.length===c.strategies.length ? sim : {...sim, graph:{...sim.graph, versions:sim.graph.versions.filter(v=>strategies.some(s=>s.id===v.id)), finals:sim.graph.finals.filter(f=>strategies.some(s=>s.id===f.id))}}}; }
  if(!c.issues.length && out.lead) out.group = {...out.lead, grades: g.strategies.slice(1).map(st=>gradeRecipe(d, g, st))};
  return out; }catch(e){ return {err:String(e.message||e)}; } }
function gradeRecipe(d, g, st){ const p=st.params, w = x => { if(!x || x.gi==null) return x; const v=p['t'+x.gi]; return v!=null ? {...x, tmax:+v} : x; };
  const nodes = d.nodes.map(n=>{ if(!n.target) return n; const t={...n.target}; if(t.gi!=null){ const v=p['t'+t.gi]; if(v!=null && n.do!=='essence') t.tmax=+v; }
    if(t.anyOf) t.anyOf=t.anyOf.map(w); if(t.reveal) t.reveal = t.reveal.anyOf ? {...t.reveal, anyOf:t.reveal.anyOf.map(w)} : w(t.reveal); return {...n, target:t}; });
  return {...d, id:d.id+st.id, tierGroup:d.id, tier:st.id, sim:1, nodes}; }
function flowHTML(F){ const VN={high:L('하이엔드','High-end'), bal:L('밸런스','Balance'), ess:L('에센셜','Essential')}, fd = v => v==null ? '—' : v>=100 ? Math.round(v).toLocaleString() : v>=10 ? v.toFixed(0) : v.toFixed(1);
  if(F.err) return `<div class="flow bad"><b>${L('플로우차트','Flowchart')}</b><p class="iss">${esc(F.err)}</p></div>`;
  const rows = F.res.map(x=> x.res ? `<tr><td>${VN[x.id]||x.id}</td><td>${fd(x.res.mean)}</td><td>${fd(x.res.median)}</td><td>${fd(x.res.p90)}</td><td>${x.res.bases.toFixed(1)}</td><td>${x.res.reqOk>=0.98?'✓':Math.round(x.res.reqOk*100)+'%'}</td></tr>` : `<tr><td>${VN[x.id]||x.id}</td><td colspan="5">${L('진행 불가','No way through')}</td></tr>`).join('');
  return `<div class="flow ${F.issues.length?'bad':''}"><div class="ch-h"><b>${L('플로우차트 검사','Flowchart check')}</b><span>${F.issues.length ? L('통과 실패 · 아래 문제를 고쳐야 레시피 생성 가능','Not passed — these need fixing before a recipe is made') : L(`단계 ${F.g.nodes.filter(n=>n.kind==='act').length}개를 실제 확률로 ${(F.res[0]?.res?.N||0).toLocaleString()}번씩 끝까지 진행해 봤어요. 막힘 없음`,`Ran the ${F.g.nodes.filter(n=>n.kind==='act').length} steps to the end ${(F.res[0]?.res?.N||0).toLocaleString()} times each with real odds. No dead ends`)}</span></div>
    <table><thead><tr><th>${L('등급','Grade')}</th><th>${L('평균','Mean')}</th><th>${L('중앙값','Median')}</th><th>${L('운 나쁠 때(90%)','Unlucky (90%)')}</th><th>${L('베이스','Bases')}</th><th>${L('필수 옵션','Must-haves')}</th></tr></thead><tbody>${rows}</tbody></table>
    <span class="hint">${L('완성 1개당 div, 베이스 구입비 제외','div per finished item, base purchase not included')}</span>
    ${F.issues.length?`<ul class="iss">${F.issues.map(x=>`<li>${esc(KR()?x.kr:x.en)}</li>`).join('')}</ul>`:''}</div>`; }
function showCheck(){
  const c=S.check||[], nE=c.filter(x=>x.lv==='err').length, nW=c.filter(x=>x.lv==='warn').length;
  const ic = {err:'✗', warn:'!', ok:'✓'};
  const dc = S.last?.it ? draftCost(S.last.it, S.last.an, S.draft) : null, mp = S.draft.marketPrice, fd = v => v>=100 ? Math.round(v).toLocaleString() : v>=10 ? v.toFixed(0) : v.toFixed(1);
  const costL = dc==null ? '' : `<p class="costl ${mp && dc>mp ? 'over' : ''}">${L('예상 비용','Est. cost')} ${L('약','≈')} ${fd(dc)} div${mp?` / ${L('시세','market')} ${fd(mp)} div${dc>mp?` — ${L('시세보다 비쌈, 구입 권장','dearer than buying it')}`:''}`:''}${S.draft.compromises?` · ${L(`타협 갈림길 ${S.draft.compromises}곳`,`${S.draft.compromises} settle fork(s)`)}`:''}</p>`;
  const F=S.flow||{}, fl = F.wait ? `<div class="flow"><b>${L('플로우차트','Flowchart')}</b><span class="wait">${L('초안으로 플로우차트를 만들고 시뮬레이션으로 끝까지 진행해 보는 중…','Building the flowchart from the draft and running it to the end…')}</span></div>` : (F.res || F.err) ? flowHTML(F) : '';
  const okFlow = !!F.group, label = F.wait ? L('플로우차트 확인 중…','Checking the flowchart…') : !okFlow ? L('플로우차트 검사 통과 실패 · 올리기 불가','The flowchart did not pass, so it cannot be added') : nE ? L('오류가 있어도 만족 — 크래프팅 목록에 올리기','Add to Crafting anyway') : L('만족 — 크래프팅 목록에 올리기','Looks good — add to Crafting');
  $('#mkmsg').innerHTML = `${fl}${F.res || F.wait ? '' : costL}<div class="check"><div class="ch-h"><b>${L('검산','Verification')}</b><span>${L(`초안 ${S.draft.nodes.length}단계를 처음부터 다시 따라가며 확인함`,`Replayed the ${S.draft.nodes.length}-step draft from the start`)} · <span class="bad">${L('오류','errors')} ${nE}</span> · <span class="wn">${L('주의','warnings')} ${nW}</span></span></div>
    <ul>${c.map(x=>`<li class="${x.lv}"><span class="ic">${ic[x.lv]}</span>${esc(KR()?x.kr:x.en)}</li>`).join('')}</ul>
  </div>
    <div class="pv"><div class="pv-h"><b>${L('레시피 미리보기','Recipe preview')}</b><span>${L('확인 후 올리기 또는 삭제','Check it, then add it or delete it')}</span></div>
      <iframe id="pvf" title="${esc(L('레시피 미리보기','Recipe preview'))}" src="recipes.html?preview=1&lang=${S.lang}"></iframe>
      <div class="row" id="pvact"><button type="button" class="btn ${nE||!okFlow?'':'primary'}" id="send" ${okFlow?'':'disabled'}>${label}</button><button type="button" class="btn" id="discard">${L('삭제','Delete')}</button></div></div>`;
  const f=$('#pvf'), send=()=>{ try{ f.contentWindow.postMessage({type:'poe2-preview', recipe:F.group || F.lead || S.draft}, '*'); }catch(_){} };
  f.addEventListener('load', send, {once:true});
}
$('#clr').addEventListener('click', ()=>{ $('#txt').value=''; S.last=null; render(); $('#txt').focus(); });
$('#txt').addEventListener('paste', ()=>{ S.recIdx=null; setTimeout(run, 0); });
$('#samples').addEventListener('change', e=>{ if(e.target.id!=='recs' || e.target.value==='') return; const x=S.recSamples[+e.target.value]; S.recIdx=+e.target.value; S.fromRecipe=x.id; $('#txt').value=x.text; run(); });
fetch('data/samples.json').then(r=>r.ok?r.json():{samples:[]}).then(d=>{ S.recSamples=d.samples||[]; renderStatic(); }).catch(()=>{});
$('#samples').addEventListener('click', e=>{ const b=e.target.closest('[data-sample]'); if(!b) return; $('#txt').value=SAMPLES[+b.dataset.sample].t; run(); });
window.addEventListener('message', e=>{ const d=e.data; if(d && d.type==='poe2-reverse-in' && typeof d.text==='string'){ S.itab='build'; $('#txt').value=d.text; $('#b-from').hidden=false; $('#b-from').textContent=L('속성부여에서 받은 옵션 조합 분석 완료 · 오른쪽 요약과 아래 초안 확인','Analysed the modifier set from the Modifiers tab — see the summary and draft below.'); run(); } });
window.addEventListener('message', e=>{ const d=e.data; if(d && d.type==='poe2-lang' && (d.lang==='en'||d.lang==='kr') && d.lang!==S.lang){ S.lang=d.lang; try{ localStorage.setItem('poe2lang',d.lang); }catch(_){} render(); } });
window.addEventListener('message', e=>{ const d=e.data, f=document.getElementById('pvf'); /* preview keeps a window-sized frame and scrolls inside it, so its sticky header, progress bar and step tracking work (2026-11-11) */ });
$('#mods').addEventListener('change', e=>{
  if(e.target.id==='qrok'){ S.okQR=e.target.checked; render(); return; }
  if(e.target.dataset?.buy!=null && S.last?.an){ const i=+e.target.dataset.buy, sd=S.last.an.rows[i].m.side;
    if(e.target.checked){ [...S.buy].forEach(j=>{ if(S.last.an.rows[j]?.m.side===sd) S.buy.delete(j); }); S.buy.add(i); } else S.buy.delete(i); S.draft=null; S.sent=false; render(); return; }   // one prefix + one suffix
  if(e.target.dataset?.tier!=null){ S.tsel[+e.target.dataset.tier]=+e.target.value; if(!S.soft.has(+e.target.dataset.tier)) S.need.add(+e.target.dataset.tier); S.draft=null; S.sent=false; render(); return; }
  if(e.target.id==='qin' && S.last?.it){ const v=Math.max(0, Math.min(75, Math.round(+e.target.value||0))); S.last.it.qual=v; S.last.an=analyse(S.last.it); S.draft=null; S.okQR=true; render(); }   // quality changes the tier read
});
window.__rev = Object.assign(S, {parse, analyse, makeDraft, verifyDraft, estDiff, tryDiff, estChance, draftCost, needAn, essSwap, desSwap, bestDraft});
render();
</script>
