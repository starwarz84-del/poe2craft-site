<title>POE2 Recipe Discovery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: paste box (left) → item card with every line labelled (right), then a per-modifier analysis list. Same dark system as the recipes page. */
:root{
  --bg:#13151a; --panel:#1b1e25; --panel-2:#22262f; --line:#2e333e; --fg:#e8e3d8; --muted:#959ba6; --faint:#6b717c;
  --rare:#ead77f; --warn:#e3806f; --ok:#8fcf9a; --focus:#f2e6c4; --ink:#14161a; --pre:#e88a7a; --suf:#7fa6ff;
  --fr:#c9b27a; --des:#c08cf0; --ess:#9fd8b0; --oth:#e0a46a;
  --f-display:"Gowun Batang", "Apple SD Gothic Neo", serif;
  --f-body:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 48px;max-width:1320px;margin:0 auto}
h1{margin:0 0 4px;font-family:var(--f-display);font-size:22px;text-wrap:balance}
.lead{margin:0 0 14px;color:var(--muted);font-size:13px;max-width:70ch}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--rare);color:var(--ink);border-color:var(--rare);font-weight:600}
.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
@media (max-width:860px){.top{grid-template-columns:minmax(0,1fr)}}
.paste{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.paste textarea{width:100%;min-height:300px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:10px;font-family:var(--f-mono);font-size:12px;line-height:1.5}
.paste .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.paste .hint{font-size:12px;color:var(--faint)}
.samples{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.samples select{max-width:100%;min-width:0;flex:1 1 260px;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:12px}
.chip:hover{color:var(--fg);border-color:var(--muted)}
.err{color:var(--warn);font-size:13px}
/* summary */
.sum{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sum-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.sum-h h2{margin:0;font-family:var(--f-display);font-size:19px;color:var(--rare)}
.sum-h .sub{color:var(--muted);font-size:13px}
.slots{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.slot{display:flex;align-items:center;gap:6px}
.pips{display:inline-flex;gap:3px}
.pip{width:12px;height:12px;border-radius:3px;border:1px solid var(--line)}
.pip.p{background:var(--pre);border-color:var(--pre)} .pip.s{background:var(--suf);border-color:var(--suf)}
.pip.fr{box-shadow:inset 0 0 0 2px var(--fr)}
.traces{padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px}
.traces h3,.mods h3{margin:0;font-size:12px;letter-spacing:.06em;color:var(--faint);font-weight:600}
.trace{display:flex;gap:8px;font-size:13px;line-height:1.45}
.trace .dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--muted)}
.trace b{font-weight:600}
.empty{padding:28px 16px;color:var(--faint);text-align:center;font-size:13px}
/* per-mod analysis */
.mods{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.mods-h{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.legend{font-size:12px;color:var(--faint)}
.mod{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,2fr);gap:6px 16px}
.mod.p{border-left-color:var(--pre)} .mod.s{border-left-color:var(--suf)}
@media (max-width:760px){.mod{grid-template-columns:minmax(0,1fr)}}
.mt{display:flex;flex-direction:column;gap:4px;min-width:0}
.ml{font-size:14px;color:#a9a9ff;white-space:pre-line;overflow-wrap:anywhere}
.mod.fr .ml{color:var(--fr)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted);white-space:nowrap}
.tag.p{color:var(--pre);border-color:color-mix(in srgb,var(--pre) 45%,var(--line))}
.tag.s{color:var(--suf);border-color:color-mix(in srgb,var(--suf) 45%,var(--line))}
.tag.fr{color:var(--fr);border-color:color-mix(in srgb,var(--fr) 45%,var(--line))}
.tag.d{color:var(--des);border-color:color-mix(in srgb,var(--des) 45%,var(--line))}
.tag.e{color:var(--ess);border-color:color-mix(in srgb,var(--ess) 45%,var(--line))}
.tag.x{color:var(--oth);border-color:color-mix(in srgb,var(--oth) 45%,var(--line))}
.tag.q{color:var(--rare);border-color:color-mix(in srgb,var(--rare) 45%,var(--line))}
.nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px 12px}
@media (max-width:1000px){.nums{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.nums{grid-template-columns:repeat(2,minmax(0,1fr))}}
.num{display:flex;flex-direction:column;min-width:0}
.num small{font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num b{font-family:var(--f-mono);font-size:13px;font-weight:600}
.num i{font-style:normal;font-size:11px;color:var(--faint)}
.num b.r0{color:var(--ok)} .num b.r1{color:var(--fg)} .num b.r2{color:var(--rare)} .num b.r3{color:var(--warn)}
.bar{height:4px;border-radius:2px;background:var(--panel-2);overflow:hidden;margin-top:3px}
.bar span{display:block;height:100%;background:var(--muted)}
.note{grid-column:1/-1;font-size:12px;color:var(--muted)}
.other{background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.other .k{font-size:11px;color:var(--faint);margin-right:6px}
.bad{color:var(--warn)}
.draft{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:color-mix(in srgb,var(--rare) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--rare) 40%,var(--line));border-radius:10px;padding:12px 14px}
.draft > div{flex:1 1 320px;min-width:0}
.draft p{margin:2px 0 0;font-size:12.5px;color:var(--muted);max-width:90ch}
#mkmsg{font-size:13px}
#mkmsg .ok{color:var(--ok)}
.check{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.ch-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}.ch-h span{color:var(--muted);font-size:12.5px}
.check ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.check li{display:flex;gap:8px;font-size:13px;line-height:1.45}.check li .ic{flex:none;width:16px;text-align:center;font-weight:700}
.check li.err .ic{color:var(--warn)}.check li.warn .ic,.wn{color:var(--rare)}.check li.ok .ic{color:var(--ok)}
</style>

<div class="wrap">
  <h1 id="h1"></h1>
  <p class="lead" id="lead"></p>
  <div class="top">
    <div class="paste">
      <textarea id="txt" spellcheck="false" aria-label="item text"></textarea>
      <div class="row">
        <button type="button" class="btn primary" id="go"></button>
        <button type="button" class="btn" id="clr"></button>
        <span class="hint" id="hint"></span>
      </div>
      <div class="samples" id="samples"></div>
      <div id="msg"></div>
    </div>
    <div class="sum" id="sum"></div>
  </div>
  <div class="mods" id="mods"></div>
</div>

<script>
const S = { lang:'en', index:null, cache:{}, last:null, txt:'' };
try{ const u=new URLSearchParams(location.search).get('lang'); S.lang = u || localStorage.getItem('poe2lang') || 'en'; }catch(e){}
if(S.lang!=='kr') S.lang='en';
const KR = () => S.lang==='kr', L = (kr,en) => KR()?kr:en;
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const pct = (p, d) => p==null ? '—' : p>=0.9995 ? '100%' : p<=0 ? '0%' : (p*100 < 0.01 ? '<0.01%' : (p*100).toFixed(d ?? (p<0.01?2:p<0.1?1:0))+'%');
const tries = p => p>0 && p<1 ? Math.round(1/p).toLocaleString() : null;

/* ---------- text → template matching (same rules as the emulator's item import) ---------- */
const reEsc = t => t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const NUM = '([+-]?\\d+(?:\\.\\d+)?)';
function tplRe(line){ const ranges=[]; let src='';
  line.split(/(\(\d+(?:\.\d+)?—\d+(?:\.\d+)?\))/).forEach(part=>{ const m = part.match(/^\((\d+(?:\.\d+)?)—(\d+(?:\.\d+)?)\)$/);
    if(m){ ranges.push([+m[1],+m[2]]); src+=NUM; } else src += reEsc(part).replace(/\d+(?:\.\d+)?/g, x=>{ ranges.push([+x,+x]); return NUM; }); });
  return {re:new RegExp('^'+src.replace(/\\\+(?=\()/g,'\\+?')+'$','i'), ranges}; }
function matcher(data){ if(data._mx) return data._mx; const list=[];
  data.groups.forEach((g,gi)=>{ if(!['n','d','e','x','c'].includes(g.s)) return;
    g.t.forEach((t,ti)=>{ for(const k of [4,5]){ list.push({gi,ti,s:g.s,lines:t[k].split('\n').map(tplRe)}); } }); });
  return data._mx = list; }
function cleanLine(l){ return l.replace(/(\d)\(-?\d+(?:\.\d+)?-\d+(?:\.\d+)?\)/g,'$1').replace(/\s*\((implicit|fractured|desecrated|rune|enchant|crafted|augmented|unmet|[ㄱ-힝\s]+)\)\s*$/i,'').trim(); }
function tagOf(l){ const m=l.match(/\((implicit|fractured|desecrated|rune|enchant|crafted)\)\s*$/i)||l.match(/\((고정|분열|훼손|룬|인챈트|부여|제작)[^)]*\)\s*$/); if(!m) return ''; const k=m[1].toLowerCase(); return ({고정:'implicit',분열:'fractured',훼손:'desecrated',룬:'rune',인챈트:'enchant',부여:'enchant',제작:'crafted'})[k]||k; }
function fitScore(ranges, vals){ let sc=0; ranges.forEach((r,i)=>{ const v=Math.abs(+vals[i]); const a=Math.min(r[0],r[1]), b=Math.max(r[0],r[1]); if(v<a) sc+=(a-v)/(Math.abs(a)||1); else if(v>b) sc+=(v-b)/(Math.abs(b)||1); }); return sc; }
function findBase(lines){ let best=null;
  for(const g of S.index.groups) for(const c of g.classes) (c.names||[]).forEach((nm,bi)=>{ for(const n of nm){ if(!n) continue;
    for(const l of lines){ const exact=l===n, part=!exact && l.includes(n); if(exact||part){ const sc=(exact?1000:0)+n.length; if(!best||sc>best.sc) best={sc,cls:c.id,bi,c}; } } } });
  return best; }
async function loadCls(id){ if(!S.cache[id]) S.cache[id] = await fetch(`data/c/${encodeURIComponent(id)}.json`).then(r=>r.json()); return S.cache[id]; }

/* ---------- parse ---------- */
async function parse(txt){
  const raw = txt.replace(/\r/g,'').split('\n').map(x=>x.trim());
  const secs=[[]]; raw.forEach(l=>{ if(/^-{4,}$/.test(l)) secs.push([]); else if(l) secs[secs.length-1].push(l); });
  const head = secs[0]||[];
  const rl = head.find(l=>/^(Rarity|.*희귀도)\s*:/i.test(l)); const rv=(rl||'').split(':').slice(1).join(':').trim().toLowerCase();
  const rarity = /rare|희귀/.test(rv)?'rare':/magic|마법/.test(rv)?'magic':/unique|고유/.test(rv)?'unique':'normal';
  if(rarity==='unique') return {err:L('고유 아이템은 제작 아이템이 아니라서 역산할 수 없어요.','Unique items are not crafted, so there is nothing to reverse.')};
  const nameLines = head.filter(l=>!/:/.test(l));
  const hit = findBase(nameLines.length?nameLines:head);
  if(!hit) return {err:L('베이스 아이템 이름을 찾지 못했어요. 아이템 이름 줄까지 함께 붙여 넣어 주세요.','Base item not found. Paste the whole item text, including the name lines.')};
  const D = await loadCls(hit.cls), b = D.bases[hit.bi];
  const all = secs.flat();
  const num = re => { for(const l of all){ const m=l.match(re); if(m) return +m[1]; } return null; };
  const ilvl = num(/^(?:Item Level|아이템 레벨)\s*:\s*(\d+)/i) ?? 82;
  const qual = num(/^(?:Quality|품질|퀄리티)[^:]*:\s*\+?(\d+)%/i);
  const qualType = (all.find(l=>/^(?:Quality|품질|퀄리티)\s*\(/i.test(l))||'').match(/\(([^)]+)\)/)?.[1] || null;
  const QTK = {attack:'공격',caster:'시전',life:'생명력',mana:'마나',defences:'방어',physical:'물리',fire:'화염',cold:'냉기',lightning:'번개',chaos:'카오스',speed:'속도',attribute:'능력치',minion:'소환수'};
  const qTag = qualType ? Object.keys(QTK).find(k=>{ const q=qualType.toLowerCase(); return q.includes(k) || q.includes(k.replace(/s$/,'')) || qualType.includes(QTK[k]); }) || null : null;
  const corrupted = all.some(l=>/^(Corrupted|타락)$/i.test(l));
  const sanctified = all.some(l=>/^(Sanctified|축성됨|축성)$/i.test(l));
  const exceptional = /exceptional|특출난/i.test(nameLines.join(' '));
  const sockL = all.find(l=>/^(Sockets|소켓)\s*:/i.test(l)); const sockets = sockL ? (sockL.split(':')[1].match(/S/gi)||[]).length : null;
  const ilIdx = secs.findIndex(s=>s.some(l=>/^(Item Level|아이템 레벨)\s*:/i.test(l)));
  const lines = (ilIdx>=0 ? secs.slice(ilIdx+1) : secs.slice(1)).flat()
    .filter(l=>!/^(Sanctified|축성됨|축성|Corrupted|타락|Unidentified|미확인|Mirrored|복제됨)$/i.test(l) && !/^(Note|노트|Sockets|소켓)\s*:/i.test(l) && !/^".*"$/.test(l));
  const MX = matcher(D), mods=[], other=[], used=new Set(); let hint=null;
  for(let i=0;i<lines.length;i++){
    const l0 = lines[i];
    if(l0.startsWith('{')){   // advanced copy (Ctrl+Alt+C) header: side, tier number, affix name
      hint = { side:/Prefix|접두/.test(l0)?'p':/Suffix|접미/.test(l0)?'s':null, fr:/Fractured|분열/.test(l0), des:/Desecrated|훼손/.test(l0),
        tier:+((l0.match(/(?:Tier|등급|티어)\s*:\s*(\d+)/i)||[])[1]||0) || null, name:(l0.match(/["“]([^"”]+)["”]/)||[])[1]||null,
        imp:/Implicit|고정/.test(l0) };
      continue; }
    const tag = tagOf(l0);
    if(tag==='implicit' || hint?.imp){ other.push({k:'imp', l:cleanLine(l0)}); hint=null; continue; }
    if(tag==='rune'){ other.push({k:'rune', l:cleanLine(l0)}); hint=null; continue; }
    if(/unrevealed|공개되지 않은|미공개/i.test(l0)){ mods.push({unrev:true, side:hint?.side || null, l:l0}); hint=null; continue; }
    const l = cleanLine(l0); let best=null;
    for(const c of MX){
      if(tag==='enchant' ? c.s!=='c' : c.s==='c') continue;
      const vals=[]; let ok=true;
      for(let k=0;k<c.lines.length;k++){ const ln = k===0 ? l : cleanLine(lines[i+k]||''); const m = ln.match(c.lines[k].re); if(!m){ ok=false; break; } vals.push(...m.slice(1)); }
      if(!ok) continue;
      const g=D.groups[c.gi], t=g.t[c.ti];
      if(hint?.side && g.g!==hint.side) continue;
      if(used.has(c.gi)) continue;
      const ranges = c.lines.flatMap(x=>x.ranges);
      const boost = qTag && qual && g.tg.includes(qTag) ? 1+qual/100 : 1;   // catalyst quality scales these values up
      const bv = vals.map((v,vi)=>ranges[vi] && ranges[vi][0]!==ranges[vi][1] ? +v/boost : +v);
      let sc = fitScore(ranges, bv) * 10 + ({n:0,d:tag==='desecrated'||hint?.des?-1:2,e:1,x:1.5,c:0})[c.s] - c.lines.length*0.5;
      if((tag==='desecrated'||hint?.des) && c.s!=='d') sc+=0.5;
      if(hint?.name && (t[2]===hint.name || t[3]===hint.name || t[2].replace(/^-\s*/,'')===hint.name)) sc-=5;
      if(hint?.tier && c.ti+1===hint.tier) sc-=0.3;
      if(!best || sc<best.sc) best={sc,c,vals:bv,raw:vals,ranges,boost};
    }
    if(!best){ other.push({k:'?', l:l0}); hint=null; continue; }
    const {c,vals,ranges,boost}=best;
    if(c.s==='c'){ other.push({k:'ench', l}); i+=c.lines.length-1; hint=null; continue; }
    const text = [l, ...Array.from({length:c.lines.length-1},(_,k)=>cleanLine(lines[i+1+k]||''))].join('\n');
    // roll inside the tier range; values outside it were pushed by quality, sanctification or corruption
    let roll=null, out=false; const first = ranges.findIndex(r=>r[0]!==r[1]);
    if(first>=0){ const r=ranges[first], v=Math.abs(+vals[first]), a=Math.min(...r), bb=Math.max(...r), tol=boost>1?1/boost+0.5:1e-9; out = v<a-tol || v>bb+tol; roll = out ? null : Math.max(0,Math.min(1,bb===a?1:(v-a)/(bb-a))); }
    used.add(c.gi);
    mods.push({gi:c.gi, ti:c.ti, side:D.groups[c.gi].g, q:boost>1, fr: tag==='fractured' || !!hint?.fr, desTag: tag==='desecrated' || !!hint?.des, crafted: tag==='crafted', roll, out, l:text, hintTier:hint?.tier||null});
    i += c.lines.length-1; hint=null;
  }
  return {sockets, qTag, cls:hit.cls, bi:hit.bi, cat:S.index.groups.find(g=>g.classes.some(c=>c.id===hit.cls))?.id, clsName:hit.c, D, b, rarity, ilvl, qual, qualType, corrupted, sanctified, exceptional, name: rarity==='rare' && nameLines.length>=2 ? nameLines[0] : null, mods, other};
}

/* ---------- analyse ---------- */
const SRC = { n:['일반 속성','Regular'], d:['훼손 전용','Desecrated only'], e:['에센스 전용','Essence only'], x:['별세계','Otherworldly'] };
const LORDS = { amanamu:['아마나무','Amanamu'], kurgal:['쿠르갈','Kurgal'], ulaman:['울라만','Ulaman'] };
function analyse(it){
  const D=it.D, b=it.b, cap={p:3+(b.pd||0), s:3+(b.sd||0)};
  if(it.rarity==='magic'){ cap.p=1; cap.s=1; }
  const flat = D.groups.filter(g=>g.s==='n').every(g=>g.t.every(x=>!(x[1]>1)));
  const real = it.mods.filter(m=>m.gi!=null);
  const cnt = {p:it.mods.filter(m=>m.side==='p').length, s:it.mods.filter(m=>m.side==='s').length};
  if(it.rarity==='rare' && it.mods.filter(m=>m.side==='s').length===cap.s+1){ cap.s++; cap.serle=true; }   // Serle's Triumph adds a fourth suffix
  const rows = it.mods.map((m,j)=>{
    if(m.unrev) return {m, unrev:true};
    const g=D.groups[m.gi], t=g.t[m.ti];
    const tiersHere = g.t.map((x,ti)=>({ti, l:x[0], w:x[1]})).filter(x=>x.l<=it.ilvl && x.w>0);
    const row = {m, g, t, tierNo:m.ti+1, tierCnt:g.t.length, avail:tiersHere.length, src:g.s};
    // the source the item text and the modifier's pool point to

  const want = an.rows.filter(r=>!r.unrev && r.m.gi!=null && r.how!=='x').map(r=>r.m.gi), have = mods.filter(m=>m.gi!=null).map(m=>m.gi);
  const miss = want.filter(gi=>!have.includes(gi)), extra = have.filter(gi=>!want.includes(gi));
  if(miss.length) add('err',`완성 상태에 빠진 줄: ${miss.map(nameOf).join(', ')}`,`Missing from the finished item: ${miss.map(nameOf).join(', ')}`);
  if(extra.length) add('warn',`붙여 넣은 아이템에 없는 줄이 남아요: ${extra.map(nameOf).join(', ')}`,`Lines not on the pasted item: ${extra.map(nameOf).join(', ')}`);
  const jl = mods.filter(m=>m.junk && !m.unrev).length; if(jl) add('warn',`완성 상태에 잡옵 ${jl}줄이 남아요.`,`${jl} junk line(s) remain at the end.`);
  ['p','s'].forEach(sd=>{ if(count(sd)>cap[sd]) add('err',`${sd==='p'?'접두':'접미'} ${count(sd)}줄로 최대 ${cap[sd]}줄을 넘어요.`,'Too many lines on one side.'); });
  if(it.sockets!=null && it.sockets < (d.sockets||0)) add('warn',`붙여 넣은 아이템은 룬 소켓 ${it.sockets}개인데 초안은 ${d.sockets}개가 필요해요.`,`The pasted item has ${it.sockets} socket(s); the draft needs ${d.sockets}.`);
  const unk = an.rows.filter(r=>r.unknown && !r.m.fr); if(unk.length) add('warn',`가중치를 모르는 줄 ${unk.length}개(${unk.map(r=>lk(r).slice(0,18)).join(', ')}) — 해당 단계 확률은 계산되지 않아요.`,`${unk.length} line(s) with unknown weights; those steps have no odds.`);
  if(!out.some(o=>o.lv==='err')) add('ok','완성 상태가 붙여 넣은 아이템과 같고, 모든 단계가 규칙에 맞아요.','The finished state matches the pasted item and every step follows the rules.');
  return out;
}

/* ---------- render ---------- */
function renderStatic(){
  document.documentElement.lang = KR()?'ko':'en';
  $('#h1').textContent = L('레시피 발굴 — 아이템 분석','Recipe discovery — item analysis');
  $('#lead').textContent = L('게임에서 아이템 위에 마우스를 올리고 Ctrl+C(가능하면 Ctrl+Alt+C 상세 복사)로 복사해 붙여 넣으세요. 각 옵션이 어디서 왔는지(일반·분열·훼손·에센스), 몇 티어인지, 그리고 그 줄을 다시 뽑을 확률을 가중치 데이터로 계산해요.',
    'Hover the item in game, press Ctrl+C (Ctrl+Alt+C for the advanced copy) and paste it here. Each modifier is matched to its source (regular, fractured, desecrated, essence), its tier, and the odds of rolling it again, from weight data.');
  $('#txt').placeholder = L('아이템 텍스트를 여기에 붙여 넣기','Paste item text here');
  $('#go').textContent = L('분석','Analyse'); $('#clr').textContent = L('지우기','Clear');
  $('#hint').textContent = L('붙여 넣으면 바로 분석해요','Analyses as soon as you paste');
  $('#samples').innerHTML = `<span class="hint" style="align-self:center">${L('예시','Samples')}:</span>` + SAMPLES.map((s,i)=>`<button type="button" class="chip" data-sample="${i}">${esc(s.n[KR()?0:1])}</button>`).join('')
    + (S.recSamples?.length ? `<select id="recs" aria-label="${L('등록된 레시피의 완성템','Finished item of a registered recipe')}"><option value="">${L('등록된 레시피 완성템 불러오기…','Load a registered recipe\'s finished item…')}</option>${S.recSamples.map((x,i)=>`<option value="${i}"${S.recIdx===i?' selected':''}>${esc(KR()?x.base.kr:x.base.en)} | ${esc(KR()?x.title.kr:x.title.en)}</option>`).join('')}</select>` : '');
}
function render(){
  renderStatic();
  const a=S.last;
  if(!a){ $('#sum').innerHTML = `<div class="empty">${L('붙여 넣은 아이템의 요약이 여기에 나와요.','A summary of the pasted item appears here.')}</div>`; $('#mods').innerHTML=''; return; }
  if(a.err){ $('#sum').innerHTML = `<div class="empty bad">${esc(a.err)}</div>`; $('#mods').innerHTML=''; return; }
  const it=a.it, an=a.an, bn = KR()?it.b.kr:it.b.en;
  const rar = {rare:L('희귀','Rare'), magic:L('마법','Magic'), normal:L('일반','Normal')}[it.rarity];
  const pips = side => { const list = an.rows.filter(r=>r.m.side===side); return Array.from({length:an.cap[side]},(_,k)=>{ const r=list[k]; return `<span class="pip ${r?side:''} ${r?.m.fr?'fr':''}"></span>`; }).join(''); };
  $('#sum').innerHTML = `<div class="sum-h"><h2>${esc(it.name || bn)}</h2><span class="sub">${it.name?esc(bn)+' · ':''}${it.exceptional?L('특출난 · ','Exceptional · '):''}${rar} · ${L('아이템 레벨','Item level')} ${it.ilvl}${it.qual!=null?` · ${L('퀄리티','Quality')} ${it.qual}%${it.qualType?' ('+esc(it.qualType)+')':''}`:''}</span></div>
    <div class="slots"><span class="slot">${L('접두','Prefix')} <span class="pips">${pips('p')}</span> ${an.cnt.p}/${an.cap.p}</span><span class="slot">${L('접미','Suffix')} <span class="pips">${pips('s')}</span> ${an.cnt.s}/${an.cap.s}</span></div>
    <div class="traces"><h3>${L('제작 흔적','WHAT THE ITEM TELLS US')}</h3>${an.tr.length ? an.tr.map(t=>`<div class="trace"><span class="dot" style="background:${t.c}"></span><span>${t.t}</span></div>`).join('') : `<div class="trace"><span class="dot"></span><span>${L('일반 옵션만 있어요. 진화·확장·제왕·엑잘/카오스로 만들 수 있는 구성이에요.','Regular modifiers only: transmute, augment, regal and exalt/chaos can make this.')}</span></div>`}</div>`;
  const rowsHTML = an.rows.map(r=>{
    const m=r.m, side=m.side;
    if(r.unrev) return `<div class="mod ${side||''}"><div class="mt"><div class="ml">${esc(m.l)}</div><div class="tags">${side?`<span class="tag ${side}">${side==='p'?L('접두','Prefix'):L('접미','Suffix')}</span>`:''}<span class="tag d">${L('미공개 훼손','Unrevealed')}</span></div></div><div class="note">${L('심연의 우물에서 공개하면 3개 중 하나를 고를 수 있어요.','Reveal at the Well of Souls to pick one of three.')}</div></div>`;
    const how = {fr:['fr',L('분열','Fractured')], d:['d',L('훼손','Desecrated')], e:['e',r.g.sub[KR()?0:1]], x:['x',L('별세계','Otherworldly')], sc:['x',L('증강물 ','Augment ')+r.g.sub[KR()?0:1]], n:['',L('일반','Regular')]}[r.how];
    const tags = [`<span class="tag ${side}">${side==='p'?L('접두','Prefix'):L('접미','Suffix')}</span>`,
      `<span class="tag ${how[0]}">${how[1]}</span>`,
      m.fr && r.g.s!=='n' ? `<span class="tag ${r.g.s}">${SRC[r.g.s][KR()?0:1]}</span>` : '',
      r.lord ? `<span class="tag d">${L(LORDS[r.lord][0]+' 전용', LORDS[r.lord][1]+' only')}</span>` : '',
      m.out ? `<span class="tag q">${L('범위 초과','Above range')}</span>` : '', m.q ? `<span class="tag q">${L('퀄리티 적용','Quality applied')}</span>` : '',
      `<span class="tag">${esc(r.t[KR()?2:3])}</span>`].join('');
    const tierB = r.g.s==='n' ? `<b class="${r.tierNo<=1?'r2':''}">T${r.tierNo}</b><i>${L(`${r.tierCnt}단계 중 · 요구 Lv ${r.t[0]}`,`of ${r.tierCnt} · lvl ${r.t[0]}`)}</i>` : `<b>—</b><i>${L(`요구 Lv ${r.t[0]}`,`lvl ${r.t[0]}`)}</i>`;
    const rollB = m.roll!=null ? `<b>${Math.round(m.roll*100)}%</b><div class="bar"><span style="width:${Math.max(3,m.roll*100)}%"></span></div>` : m.out ? `<b>${L('범위 밖','out')}</b><i>${L('퀄리티·축성','quality/sanctify')}</i>` : `<b>${L('고정값','fixed')}</b>`;
    let odds;
    if(r.unknown){ const why = r.unknown==='w1' ? L('가중치 미정','weight not set') : r.unknown==='x' ? L('가중치 미확인','weights unknown') : r.unknown==='flat' ? L('가중치 미확인','weights unknown') : '';
      odds = r.g.s!=='n' && r.unknown!=='x' ? '' : `<div class="num"><small>${L('엑잘 확률','Exalt odds')}</small><b>—</b><i>${why}</i></div>`; }
    if(r.g.s==='n' && r.unknown!=='flat' && r.unknown!=='w1'){
      odds = `<div class="num"><small>${L('엑잘 1회 (면 무관)','Exalt, any side')}</small><b class="${rareCls(r.pAny)}">${pct(r.pAny)}</b><i>${tries(r.pAny)?L(`약 ${tries(r.pAny)}회에 1번`,`~1 in ${tries(r.pAny)}`):''}</i></div>
        <div class="num"><small>${L('좌측·우측 징조 사용','With side omen')}</small><b class="${rareCls(r.pOmen)}">${pct(r.pOmen)}</b><i>${rareTxt(r.pOmen)}</i></div>
        <div class="num"><small>${L('완벽한 엑잘 + 징조','Perfect exalt + omen')}</small><b class="${rareCls(r.pPerfect)}">${pct(r.pPerfect)}</b><i>${L('Lv 50 미만 제외','drops < lvl 50')}</i></div>`;
    } else if(r.g.s!=='n' && !odds){
      odds = `<div class="num" style="grid-column:span 3;min-width:0"><small>${L('얻는 방법','How it is obtained')}</small><b style="font-family:var(--f-body);font-weight:500">${r.g.s==='e'?L(`${esc(r.g.sub[0])}로만 붙어요`,`Only from ${esc(r.g.sub[1])}`):r.how==='sc'?L(`룬 소켓에 「${esc(r.g.sub[0])}」 장착 후 굴림`,`Socket ${esc(r.g.sub[1])}, then roll`):r.g.s==='d'?L('훼손 뼈 → 심연의 우물 공개에서만','Only from a desecration reveal'):L('훼손 뼈의 별세계 결과','Otherworldly bone outcome')}</b></div>`;
    }
    if(r.g.s==='n' && r.t[0]>it.ilvl) odds = `<div class="num" style="grid-column:span 3;min-width:0"><small>${L('엑잘 확률','Exalt odds')}</small><b class="r3">0%</b><i>${L(`이 티어는 아이템 레벨 ${r.t[0]} 이상에서만 붙어요`,`this tier needs item level ${r.t[0]}+`)}</i></div>`;
    const wNote = r.g.s==='n' && r.wGroup && !r.unknown ? `<div class="note">${L(`가중치 ${r.wTier.toLocaleString()} (이 티어) · 옵션 전체 ${r.wGroup.toLocaleString()} · 같은 면에서 이 옵션 비중 ${pct(r.groupShare)} · 이 옵션 중 T${r.tierNo} 이상 ${pct(r.tierShare)}`,`Weight ${r.wTier.toLocaleString()} (this tier) · ${r.wGroup.toLocaleString()} for the modifier · ${pct(r.groupShare)} of its side · T${r.tierNo}+ is ${pct(r.tierShare)} of its rolls`)}${m.fr?L(' · 지금은 분열이라 다시 뽑을 필요 없음',' · fractured, so it never needs rolling again'):''}</div>` : '';
    return `<div class="mod ${side} ${m.fr?'fr':''}"><div class="mt"><div class="ml">${esc(m.l)}</div><div class="tags">${tags}</div></div>
      <div class="nums"><div class="num"><small>${L('티어','Tier')}</small>${tierB}</div><div class="num"><small>${L('값 굴림','Roll')}</small>${rollB}</div>${odds||''}</div>${wNote}</div>`;
  }).join('');
  const kName = {imp:L('고정','Implicit'), rune:L('룬','Rune'), ench:L('타락 인챈트','Corruption enchant'), '?':L('인식 못 함','Not recognised')};
  const otherHTML = it.other.length ? `<div class="other">${it.other.map(o=>`<div class="${o.k==='?'?'bad':''}"><span class="k">${kName[o.k]}</span>${esc(o.l)}</div>`).join('')}</div>` : '';
  const canDraft = it.rarity!=='normal' && an.rows.some(r=>!r.unrev);
  $('#mods').innerHTML = (canDraft ? `<div class="draft"><div><b>${L('레시피 초안 만들기','Make a recipe draft')}</b><p>${L('분석 결과로 제작 순서를 만든 뒤, 처음부터 다시 따라가며 검산하고 레시피 탭에 올려요: 분열 베이스 → 완벽한 진화·확장·제왕 → 에센스 → 어려운 줄부터 엑잘(징조) → 훼손·공개 → 기폭제. 확률은 레시피 엔진이 가중치로 계산해요.','Builds a crafting order from this analysis and opens it in Recipes: fractured base → Perfect transmute/augment/regal → essences → exalts with omens, hardest line first → desecration and reveal → catalysts. The recipes engine computes the odds from weights.')}</p></div><button type="button" class="btn primary" id="mk">${L('초안 만들기','Make draft')}</button></div><div id="mkmsg"></div>` : '') + `<div class="mods-h"><h3>${L('옵션별 분석','MODIFIER BY MODIFIER')}</h3><span class="legend">${L('확률 = 지금 아이템에서 이 줄만 빠졌다고 보고, 다음 엑잘 한 번에 이 옵션이 이 티어 이상으로 붙을 확률','Odds = with this line removed, the chance one exalt adds this modifier at this tier or better')}</span></div>${rowsHTML}${otherHTML}`;
}

async function run(){
  const txt = $('#txt').value; if(!txt.trim()){ S.last=null; render(); return; }
  if(!S.index) [S.index, S.craft] = await Promise.all([fetch('data/index.json').then(r=>r.json()), fetch('data/crafting.json').then(r=>r.json())]);
  S.txt = txt;
  try{ const it = await parse(txt); S.last = it.err ? {err:it.err} : {it, an:analyse(it)}; }
  catch(e){ S.last = {err:L('분석 중 오류가 났어요: ','Analysis failed: ')+e.message}; console.error(e); }
  render();
}

$('#go').addEventListener('click', run);
$('#mods').addEventListener('click', e=>{
  if(e.target.closest('#mk') && S.last?.it){ const r = makeDraft(S.last.it, S.last.an); S.draft = r; S.check = verifyDraft(S.last.it, S.last.an, r); showCheck(); return; }
  if(e.target.closest('#send') && S.draft){ const r=S.draft;
    try{ const k='poe2r:drafts', a=JSON.parse(localStorage.getItem(k)||'[]').filter(x=>x.id!==r.id); a.unshift(r); localStorage.setItem(k, JSON.stringify(a.slice(0,12))); }catch(_){}
    const inShell = window.parent && window.parent!==window;
    if(inShell){ try{ window.parent.postMessage({type:'poe2-draft', recipe:r}, '*'); }catch(_){} }
    $('#mkmsg').innerHTML = `<span class="ok">${inShell ? L(`초안 ${r.nodes.length}단계를 레시피 탭에 올렸어요.`,`Draft with ${r.nodes.length} steps added to Recipes.`) : L(`초안 ${r.nodes.length}단계를 저장했어요. 레시피 탭에서 확인하세요.`,`Draft with ${r.nodes.length} steps saved. Open the Recipes tab to see it.`)}</span>`; }

function showCheck(){
  const c=S.check||[], nE=c.filter(x=>x.lv==='err').length, nW=c.filter(x=>x.lv==='warn').length;
  const ic = {err:'✗', warn:'!', ok:'✓'};
  $('#mkmsg').innerHTML = `<div class="check"><div class="ch-h"><b>${L('검산','Verification')}</b><span>${L(`초안 ${S.draft.nodes.length}단계를 처음부터 다시 따라가며 확인했어요`,`Replayed the ${S.draft.nodes.length}-step draft from the start`)} · <span class="bad">${L('오류','errors')} ${nE}</span> · <span class="wn">${L('주의','warnings')} ${nW}</span></span></div>
    <ul>${c.map(x=>`<li class="${x.lv}"><span class="ic">${ic[x.lv]}</span>${esc(KR()?x.kr:x.en)}</li>`).join('')}</ul>
    <div class="row"><button type="button" class="btn ${nE?'':'primary'}" id="send">${nE ? L('오류가 있어도 레시피 탭에 올리기','Add to Recipes anyway') : L('레시피 탭에 올리기','Add to Recipes')}</button></div></div>`;
}
$('#clr').addEventListener('click', ()=>{ $('#txt').value=''; S.last=null; render(); $('#txt').focus(); });

fetch('data/samples.json').then(r=>r.ok?r.json():{samples:[]}).then(d=>{ S.recSamples=d.samples||[]; renderStatic(); }).catch(()=>{});
$('#samples').addEventListener('click', e=>{ const b=e.target.closest('[data-sample]'); if(!b) return; $('#txt').value=SAMPLES[+b.dataset.sample].t; run(); });
window.addEventListener('message', e=>{ const d=e.data; if(d && d.type==='poe2-lang' && (d.lang==='en'||d.lang==='kr') && d.lang!==S.lang){ S.lang=d.lang; try{ localStorage.setItem('poe2lang',d.lang); }catch(_){} render(); } });
window.__rev = Object.assign(S, {parse, analyse, makeDraft, verifyDraft});
render();
